<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wizard Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Lato:ital,wght@0,300;0,400;1,300&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Lato', system-ui, sans-serif;
    }

    :root {
      --gold: #c9a84c;
      --gold-lt: #e5c96e;
      --gold-dim: rgba(201, 168, 76, .45);
      --gold-faint: rgba(201, 168, 76, .07);
      --border: rgba(201, 168, 76, .2);
      --border-hi: rgba(201, 168, 76, .52);
      --silver: #cdc9e0;
      --silver-dim: rgba(205, 201, 224, .58);
      --muted: rgba(205, 201, 224, .3);
      --success: #3dca6e;
      --danger: #d96060;
      --plan: #6090e0;
      --stream: #50c0a0;
      --cache: rgba(180, 140, 255, .7);
      --voice: #e05080;
      --R: 16px;
      --W: 680px;
      --ease-s: cubic-bezier(.34, 1.56, .64, 1);
    }

    .stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .panel {
      width: var(--W);
      max-width: 96vw;
      background: linear-gradient(158deg, rgba(13, 10, 28, .98) 0%, rgba(5, 4, 15, 1) 100%);
      border: 1px solid var(--border);
      border-radius: var(--R);
      box-shadow: 0 32px 80px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 255, 255, .025), 0 0 60px rgba(201, 168, 76, .04);
      backdrop-filter: blur(30px);
      overflow: hidden;
      opacity: 0;
      transform: scale(.95) translateY(-12px);
      transition: opacity .16s ease, transform .18s var(--ease-s);
      position: relative;
    }

    .panel.visible {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    /* arched ornamental cap — matches index.html's modal theming */
    .panel::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 22px;
      background: radial-gradient(ellipse at center, rgba(201, 168, 76, .2), transparent 72%);
      border-bottom: 1px solid var(--border-hi);
      border-radius: 0 0 65px 65px;
      pointer-events: none;
    }

    /* ── Input row ── */
    .input-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 14px;
      border-bottom: 1px solid transparent;
      transition: border-color .2s;
    }

    .input-row.sep {
      border-bottom-color: rgba(201, 168, 76, .12);
    }

    .glyph {
      font-size: 20px;
      flex-shrink: 0;
      line-height: 1;
      filter: drop-shadow(0 0 6px rgba(201, 168, 76, .4));
      animation: glow 3.2s ease-in-out infinite;
    }

    @keyframes glow {

      0%,
      100% {
        filter: drop-shadow(0 0 5px rgba(201, 168, 76, .3))
      }

      50% {
        filter: drop-shadow(0 0 14px rgba(201, 168, 76, .75))
      }
    }

    .cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--silver);
      font-size: 16px;
      font-weight: 300;
      font-family: 'Lato', system-ui, sans-serif;
      caret-color: var(--gold);
      min-width: 0;
    }

    .cmd-input::placeholder {
      color: var(--muted);
      font-style: italic;
      font-size: 14px;
    }

    .input-ctrls {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    /* mic button — compact for overlay */
    .mic-btn {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      background: var(--gold-faint);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .15s;
      font-size: 13px;
      position: relative;
    }

    .mic-btn:hover {
      border-color: var(--border-hi);
      background: rgba(201, 168, 76, .12);
    }

    .mic-btn.listening {
      background: rgba(224, 80, 128, .15);
      border-color: rgba(224, 80, 128, .5);
      animation: micpulse 1s ease-in-out infinite;
    }

    .mic-btn.listening-auto {
      background: rgba(224, 80, 128, .25);
      border-color: rgba(224, 80, 128, .75);
      animation: micpulse .65s ease-in-out infinite;
      box-shadow: 0 0 12px rgba(224, 80, 128, .3);
    }

    @keyframes micpulse {

      0%,
      100% {
        box-shadow: 0 0 0 2px rgba(224, 80, 128, .12);
      }

      50% {
        box-shadow: 0 0 0 5px rgba(224, 80, 128, .0);
      }
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(201, 168, 76, .12);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: sp .6s linear infinite;
      display: none;
    }

    @keyframes sp {
      to {
        transform: rotate(360deg)
      }
    }

    .spinner.on {
      display: block;
    }

    .kbd-hint {
      font-size: 9.5px;
      color: var(--muted);
      letter-spacing: .07em;
      white-space: nowrap;
      user-select: none;
    }

    /* ── Voice interim bar ── */
    .voice-interim {
      display: none;
      padding: 5px 17px;
      background: rgba(224, 80, 128, .07);
      border-bottom: 1px solid rgba(224, 80, 128, .18);
      align-items: center;
      gap: 7px;
    }

    .voice-interim.visible {
      display: flex;
    }

    .vi-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--voice);
      flex-shrink: 0;
      animation: vipulse .65s ease-in-out infinite alternate;
    }

    @keyframes vipulse {
      from {
        opacity: .5;
        transform: scale(.8)
      }

      to {
        opacity: 1;
        transform: scale(1.2)
      }
    }

    .vi-txt {
      font-size: 11.5px;
      color: rgba(240, 140, 170, .9);
      font-style: italic;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .vi-mode {
      font-size: 8.5px;
      font-family: 'Cinzel', serif;
      color: rgba(224, 80, 128, .55);
      letter-spacing: .1em;
      flex-shrink: 0;
    }

    /* ── Plan micro-bar ── */
    .plan-bar {
      display: none;
      padding: 7px 17px;
      background: rgba(96, 144, 224, .06);
      border-bottom: 1px solid rgba(96, 144, 224, .15);
      align-items: center;
      gap: 10px;
    }

    .plan-bar.visible {
      display: flex;
    }

    .plan-lbl {
      font-size: 11px;
      color: rgba(140, 180, 255, .75);
      font-weight: 300;
      white-space: nowrap;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .plan-track {
      width: 80px;
      flex-shrink: 0;
      height: 2px;
      background: rgba(96, 144, 224, .14);
      border-radius: 2px;
      overflow: hidden;
    }

    .plan-fill {
      height: 100%;
      background: var(--plan);
      border-radius: 2px;
      transition: width .35s ease;
    }

    .plan-ct {
      font-size: 10px;
      color: rgba(96, 144, 224, .5);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Stream micro-bar ── */
    .stream-bar {
      display: none;
      padding: 6px 17px;
      background: rgba(80, 192, 160, .05);
      border-bottom: 1px solid rgba(80, 192, 160, .13);
      align-items: center;
      gap: 8px;
    }

    .stream-bar.visible {
      display: flex;
    }

    .stream-spin {
      width: 11px;
      height: 11px;
      border: 1.5px solid rgba(80, 192, 160, .18);
      border-top-color: var(--stream);
      border-radius: 50%;
      animation: sp .55s linear infinite;
      flex-shrink: 0;
    }

    .stream-lbl {
      font-size: 11px;
      color: rgba(100, 210, 185, .7);
      font-weight: 300;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .stream-prev {
      font-size: 10px;
      font-family: 'Courier New', monospace;
      color: rgba(80, 192, 160, .4);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    /* ── Messages ── */
    .messages {
      max-height: 420px;
      overflow-y: auto;
    }

    .messages:empty {
      display: none;
    }

    .msg {
      display: flex;
      gap: 9px;
      padding: 9px 17px;
      border-bottom: 1px solid rgba(201, 168, 76, .04);
      animation: mi .18s ease forwards;
      opacity: 0;
    }

    .msg:last-child {
      border-bottom: none;
    }

    @keyframes mi {
      from {
        opacity: 0;
        transform: translateY(4px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .msg.user {
      background: rgba(201, 168, 76, .03);
      flex-direction: row-reverse;
    }

    .msg.wizard {
      background: transparent;
    }

    .msg.action {
      background: rgba(80, 192, 160, .025);
    }

    .msg.error {
      background: rgba(217, 96, 96, .03);
    }

    .msg.plan {
      background: rgba(96, 144, 224, .025);
    }

    .msg.cache {
      background: rgba(180, 140, 255, .018);
    }

    .msg.voice-msg {
      background: rgba(224, 80, 128, .025);
    }

    .msg.proactive {
      background: rgba(168, 120, 224, .03);
    }

    .msg.proactive.advanced {
      background: rgba(217, 140, 96, .04);
    }

    .msg.proactive.max {
      background: rgba(217, 60, 70, .05);
    }

    .msg-ico {
      font-size: 12px;
      flex-shrink: 0;
      margin-top: 2px;
      opacity: .6;
    }

    .msg-body {
      flex: 1;
      min-width: 0;
    }

    .msg-text {
      font-size: 13px;
      line-height: 1.65;
      color: var(--silver-dim);
      font-weight: 300;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .msg-text {
      color: var(--silver);
      text-align: right;
    }

    .msg.action .msg-text {
      color: rgba(100, 215, 165, .85);
    }

    .msg.error .msg-text {
      color: var(--danger);
      opacity: .85;
    }

    .msg.plan .msg-text {
      color: rgba(140, 180, 255, .8);
    }

    .msg.cache .msg-text {
      color: rgba(180, 140, 255, .75);
    }

    .msg.voice-msg .msg-text {
      color: rgba(240, 150, 175, .8);
    }

    .msg.proactive .msg-text {
      color: rgba(200, 170, 235, .85);
    }

    .msg.proactive.advanced .msg-text {
      color: rgba(230, 180, 140, .9);
    }

    .msg.proactive.max .msg-text {
      color: rgba(235, 140, 150, .92);
    }

    .msg-foot {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }

    .msg.user .msg-foot {
      justify-content: flex-end;
    }

    .msg-time {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: .05em;
    }

    .msg-badge {
      font-size: 9px;
      font-family: 'Cinzel', serif;
      letter-spacing: .08em;
      padding: 1px 6px;
      border-radius: 3px;
      opacity: .7;
    }

    .msg-badge.chat {
      color: var(--gold);
    }

    .msg-badge.action {
      color: var(--stream);
    }

    .msg-badge.plan {
      color: var(--plan);
    }

    .msg-badge.error {
      color: var(--danger);
    }

    .msg-badge.cache {
      color: var(--cache);
    }

    .msg-badge.voice {
      color: var(--voice);
    }

    .msg-badge.proactive {
      color: rgba(168, 120, 224, .9);
    }

    .msg-badge.proactive.advanced {
      color: rgba(230, 170, 120, .95);
    }

    .msg-badge.proactive.max {
      color: rgba(235, 130, 140, .95);
    }

    /* Rich */
    .r-img {
      display: block;
      max-width: 100%;
      max-height: 140px;
      border-radius: 7px;
      margin-top: 6px;
      border: 1px solid var(--border);
      object-fit: contain;
    }

    .r-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 5px;
    }

    .r-chip {
      background: var(--gold-faint);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 10.5px;
      color: var(--silver-dim);
    }

    .r-tbl {
      margin-top: 6px;
    }

    .r-row {
      display: flex;
      gap: 7px;
      padding: 2px 0;
      border-bottom: 1px solid rgba(201, 168, 76, .05);
    }

    .r-row:last-child {
      border-bottom: none;
    }

    .r-k {
      color: var(--gold);
      opacity: .7;
      width: 82px;
      flex-shrink: 0;
      font-size: 10.5px;
    }

    .r-v {
      color: var(--silver-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
    }

    .r-out {
      margin-top: 5px;
      font-size: 10.5px;
      font-family: 'Courier New', monospace;
      color: var(--muted);
      white-space: pre-wrap;
      max-height: 80px;
      overflow-y: auto;
    }

    .r-path {
      margin-top: 4px;
      font-size: 10.5px;
      color: var(--gold);
      opacity: .55;
      font-style: italic;
    }

    .r-steps {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .r-vault-choices {
      margin-top: 7px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }

    .r-vault-choice-btn {
      background: var(--gold-faint);
      border: 1px solid var(--border-hi);
      border-radius: 100px;
      padding: 3px 10px;
      font-size: 10.5px;
      color: var(--gold-lt);
      cursor: pointer;
      transition: all .15s;
    }

    .r-vault-choice-btn:hover:not(:disabled) {
      background: rgba(201, 168, 76, .18);
    }

    .r-vault-choice-btn:disabled {
      opacity: .4;
      cursor: default;
    }

    .r-vault-choice-status {
      font-size: 10px;
      color: var(--muted);
    }

    .r-step {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 5px;
    }

    .r-step.ok {
      color: rgba(100, 210, 130, .85);
      background: rgba(80, 192, 130, .05);
    }

    .r-step.err {
      color: var(--danger);
      background: rgba(217, 96, 96, .05);
    }

    /* ── Suggestions ── */
    .sugg-row {
      display: none;
      padding: 7px 17px;
      border-bottom: 1px solid rgba(201, 168, 76, .07);
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .sugg-row.visible {
      display: flex;
    }

    .sugg-row::-webkit-scrollbar {
      height: 2px;
    }

    .sugg-row::-webkit-scrollbar-thumb {
      background: var(--gold-dim);
    }

    .sugg-lbl {
      font-size: 9px;
      font-family: 'Cinzel', serif;
      color: var(--muted);
      letter-spacing: .15em;
      flex-shrink: 0;
    }

    .sugg-pill {
      background: var(--gold-faint);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 3px 11px;
      font-size: 11px;
      font-weight: 300;
      color: var(--silver-dim);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all .15s;
    }

    .sugg-pill:hover {
      border-color: var(--border-hi);
      color: var(--gold-lt);
      background: rgba(201, 168, 76, .11);
    }

    /* ── Typing dots ── */
    .tdots {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 1px 0;
    }

    .tdots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      opacity: .25;
      animation: tda 1.25s ease-in-out infinite;
    }

    .tdots span:nth-child(2) {
      animation-delay: .17s
    }

    .tdots span:nth-child(3) {
      animation-delay: .34s
    }

    @keyframes tda {

      0%,
      60%,
      100% {
        opacity: .22;
        transform: scale(.8)
      }

      30% {
        opacity: 1;
        transform: scale(1.2)
      }
    }

    /* ── Footer ── */
    .footer {
      display: none;
      padding: 6px 17px;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(201, 168, 76, .07);
    }

    .footer.visible {
      display: flex;
    }

    .foot-brand {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      color: var(--muted);
      font-style: italic;
      letter-spacing: .06em;
    }

    .foot-keys {
      display: flex;
      gap: 9px;
    }

    .fk {
      font-size: 9.5px;
      color: var(--muted);
    }

    .fk kbd {
      background: rgba(255, 255, 255, .035);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 8.5px;
      color: rgba(205, 201, 224, .4);
      font-family: inherit;
    }

    ::-webkit-scrollbar {
      width: 3px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--gold-dim);
      border-radius: 2px;
    }

    /* ══════════════════════ PERMISSION MODAL (overlay-native) ══════════════════════
   Compact version of index.html's permission modal, scaled for the overlay's
   floating-panel form factor. Same contract: main.js sends 'permission-request'
   with {id,title,detail,danger}; this replies with 'permission-response'
   {id,approved}. Renders ON TOP of the overlay panel itself.
*/
    .perm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 1, 8, .55);
      z-index: 900;
      align-items: flex-start;
      justify-content: center;
      padding-top: 40px;
    }

    .perm-overlay.visible {
      display: flex;
    }

    .perm-box {
      width: 400px;
      max-width: 92vw;
      background: linear-gradient(165deg, rgba(13, 10, 26, .99), rgba(6, 5, 16, 1));
      border: 1px solid var(--gold-dim);
      border-radius: 24px 24px 16px 16px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .75), 0 0 40px rgba(201, 168, 76, .1);
      padding: 22px 20px 16px;
      text-align: center;
      position: relative;
      animation: permAppear .22s var(--ease-s);
    }

    .perm-box.danger {
      border-color: rgba(217, 96, 96, .5);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .75), 0 0 40px rgba(217, 96, 96, .14);
    }

    @keyframes permAppear {
      from {
        opacity: 0;
        transform: scale(.93) translateY(8px)
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0)
      }
    }

    .perm-box::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 22px;
      background: radial-gradient(ellipse at center, rgba(201, 168, 76, .26), transparent 72%);
      border-radius: 0 0 65px 65px;
      pointer-events: none;
    }

    .perm-box.danger::before {
      background: radial-gradient(ellipse at center, rgba(217, 96, 96, .28), transparent 72%);
    }

    .perm-sigil {
      width: 42px;
      height: 42px;
      margin: 0 auto 10px;
      border-radius: 50%;
      border: 1px solid var(--border-hi);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      background: radial-gradient(circle, rgba(201, 168, 76, .14), transparent 70%);
      box-shadow: 0 0 18px rgba(201, 168, 76, .25);
    }

    .perm-box.danger .perm-sigil {
      border-color: rgba(217, 96, 96, .5);
      background: radial-gradient(circle, rgba(217, 96, 96, .16), transparent 70%);
      box-shadow: 0 0 18px rgba(217, 96, 96, .3);
    }

    .perm-title {
      font-family: 'Cinzel', serif;
      font-size: 15px;
      color: var(--gold-lt);
      letter-spacing: .03em;
      margin-bottom: 6px;
    }

    .perm-box.danger .perm-title {
      color: #e59a9a;
    }

    .perm-severity {
      display: inline-block;
      font-family: 'Cinzel', serif;
      font-size: 8.5px;
      letter-spacing: .09em;
      text-transform: uppercase;
      padding: 2px 9px;
      border-radius: 100px;
      margin-bottom: 10px;
      border: 1px solid;
    }

    .perm-severity.moderate {
      color: var(--gold-lt);
      border-color: var(--border-hi);
      background: var(--gold-faint);
    }

    .perm-severity.high {
      color: #e59a9a;
      border-color: rgba(217, 96, 96, .5);
      background: rgba(217, 96, 96, .1);
    }

    .perm-detail {
      font-size: 11.5px;
      font-weight: 300;
      color: var(--silver-dim);
      line-height: 1.6;
      white-space: pre-wrap;
      margin-bottom: 16px;
      max-height: 160px;
      overflow-y: auto;
      text-align: left;
      background: rgba(0, 0, 0, .25);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
    }

    .perm-btn-row {
      display: flex;
      gap: 8px;
    }

    .perm-btn {
      flex: 1;
      padding: 9px 0;
      border-radius: 100px;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: .06em;
      cursor: pointer;
      transition: all .15s;
      border: 1px solid var(--border);
    }

    .perm-btn.cancel {
      background: rgba(255, 255, 255, .03);
      color: var(--silver-dim);
    }

    .perm-btn.cancel:hover {
      border-color: var(--border-hi);
      color: var(--silver);
      background: rgba(255, 255, 255, .06);
    }

    .perm-btn.allow {
      background: linear-gradient(135deg, var(--gold), #9e6e18);
      border: none;
      color: #05040f;
      font-weight: 500;
    }

    .perm-btn.allow:hover {
      opacity: .9;
      box-shadow: 0 4px 16px rgba(201, 168, 76, .3);
    }

    .perm-box.danger .perm-btn.allow {
      background: linear-gradient(135deg, #d96060, #a03838);
      color: #fff;
    }

    .perm-box.danger .perm-btn.allow:hover {
      box-shadow: 0 4px 16px rgba(217, 96, 96, .35);
    }
  </style>
</head>

<body>
  <div class="stage" id="stage">
    <div class="panel" id="panel">

      <div class="input-row" id="inputRow">
        <span class="glyph">🧙</span>
        <input class="cmd-input" id="cmdInput" type="text"
             autocomplete="off" spellcheck="false"
             placeholder="Ask Wizard anything… or 🎙️ click mic (Alt = auto-submit)">
        <div class="input-ctrls">
          <button class="mic-btn" id="micBtn" title="Click: drop-to-input · Alt+click: auto-submit">🎙️</button>
          <div class="spinner" id="spinner"></div>
          <span class="kbd-hint" id="hint">↵ send · esc close</span>
        </div>
      </div>

      <!-- Voice interim display -->
      <div class="voice-interim" id="voiceInterim">
        <div class="vi-dot"></div>
        <span class="vi-txt" id="viTxt">Listening…</span>
        <span class="vi-mode" id="viMode">DROP-TO-INPUT</span>
      </div>

      <div class="plan-bar" id="planBar">
        <span class="plan-lbl" id="planLbl">Running plan…</span>
        <div class="plan-track">
          <div class="plan-fill" id="planFill" style="width:0%"></div>
        </div>
        <span class="plan-ct" id="planCt"></span>
      </div>

      <div class="stream-bar" id="streamBar">
        <div class="stream-spin"></div>
        <span class="stream-lbl" id="streamLbl">Streaming…</span>
        <span class="stream-prev" id="streamPrev"></span>
      </div>

      <div class="sugg-row" id="suggRow">
        <span class="sugg-lbl">NEXT</span>
      </div>

      <div class="messages" id="messages"></div>

      <div class="footer" id="footer">
        <span class="foot-brand" id="footBrand">✦ Wizard Autopilot · Mistral ministral-14b</span>
        <div class="foot-keys">
          <span class="fk"><kbd>↑↓</kbd> history</span>
          <span class="fk"><kbd>Alt</kbd>+🎙️ auto</span>
          <span class="fk"><kbd>Esc</kbd> close</span>
        </div>
      </div>

    </div>
  </div>

  <!-- ══════════════════════ PERMISSION MODAL ══════════════════════ -->
  <div class="perm-overlay" id="permOverlay">
    <div class="perm-box" id="permBox">
      <div class="perm-sigil" id="permSigil">🛡️</div>
      <div class="perm-title" id="permTitle">Allow this?</div>
      <div class="perm-severity" id="permSeverity"></div>
      <div class="perm-detail" id="permDetail"></div>
      <div class="perm-btn-row">
        <button class="perm-btn cancel" id="permCancelBtn">Cancel</button>
        <button class="perm-btn allow" id="permAllowBtn">✦ Allow</button>
      </div>
    </div>
  </div>

  <script>
    const{ipcRenderer}=require('electron');

const panel      = document.getElementById('panel');
const inputEl    = document.getElementById('cmdInput');
const msgsEl     = document.getElementById('messages');
const spinner    = document.getElementById('spinner');
const footer     = document.getElementById('footer');
const footBrand  = document.getElementById('footBrand');
const inputRow   = document.getElementById('inputRow');
const hint       = document.getElementById('hint');
const suggRow    = document.getElementById('suggRow');
const micBtn     = document.getElementById('micBtn');
const voiceInterim = document.getElementById('voiceInterim');
const viTxt      = document.getElementById('viTxt');
const viMode     = document.getElementById('viMode');
const planBar    = document.getElementById('planBar');
const planFill   = document.getElementById('planFill');
const planLbl    = document.getElementById('planLbl');
const planCt     = document.getElementById('planCt');
const streamBar  = document.getElementById('streamBar');
const streamLbl  = document.getElementById('streamLbl');
const streamPrv  = document.getElementById('streamPrev');

let busy      = false;
let cmdHist   = [];
let histIdx   = -1;
let savedIn   = '';

/* Pull real version once so the footer never goes stale again */
ipcRenderer.invoke('get-version').then(v=>{
  if(v) footBrand.textContent = `✦ Wizard Autopilot v${v} · Mistral ministral-14b`;
}).catch(()=>{});

/* ── IPC show/hide ── */
ipcRenderer.on('overlay-init',(_,{offsetY})=>{
  document.getElementById('stage').style.paddingTop=(offsetY||0)+'px';
  requestAnimationFrame(()=>{ panel.classList.add('visible'); inputEl.focus(); });
});
ipcRenderer.on('overlay-focus',()=>{ panel.classList.add('visible'); inputEl.focus(); requestAnimationFrame(reportH); });
ipcRenderer.on('overlay-clear',()=>{ clearMsgs(); });

/* ── Plan ── */
ipcRenderer.on('plan-step',(_,{step,total,label})=>{
  planBar.classList.add('visible');
  planLbl.textContent=label||`Step ${step}/${total}…`;
  planFill.style.width=`${Math.round((step-1)/total*100)}%`;
  planCt.textContent=`${step}/${total}`;
  reportH();
});
ipcRenderer.on('plan-step-done',(_,{step,total,message})=>{
  planFill.style.width=`${Math.round(step/total*100)}%`;
  planLbl.textContent=(message||'').slice(0,55);
  if(step>=total) setTimeout(()=>{ planBar.classList.remove('visible'); reportH(); },1800);
});

/* ── Stream ── */
ipcRenderer.on('stream-start',(_,{filename,label})=>{ streamBar.classList.add('visible'); streamLbl.textContent=`Generating ${label||'file'}…`; streamPrv.textContent=''; reportH(); });
ipcRenderer.on('stream-chunk',(_,{preview})=>{ streamPrv.textContent=preview||''; });
ipcRenderer.on('stream-end',(_,{filename})=>{ streamLbl.textContent=`✓ ${filename||'File'} saved`; setTimeout(()=>{ streamBar.classList.remove('visible'); reportH(); },2000); });
ipcRenderer.on('thinking',(_,{message})=>{ if(message){ streamBar.classList.add('visible'); streamLbl.textContent=message; streamPrv.textContent=''; reportH(); } });

/* ── Suggestions ── */
ipcRenderer.on('suggestions',(_,{suggestions})=>{
  if(!suggestions?.length) return;
  suggRow.querySelectorAll('.sugg-pill').forEach(p=>p.remove());
  suggestions.forEach(s=>{
    const b=document.createElement('button');
    b.className='sugg-pill'; b.textContent=s;
    b.onclick=()=>{ if(!busy){ inputEl.value=s; cast(); } };
    suggRow.appendChild(b);
  });
  suggRow.classList.add('visible'); reportH();
});

/* ── Reminder ── */
ipcRenderer.on('reminder',(_,{message})=>{ addMsg('wizard',`⏰ Reminder: ${message}`,null,{isChat:true}); });

/* ── Proactive check-in (only ever sent if user opted in — see main.js) ── */
ipcRenderer.on('proactive-message',(_,{message, advanced, tier, result})=>{
  if(!message) return;
  const t = tier || (advanced ? 'advanced' : 'basic');
  const cls = t==='max' ? 'proactive max' : t==='advanced' ? 'proactive advanced' : 'proactive';
  addMsg(cls, message, result||null, {isProactive:true, tier:t});
});

/* Scheduled tasks fire regardless of window visibility (OS notification
   already went off in main.js) — this just logs it to the overlay chat
   too, using the existing 'action' teal styling since it's closer in
   spirit to a completed task than a check-in. */
ipcRenderer.on('scheduled-task-fired',(_,{message,label,result})=>{
  addMsg('action', message, result||null, {thinking: `scheduled: ${label||'task'}`});
});

/* ── Voice result (auto-submit path comes back here from main.js) ── */
ipcRenderer.on('voice-result',(_,res)=>{
  if(!res) return;
  removeTyping();
  const text=res.message||(res.success?'Done.':'Failed.');
  let type;
  if(!res.success)       type='error';
  else if(res.isPlan)    type='plan';
  else if(res.fromCache) type='cache';
  else if(res.isChat)    type='wizard';
  else if(res.result)    type='action';
  else                   type='wizard';
  addMsg(type,text,res.result||null,res);
  busy=false; spinner.classList.remove('on'); hint.style.visibility='';
});

/* ── Helpers ── */
function esc(t){const d=document.createElement('div');d.textContent=String(t??'');return d.innerHTML;}
function ts(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function fileIcon(e){return({'.pdf':'📄','.doc':'📝','.docx':'📝','.xls':'📊','.xlsx':'📊','.png':'🖼️','.jpg':'🖼️','.jpeg':'🖼️','.gif':'🖼️','.mp4':'🎥','.mp3':'🎵','.zip':'📦','.exe':'⚙️','.txt':'📃','.html':'🌐','.js':'📜','.py':'🐍','.json':'📋','.svg':'🎨','.ts':'📜','.jsx':'⚛️','.tsx':'⚛️','.rs':'🦀','.go':'🐹','.rb':'💎','.sh':'📟','.md':'📋'})[e]||'📄';}

function buildRich(result){
  if(!result) return '';
  let r='';
  if(result.base64) r+=`<img class="r-img" src="data:image/png;base64,${result.base64}" alt="screenshot">`;
  if(result.files?.length){
    const chips=result.files.slice(0,12).map(f=>`<span class="r-chip">${f.isDir?'📁':fileIcon(f.ext)} ${esc(f.name)}</span>`).join('');
    r+=`<div class="r-chips">${chips}</div>`;
    if(result.totalCount>result.files.length) r+=`<div style="margin-top:3px;font-size:10px;color:var(--muted);font-style:italic">…and ${result.totalCount-result.files.length} more</div>`;
  }
  if(result.info){ const rows=Object.entries(result.info).map(([k,v])=>`<div class="r-row"><span class="r-k">${esc(k)}</span><span class="r-v">${esc(String(v))}</span></div>`).join(''); r+=`<div class="r-tbl">${rows}</div>`; }
  if(result.output)              r+=`<div class="r-out">${esc(result.output.substring(0,350))}</div>`;
  if(result.content!==undefined) r+=`<div class="r-out">${esc(String(result.content).substring(0,250))}</div>`;
  if(result.path&&!result.base64&&!result.files) r+=`<div class="r-path">✦ ${esc(result.path)}</div>`;
  if(result.results) r+=`<div class="r-steps">${result.results.map(s=>`<div class="r-step ${s.success?'ok':'err'}"><span>${s.success?'✓':'✗'}</span><span>${esc(s.message||'')}</span></div>`).join('')}</div>`;
  if(result.sources?.length){
    r+=`<div class="r-chips">${result.sources.map(s=>`<span class="r-chip" title="${esc(s.path)}">📄 ${esc(s.name)}</span>`).join('')}</div>`;
  }
  if(result.choices?.length){
    const rid = 'vc'+Math.random().toString(36).slice(2,9);
    r+=`<div class="r-vault-choices" id="${rid}">${result.choices.map(c=>
      `<button class="r-vault-choice-btn" onclick="pickVaultEntry('${c.id}', this, '${rid}')">${c.kind==='card'?'💳':'🔑'} ${esc(c.label)}</button>`
    ).join('')}<div class="r-vault-choice-status" id="${rid}-status"></div></div>`;
  }
  return r;
}

async function pickVaultEntry(entryId, btnEl, containerId){
  const container = document.getElementById(containerId);
  container.querySelectorAll('.r-vault-choice-btn').forEach(b=>b.disabled=true);
  const status = document.getElementById(containerId+'-status');
  status.textContent = 'Confirming…';
  try{
    const res = await ipcRenderer.invoke('vault-autofill-direct', { entryId });
    status.textContent = res?.message || (res?.success ? 'Done.' : 'Failed.');
    status.style.color = res?.success ? 'var(--success)' : 'var(--danger)';
  }catch(e){
    status.textContent = 'Error: '+e.message;
    status.style.color = 'var(--danger)';
  }
}

function reportH(){ ipcRenderer.send('overlay-resize',{h:panel.offsetHeight}); }
function hidePanel(){ panel.classList.remove('visible'); setTimeout(()=>ipcRenderer.send('overlay-hide'),160); }
function clearMsgs(){
  msgsEl.innerHTML='';
  inputRow.classList.remove('sep');
  footer.classList.remove('visible');
  suggRow.classList.remove('visible');
  planBar.classList.remove('visible');
  streamBar.classList.remove('visible');
  voiceInterim.classList.remove('visible');
  suggRow.querySelectorAll('.sugg-pill').forEach(p=>p.remove());
  reportH();
}

const ICONS={user:'👤',wizard:'🧙',action:'✦',error:'⚠️',plan:'📋',cache:'⚡','voice-msg':'🎙️',proactive:'🔮'};
function addMsg(type,text,result,meta){
  const rich=buildRich(result);
  const baseType = type.split(' ')[0]; // 'proactive advanced'/'proactive max' → 'proactive' for icon/class lookups
  const tier = meta?.tier || (meta?.advanced ? 'advanced' : 'basic');
  const tierIcon = { basic:'🔮', advanced:'⚡', max:'👑' };
  const tierLabel = { basic:'check-in', advanced:'advanced check-in', max:'max check-in' };
  let badge='';
  if(meta?.thinking)       badge=`<span class="msg-badge action">${esc(meta.thinking)}</span>`;
  else if(baseType==='action')      badge=`<span class="msg-badge action">action</span>`;
  else if(baseType==='error')  badge=`<span class="msg-badge error">error</span>`;
  else if(baseType==='plan')   badge=`<span class="msg-badge plan">plan</span>`;
  else if(baseType==='cache')  badge=`<span class="msg-badge cache">cache</span>`;
  else if(baseType==='proactive') badge=`<span class="msg-badge proactive${tier!=='basic'?' '+tier:''}">${tierLabel[tier]}</span>`;
  else if(meta?.isVoice)   badge=`<span class="msg-badge voice">voice</span>`;
  else if(meta?.thinking)  badge=`<span class="msg-badge action">${esc(meta.thinking)}</span>`;
  const el=document.createElement('div');
  el.className=`msg ${type}`;
  el.innerHTML=`
    <span class="msg-ico">${baseType==='proactive'?tierIcon[tier]:(ICONS[baseType]||'·')}</span>
    <div class="msg-body">
      <div class="msg-text">${esc(text)}${rich}</div>
      <div class="msg-foot"><span class="msg-time">${ts()}</span>${badge}</div>
    </div>`;
  msgsEl.appendChild(el);
  msgsEl.scrollTop=msgsEl.scrollHeight;
  inputRow.classList.add('sep');
  footer.classList.add('visible');
  requestAnimationFrame(reportH);
}
function addTyping(){
  const el=document.createElement('div');el.className='msg wizard';el.id='typing';
  el.innerHTML=`<span class="msg-ico">🧙</span><div class="msg-body"><div class="msg-text"><div class="tdots"><span></span><span></span><span></span></div></div></div>`;
  msgsEl.appendChild(el); msgsEl.scrollTop=msgsEl.scrollHeight;
  inputRow.classList.add('sep');
  requestAnimationFrame(reportH);
}
function removeTyping(){ document.getElementById('typing')?.remove(); }

/* ══════════════════════════════════════════════════════
   PERMISSION MODAL
   Same contract as index.html: main.js sends 'permission-request'
   with {id,title,detail,danger}; we reply with 'permission-response'
   {id,approved}. This is what makes it SAFE for main.js's
   requestPermission() to target the overlay window when it's the
   one the user is actually looking at — before this existed, main.js
   deliberately always fell back to the main window instead, because
   sending a prompt here with nothing listening would've silently
   hung until the 2-minute timeout.
   ══════════════════════════════════════════════════════ */
const permOverlay  = document.getElementById('permOverlay');
const permBox      = document.getElementById('permBox');
const permSigil    = document.getElementById('permSigil');
const permTitle    = document.getElementById('permTitle');
const permDetail   = document.getElementById('permDetail');
const permCancelBtn= document.getElementById('permCancelBtn');
const permAllowBtn = document.getElementById('permAllowBtn');
const permSeverity = document.getElementById('permSeverity');
let currentPermId  = null;

ipcRenderer.on('permission-request', (_, { id, title, detail, danger, severity }) => {
  currentPermId = id;
  permTitle.textContent = title || 'Allow this?';
  permDetail.textContent = detail || '';
  permBox.classList.toggle('danger', !!danger);
  permSigil.textContent = danger ? '⚠️' : '🛡️';
  const sev = severity || (danger ? 'high' : 'moderate');
  permSeverity.className = 'perm-severity ' + sev;
  permSeverity.textContent = sev === 'high' ? '🔴 Explicit confirmation' : '🟡 User approval';
  permOverlay.classList.add('visible');
  // Make sure the overlay panel itself is visible/focused so the
  // prompt isn't invisible behind a hidden panel.
  panel.classList.add('visible');
});

function respondPermission(approved){
  if(!currentPermId) return;
  ipcRenderer.send('permission-response', { id: currentPermId, approved });
  currentPermId = null;
  permOverlay.classList.remove('visible');
}
permCancelBtn.addEventListener('click', ()=>respondPermission(false));
permAllowBtn.addEventListener('click', ()=>respondPermission(true));

/* ══════════════════════════════════════════════════════
   VOICE CONTROL (overlay)
   Click mic   → drop-to-input
   Alt + click → auto-submit (sends via ipcRenderer voice-input)
   Alt held mid-session → switches to auto-submit live
   ══════════════════════════════════════════════════════ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition   = null;
let voiceActive   = false;
let voiceAutoMode = false;

function startVoice(autoSubmit){
  if(!SR){ addMsg('error','Speech recognition not available.',null,null); return; }
  if(voiceActive){ stopVoice(); return; }

  voiceAutoMode = autoSubmit;
  voiceActive   = true;

  recognition = new SR();
  recognition.continuous     = false;
  recognition.interimResults = true;
  recognition.lang           = 'en-US';
  recognition.maxAlternatives= 1;

  micBtn.classList.add(autoSubmit ? 'listening-auto' : 'listening');
  voiceInterim.classList.add('visible');
  viTxt.textContent  = 'Listening…';
  viMode.textContent = autoSubmit ? 'AUTO-SUBMIT' : 'DROP-TO-INPUT';
  reportH();

  recognition.onresult = e => {
    let interim='', final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      e.results[i].isFinal ? (final+=t) : (interim+=t);
    }
    if(interim) viTxt.textContent='🎙 '+interim;
    if(final){
      viTxt.textContent='✓ '+final;
      const text=final.trim();
      if(voiceAutoMode){
        // Auto-submit: show user bubble, show typing, hand off to main
        addMsg('voice-msg', text, null, {isVoice:true});
        addTyping();
        busy=true; spinner.classList.add('on'); hint.style.visibility='hidden';
        ipcRenderer.send('voice-input',{text});
        stopVoice();
      } else {
        // Drop-to-input
        inputEl.value=text;
        inputEl.focus();
        stopVoice();
      }
    }
  };

  recognition.onerror = e => {
    viTxt.textContent='Error: '+(e.error==='not-allowed'?'Mic denied':e.error);
    setTimeout(stopVoice,1800);
  };
  recognition.onend = ()=>{ if(voiceActive) stopVoice(); };
  recognition.start();
}

function stopVoice(){
  voiceActive=false;
  micBtn.classList.remove('listening','listening-auto');
  try{ recognition?.stop(); }catch{}
  recognition=null;
  setTimeout(()=>{ voiceInterim.classList.remove('visible'); reportH(); },1000);
}

/* Alt key switches mode mid-session */
document.addEventListener('keydown',e=>{
  if(e.key==='Alt' && voiceActive && !voiceAutoMode){
    voiceAutoMode=true;
    micBtn.classList.replace('listening','listening-auto');
    viMode.textContent='AUTO-SUBMIT';
  }
});
document.addEventListener('keyup',e=>{
  if(e.key==='Alt' && voiceActive && voiceAutoMode){
    voiceAutoMode=false;
    micBtn.classList.replace('listening-auto','listening');
    viMode.textContent='DROP-TO-INPUT';
  }
});

micBtn.addEventListener('click',e=>{ startVoice(e.altKey); });

/* ── Cast ── */
async function cast(){
  const cmd=inputEl.value.trim();
  if(!cmd||busy) return;
  cmdHist.unshift(cmd);
  if(cmdHist.length>60) cmdHist.pop();
  histIdx=-1; savedIn='';
  inputEl.value='';
  busy=true; spinner.classList.add('on'); hint.style.visibility='hidden';
  suggRow.classList.remove('visible'); suggRow.querySelectorAll('.sugg-pill').forEach(p=>p.remove());
  addMsg('user',cmd,null,null);
  addTyping();
  try{
    const res=await ipcRenderer.invoke('execute-command',cmd);
    removeTyping();
    const text=res.message||(res.success?'Done.':'Failed.');
    let type;
    if(!res.success)       type='error';
    else if(res.isPlan)    type='plan';
    else if(res.fromCache) type='cache';
    else if(res.isChat)    type='wizard';
    else if(res.result)    type='action';
    else                   type='wizard';
    addMsg(type,text,res.result||null,res);
  }catch(e){
    removeTyping(); addMsg('error',`Error: ${e.message}`,null,null);
  }finally{
    busy=false; spinner.classList.remove('on'); hint.style.visibility=''; inputEl.focus();
  }
}

/* ── Keyboard ── */
inputEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); cast(); return; }
  if(e.key==='Escape'){
    if(permOverlay.classList.contains('visible')){ respondPermission(false); return; }
    if(voiceActive){ stopVoice(); return; }
    if(msgsEl.children.length>0){ clearMsgs(); inputEl.value=''; }
    else hidePanel();
    return;
  }
  if(e.key==='Enter' && permOverlay.classList.contains('visible')){ respondPermission(true); return; }
  if(e.key==='ArrowUp'){
    e.preventDefault();
    if(histIdx===-1) savedIn=inputEl.value;
    if(histIdx<cmdHist.length-1){ histIdx++; inputEl.value=cmdHist[histIdx]; setTimeout(()=>inputEl.setSelectionRange(9999,9999),0); }
    return;
  }
  if(e.key==='ArrowDown'){
    e.preventDefault();
    if(histIdx>0){ histIdx--; inputEl.value=cmdHist[histIdx]; }
    else if(histIdx===0){ histIdx=-1; inputEl.value=savedIn; }
    setTimeout(()=>inputEl.setSelectionRange(9999,9999),0);
  }
});

/* Global Esc/Enter fallback for the permission modal even if focus isn't in the input */
document.addEventListener('keydown', e=>{
  if(!permOverlay.classList.contains('visible')) return;
  if(e.key==='Escape') respondPermission(false);
  if(e.key==='Enter')  respondPermission(true);
});

document.addEventListener('mousedown',e=>{
  if(permOverlay.classList.contains('visible')) return; // don't dismiss overlay panel behind an open permission prompt
  if(!panel.contains(e.target)) hidePanel();
});
  </script>
</body>
