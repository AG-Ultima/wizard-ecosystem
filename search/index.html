<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Wizard Search — AI-powered web search with real, clickable results and intelligent summaries. Part of the Wizard Ecosystem by Arnav Gupta.">
    <meta name="keywords" content="Wizard Search, AI search engine, web search, AI summary, Wizard Ecosystem">
    <meta name="author" content="Arnav Gupta">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#080612">
    <meta property="og:title" content="Wizard Search — AI-Powered Web Search">
    <meta property="og:description" content="Real, clickable web results with AI-generated summaries. Part of the Wizard Ecosystem.">
    <meta property="og:url" content="https://wizardecosystem.dev/search">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Wizard Search — AI-Powered Web Search">
    <link rel="canonical" href="https://wizardecosystem.dev/search">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Wizard Search",
      "url": "https://wizardecosystem.dev/search",
      "description": "AI-powered web search with real clickable results and intelligent summaries.",
      "applicationCategory": "SearchApplication",
      "author": { "@type": "Person", "name": "Arnav Gupta" }
    }
    </script>

    <title>Wizard Search — AI-Powered Web Search</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ink:           #080612;
            --ink-2:         #0e0b1e;
            --ink-3:         #13102a;
            --ink-4:         #1a1635;
            --gold:          #c9a84c;
            --gold-light:    #e8c97a;
            --gold-dim:      rgba(201,168,76,0.12);
            --gold-glow:     rgba(201,168,76,0.22);
            --violet:        #7c5cbf;
            --violet-dim:    rgba(124,92,191,0.2);
            --silver:        #d4d0e8;
            --silver-dim:    rgba(212,208,232,0.5);
            --muted:         rgba(212,208,232,0.35);
            --border:        rgba(201,168,76,0.16);
            --border-strong: rgba(201,168,76,0.42);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--ink);
            color: var(--silver);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Canvas starfield ── */
        #starfield {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        /* ── Ambient blobs ── */
        .amb {
            position: fixed;
            border-radius: 50%;
            filter: blur(130px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
            animation: drift 20s ease-in-out infinite alternate;
        }
        .amb-1 { width: 600px; height: 600px; top: -200px; left: -200px; background: radial-gradient(circle, #3a1f6e, transparent 70%); }
        .amb-2 { width: 500px; height: 500px; bottom: -100px; right: -100px; background: radial-gradient(circle, #5c3a1e, transparent 70%); animation-delay: -10s; }
        @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(40px,30px) scale(1.1); } }

        /* ── Layout ── */
        .shell {
            position: relative;
            z-index: 10;
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 24px 80px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ── Top Nav ── */
        .topnav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 44px;
            padding: 14px 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 20px;
            backdrop-filter: blur(12px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
        }
        .logo-glyph {
            font-size: 28px;
            animation: levitate 5s ease-in-out infinite;
            filter: drop-shadow(0 0 12px rgba(201,168,76,0.4));
        }
        @keyframes levitate { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        .logo-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.01em;
        }

        .app-nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .nav-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 100px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
        }
        .nav-pill:hover { background: rgba(255,255,255,0.05); border-color: var(--border-strong); color: var(--silver); }
        .nav-pill.active {
            background: linear-gradient(135deg, rgba(201,168,76,0.18), rgba(201,168,76,0.06));
            border-color: var(--border-strong);
            color: var(--gold-light);
        }
        .nav-pill-icon { font-size: 15px; }

        .nav-right { display: flex; align-items: center; gap: 10px; }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 5px 14px 5px 6px;
        }
        .user-avatar {
            width: 28px; height: 28px;
            background: linear-gradient(135deg, var(--violet), #3d2280);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }
        .user-email-txt { font-size: 12px; color: var(--silver-dim); }
        .logout-btn {
            background: none; border: none;
            font-size: 13px; color: var(--muted);
            cursor: pointer; margin-left: 4px;
            transition: color 0.2s;
        }
        .logout-btn:hover { color: #e07070; }

        .signin-btn {
            background: linear-gradient(135deg, var(--gold), #a8751e);
            border: none;
            border-radius: 100px;
            padding: 8px 20px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink);
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .signin-btn:hover { opacity: 0.85; }

        /* ── Hero (search mode) ── */
        .search-hero {
            text-align: center;
            padding: 40px 0 36px;
        }
        .hero-glyph {
            font-size: 72px;
            display: block;
            margin-bottom: 18px;
            animation: levitate 5s ease-in-out infinite;
            filter: drop-shadow(0 0 40px rgba(201,168,76,0.3)) drop-shadow(0 0 80px rgba(124,92,191,0.2));
        }
        .hero-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(38px, 6vw, 64px);
            font-weight: 300;
            color: var(--silver);
            letter-spacing: -0.02em;
            line-height: 1;
            margin-bottom: 10px;
        }
        .hero-title em {
            font-style: italic;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-sub {
            font-size: 15px;
            font-weight: 300;
            color: var(--muted);
            letter-spacing: 0.02em;
        }

        /* ── Search Bar ── */
        .search-wrap {
            max-width: 720px;
            margin: 0 auto 50px;
        }
        .search-field {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 6px 6px 6px 22px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .search-field:focus-within {
            border-color: rgba(201,168,76,0.55);
            box-shadow: 0 0 0 3px rgba(201,168,76,0.07), 0 8px 32px rgba(0,0,0,0.3);
        }
        .search-ico { font-size: 16px; margin-right: 10px; opacity: 0.45; flex-shrink: 0; }
        .search-field input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 300;
            color: var(--silver);
            padding: 13px 0;
        }
        .search-field input::placeholder { color: var(--muted); }
        .search-go {
            background: linear-gradient(135deg, var(--gold), #a8751e);
            border: none;
            border-radius: 100px;
            padding: 11px 26px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--ink);
            cursor: pointer;
            letter-spacing: 0.03em;
            transition: opacity 0.2s, box-shadow 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .search-go:hover { opacity: 0.88; box-shadow: 0 4px 20px rgba(201,168,76,0.35); }

        /* ── Results ── */
        .results-area {
            flex: 1;
            animation: fade-up 0.4s ease both;
        }
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* AI Summary */
        .ai-summary {
            background: linear-gradient(135deg, rgba(201,168,76,0.06), rgba(124,92,191,0.08));
            border: 1px solid var(--border);
            border-left: 3px solid var(--gold);
            border-radius: 20px;
            padding: 26px 28px;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
        }
        .ai-summary::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, var(--gold), transparent);
            opacity: 0.4;
        }
        .summary-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .summary-icon { font-size: 22px; }
        .summary-label {
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--gold-light);
            letter-spacing: 0.01em;
        }
        .summary-text {
            font-size: 14.5px;
            font-weight: 300;
            color: var(--silver-dim);
            line-height: 1.75;
        }

        /* Source badge */
        .source-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            background: var(--gold-dim);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 12px;
            font-weight: 400;
            color: var(--gold);
            letter-spacing: 0.04em;
            margin-bottom: 20px;
        }

        /* Result card */
        .result-card {
            background: rgba(255,255,255,0.025);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px 24px;
            margin-bottom: 12px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), border-color 0.25s, background 0.25s, box-shadow 0.25s;
        }
        .result-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--gold), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .result-card:hover {
            transform: translateX(6px);
            border-color: var(--border-strong);
            background: rgba(201,168,76,0.04);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .result-card:hover::before { opacity: 1; }

        .result-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--gold-light);
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .result-url {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 10px;
            word-break: break-all;
            opacity: 0.7;
        }
        .result-snippet {
            font-size: 14px;
            font-weight: 300;
            color: var(--silver-dim);
            line-height: 1.65;
        }

        /* Loading */
        .loading-spinner {
            text-align: center;
            padding: 80px 20px;
        }
        .spinner-ring {
            width: 48px; height: 48px;
            border: 2px solid rgba(201,168,76,0.15);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            font-weight: 300;
            font-style: italic;
            color: var(--muted);
        }

        /* No results */
        .no-results {
            text-align: center;
            padding: 80px 20px;
        }
        .no-results-icon {
            font-size: 56px;
            margin-bottom: 20px;
            opacity: 0.4;
            display: block;
        }
        .no-results h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            font-weight: 400;
            color: var(--silver-dim);
            margin-bottom: 10px;
        }
        .no-results p { font-size: 14px; font-weight: 300; color: var(--muted); margin-bottom: 24px; }
        .fallback-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .fallback-btn {
            border: none;
            border-radius: 100px;
            padding: 10px 22px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .fallback-btn:hover { opacity: 0.82; }
        .fallback-google { background: #4285f4; }
        .fallback-ddg    { background: #de5833; }

        /* Error toast */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            padding: 12px 24px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink);
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: linear-gradient(135deg, var(--gold), #a8751e); }
        .toast.error   { background: #c0444a; color: white; }

        /* ── Footer ── */
        footer {
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 30px;
            margin-top: 60px;
        }
        .footer-brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 17px;
            font-weight: 400;
            color: rgba(212,208,232,0.3);
            margin-bottom: 6px;
        }
        .footer-meta { font-size: 12px; color: var(--muted); }
        .footer-meta a { color: var(--gold); text-decoration: none; opacity: 0.7; }
        .footer-meta a:hover { opacity: 1; }

        /* ── Auth Modal ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5,3,14,0.93);
            backdrop-filter: blur(18px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: linear-gradient(160deg, var(--ink-3), var(--ink-2));
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 48px 44px;
            width: 400px;
            max-width: 92vw;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            animation: modal-in 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes modal-in {
            from { opacity: 0; transform: scale(0.9) translateY(16px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-glyph { font-size: 48px; margin-bottom: 16px; display: block; }
        .modal-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            font-weight: 400;
            color: var(--silver);
            margin-bottom: 26px;
        }
        .field {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 13px 16px;
            color: var(--silver);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.2s;
        }
        .field:focus { border-color: rgba(201,168,76,0.5); }
        .field::placeholder { color: var(--muted); }
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--gold), #a8751e);
            border: none;
            border-radius: 14px;
            padding: 13px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--ink);
            cursor: pointer;
            transition: opacity 0.2s, box-shadow 0.2s;
            margin-top: 4px;
        }
        .btn-primary:hover { opacity: 0.88; box-shadow: 0 6px 24px rgba(201,168,76,0.3); }
        .btn-ghost {
            background: none; border: none;
            color: var(--gold);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            cursor: pointer;
            margin-top: 14px;
            opacity: 0.8;
            transition: opacity 0.2s;
            width: 100%;
        }
        .btn-ghost:hover { opacity: 1; }
        .field-error { color: #e07070; font-size: 12px; margin-bottom: 10px; }

        /* ── Responsive ── */
        @media (max-width: 700px) {
            .topnav { flex-direction: column; align-items: flex-start; gap: 10px; }
            .app-nav { flex-wrap: wrap; }
            .search-field { flex-wrap: wrap; padding: 8px 12px; border-radius: 16px; }
            .search-go { width: 100%; border-radius: 12px; margin-top: 8px; text-align: center; }
            .result-title { font-size: 17px; }
        }
    </style>
</head>
<body>
    <canvas id="starfield" aria-hidden="true"></canvas>
    <div class="amb amb-1" aria-hidden="true"></div>
    <div class="amb amb-2" aria-hidden="true"></div>

    <div class="shell">
        <!-- Top Nav -->
        <nav class="topnav" aria-label="Wizard Ecosystem navigation">
            <a class="logo" href="https://wizardecosystem.dev" aria-label="Wizard Ecosystem home">
                <span class="logo-glyph" aria-hidden="true">🧙</span>
                <span class="logo-name">Wizard Ecosystem</span>
            </a>

            <div class="app-nav" role="list">
                <a class="nav-pill" href="https://wizardecosystem.dev/ai" role="listitem">
                    <span class="nav-pill-icon" aria-hidden="true">🧠</span> AI
                </a>
                <a class="nav-pill active" href="https://wizardecosystem.dev/search" role="listitem" aria-current="page">
                    <span class="nav-pill-icon" aria-hidden="true">🔍</span> Search
                </a>
                <a class="nav-pill" href="https://wizardecosystem.dev/mail" role="listitem">
                    <span class="nav-pill-icon" aria-hidden="true">📧</span> Mail
                </a>
                <a class="nav-pill" href="https://wizardecosystem.dev/calendar" role="listitem">
                    <span class="nav-pill-icon" aria-hidden="true">📅</span> Calendar
                </a>
                <a class="nav-pill" href="https://wizardecosystem.dev/chat" role="listitem">
                    <span class="nav-pill-icon" aria-hidden="true">💬</span> Chat
                </a>
            </div>

            <div class="nav-right">
                <div class="user-pill" id="user-pill" style="display:none;" role="status">
                    <div class="user-avatar" aria-hidden="true">🧙</div>
                    <span id="user-email-txt" class="user-email-txt"></span>
                    <button id="logout-btn" class="logout-btn" aria-label="Sign out" title="Sign out">✕</button>
                </div>
                <button id="signin-btn" class="signin-btn" style="display:none;" aria-label="Sign in">Sign In</button>
            </div>
        </nav>

        <!-- Hero -->
        <header class="search-hero" role="banner">
            <span class="hero-glyph" aria-hidden="true">🔍</span>
            <h1 class="hero-title">Wizard <em>Search</em></h1>
            <p class="hero-sub">AI-powered results — real, clickable, and intelligent</p>
        </header>

        <!-- Search Bar -->
        <div class="search-wrap" role="search">
            <div class="search-field">
                <span class="search-ico" aria-hidden="true">✦</span>
                <input
                    type="search"
                    id="search-input"
                    placeholder="Search the web…"
                    aria-label="Search the web"
                    autocomplete="off"
                    spellcheck="false"
                >
                <button class="search-go" id="search-btn" aria-label="Submit search">Search</button>
            </div>
        </div>

        <!-- Results -->
        <main id="results" class="results-area" aria-live="polite" aria-label="Search results"></main>

        <!-- Footer -->
        <footer role="contentinfo">
            <p class="footer-brand">🧙 Wizard Search</p>
            <p class="footer-meta">
                Results via DDG · Brave · Startpage &nbsp;·&nbsp;
                AI summaries by Llama 4 &nbsp;·&nbsp;
                Built by <a href="https://wizardecosystem.dev" rel="author">Arnav Gupta</a>
            </p>
        </footer>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Auth Modal -->
    <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-box">
            <span class="modal-glyph" aria-hidden="true">🧙</span>
            <h2 class="modal-title" id="modal-title">Sign In</h2>
            <input class="field" type="email" id="login-email" placeholder="Email address" autocomplete="email">
            <input class="field" type="password" id="login-password" placeholder="Password" autocomplete="current-password">
            <div id="login-error" class="field-error" role="alert"></div>
            <button class="btn-primary" id="login-submit">Enter the Realm</button>
            <button class="btn-ghost" id="show-signup">Create an account →</button>
        </div>
    </div>

   
<script>
(() => {
    "use strict";

    /* =========================================================
       CONFIGURATION
    ========================================================= */
    const API = "https://arnav0928.pythonanywhere.com";

    let currentUser = null;
    let searchTimeout = null;
    let toastTimer = null;
    let activeSearchController = null;
    let searchRequestId = 0;

    const $ = (id) => document.getElementById(id);

    /* =========================================================
       STARFIELD
    ========================================================= */
    (() => {
        const canvas = $("starfield");
        if (!canvas) return;

        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        let width = 0;
        let height = 0;
        let animationFrame = null;

        const stars = Array.from({ length: 200 }, () => ({
            x: Math.random(),
            y: Math.random(),
            r: Math.random() * 1.3 + 0.2,
            phase: Math.random() * Math.PI * 2,
            speed: Math.random() * 0.8 + 0.3
        }));

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);

            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            canvas.style.width = width + "px";
            canvas.style.height = height + "px";

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            const time = Date.now() / 1000;

            for (const star of stars) {
                const alpha =
                    0.25 +
                    0.5 *
                    (Math.sin(time * star.speed + star.phase) * 0.5 + 0.5);

                ctx.beginPath();
                ctx.arc(
                    star.x * width,
                    star.y * height,
                    star.r,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle = `rgba(212,208,232,${alpha})`;
                ctx.fill();
            }

            animationFrame = requestAnimationFrame(draw);
        }

        resize();
        window.addEventListener("resize", resize);
        draw();

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            } else if (animationFrame === null) {
                draw();
            }
        });
    })();

    /* =========================================================
       UTILITIES
    ========================================================= */

    function esc(value) {
        const div = document.createElement("div");
        div.textContent = String(value ?? "");
        return div.innerHTML;
    }

    function showToast(message, type = "success") {
        const toast = $("toast");
        if (!toast) return;

        toast.textContent = message;
        toast.className = `toast ${type} show`;

        clearTimeout(toastTimer);

        toastTimer = setTimeout(() => {
            toast.classList.remove("show");
        }, 3000);
    }

    function setText(id, value) {
        const element = $(id);
        if (element) element.textContent = value ?? "";
    }

    function setDisplay(id, display) {
        const element = $(id);
        if (element) element.style.display = display;
    }

    function getSearchUrl(engine, query) {
        const encoded = encodeURIComponent(query);

        if (engine === "google") {
            return `https://www.google.com/search?q=${encoded}`;
        }

        return `https://duckduckgo.com/?q=${encoded}`;
    }

    function openExternalUrl(url) {
        try {
            const parsed = new URL(url);

            if (parsed.protocol !== "https:" && parsed.protocol !== "http:") {
                return;
            }

            window.open(parsed.href, "_blank", "noopener,noreferrer");
        } catch {
            // Ignore malformed or unsafe URLs.
        }
    }

    async function apiRequest(path, options = {}) {
        const response = await fetch(`${API}${path}`, {
            ...options,
            credentials: "include",
            headers: {
                ...(options.body ? { "Content-Type": "application/json" } : {}),
                ...(options.headers || {})
            }
        });

        const contentType = response.headers.get("content-type") || "";

        let data = {};

        if (contentType.includes("application/json")) {
            data = await response.json();
        } else {
            const text = await response.text();

            if (text) {
                data = { error: text.slice(0, 300) };
            }
        }

        if (!response.ok) {
            const error = new Error(
                data.error || `Request failed (${response.status})`
            );

            error.status = response.status;
            error.data = data;

            throw error;
        }

        return data;
    }

    /* =========================================================
       AUTHENTICATION
    ========================================================= */

    function updateAuthUI() {
        if (currentUser) {
            setDisplay("user-pill", "flex");
            setDisplay("signin-btn", "none");

            setText(
                "user-email-txt",
                currentUser.email || currentUser.username || "Signed in"
            );
        } else {
            setDisplay("user-pill", "none");
            setDisplay("signin-btn", "block");
        }
    }

    async function checkAuth() {
        try {
            const data = await apiRequest("/api/check-auth");

            if (data.authenticated && data.user) {
                currentUser = data.user;
            } else {
                currentUser = null;
            }
        } catch (error) {
            currentUser = null;

            if (error.status && error.status !== 401) {
                console.warn("Authentication check failed:", error.message);
            }
        }

        updateAuthUI();
    }

    async function handleLogin() {
        const email = $("login-email").value.trim();
        const password = $("login-password").value;
        const errorElement = $("login-error");
        const submitButton = $("login-submit");

        if (!email || !password) {
            errorElement.textContent = "Email and password required";
            return;
        }

        errorElement.textContent = "";
        submitButton.disabled = true;
        submitButton.textContent = "Signing in…";

        try {
            const data = await apiRequest("/api/login", {
                method: "POST",
                body: JSON.stringify({ email, password })
            });

            if (!data.user) {
                throw new Error(
                    "Login response did not include a user. Check your backend."
                );
            }

            currentUser = data.user;

            closeModal();
            updateAuthUI();

            $("login-password").value = "";

            showToast("Welcome back!");

        } catch (error) {
            errorElement.textContent =
                error.status === 401
                    ? "Invalid email or password"
                    : error.message || "Login failed";

        } finally {
            submitButton.disabled = false;
            submitButton.textContent = "Enter the Realm";
        }
    }

    async function handleLogout() {
        const logoutButton = $("logout-btn");

        if (logoutButton) logoutButton.disabled = true;

        try {
            await apiRequest("/api/logout", { method: "POST" });

            currentUser = null;
            updateAuthUI();

            showToast("Signed out");

        } catch (error) {
            showToast(
                error.status === 401
                    ? "You are already signed out"
                    : "Could not sign out. Check your connection.",
                error.status === 401 ? "success" : "error"
            );

            if (error.status === 401) {
                currentUser = null;
                updateAuthUI();
            }
        } finally {
            if (logoutButton) logoutButton.disabled = false;
        }
    }

    function openModal() {
        $("modal-overlay").classList.add("show");
        $("login-error").textContent = "";

        setTimeout(() => $("login-email").focus(), 50);
    }

    function closeModal() {
        $("modal-overlay").classList.remove("show");
    }

    /* =========================================================
       SEARCH SUGGESTIONS
       Requires an optional /api/search/suggest endpoint.
    ========================================================= */

    async function getSuggestions(query) {
        if (!query || query.length < 2) return;

        try {
            const data = await apiRequest(
                `/api/search/suggest?q=${encodeURIComponent(query)}`
            );

            if (Array.isArray(data.suggestions) && data.suggestions.length) {
                console.log(
                    `Received ${data.suggestions.length} search suggestions.`
                );
            }
        } catch (error) {
            // Suggestions are optional; don't interrupt searching.
            if (error.status !== 404) {
                console.debug("Suggestions unavailable:", error.message);
            }
        }
    }

    function setupSearchInput() {
        const input = $("search-input");

        input.addEventListener("input", () => {
            clearTimeout(searchTimeout);

            const query = input.value.trim();

            searchTimeout = setTimeout(() => {
                getSuggestions(query);
            }, 350);
        });
    }

    /* =========================================================
       SEARCH UI
    ========================================================= */

    function showLoading() {
        const area = $("results");
        area.replaceChildren();

        const container = document.createElement("div");
        container.className = "loading-spinner";

        const spinner = document.createElement("div");
        spinner.className = "spinner-ring";
        spinner.setAttribute("aria-hidden", "true");

        const message = document.createElement("p");
        message.className = "loading-text";
        message.textContent = "Consulting the arcane archives…";

        container.append(spinner, message);
        area.appendChild(container);
    }

    function showMessage(icon, title, message, query, error = false) {
        const area = $("results");
        area.replaceChildren();

        const container = document.createElement("div");
        container.className = "no-results";

        const glyph = document.createElement("span");
        glyph.className = "no-results-icon";
        glyph.textContent = icon;

        const heading = document.createElement("h3");
        heading.textContent = title;

        const paragraph = document.createElement("p");
        paragraph.textContent = message;

        const buttons = document.createElement("div");
        buttons.className = "fallback-btns";

        const google = document.createElement("button");
        google.className = "fallback-btn fallback-google";
        google.textContent = "🔍 Google";
        google.addEventListener("click", () => {
            openExternalUrl(getSearchUrl("google", query));
        });

        const duckduckgo = document.createElement("button");
        duckduckgo.className = "fallback-btn fallback-ddg";
        duckduckgo.textContent = "🦆 DuckDuckGo";
        duckduckgo.addEventListener("click", () => {
            openExternalUrl(getSearchUrl("duckduckgo", query));
        });

        buttons.append(google, duckduckgo);
        container.append(glyph, heading, paragraph, buttons);
        area.appendChild(container);

        if (error) {
            console.error("Search failed:", message);
        }
    }

    function createResultCard(result) {
        const card = document.createElement("article");
        card.className = "result-card";
        card.setAttribute("role", "article");

        const title = document.createElement("div");
        title.className = "result-title";
        title.textContent = result.title || "Untitled result";

        const url = document.createElement("div");
        url.className = "result-url";

        const snippet = document.createElement("p");
        snippet.className = "result-snippet";
        snippet.textContent =
            result.content || result.snippet || result.description || "";

        let safeUrl = "";

        try {
            const parsed = new URL(result.url || "");

            if (parsed.protocol === "https:" || parsed.protocol === "http:") {
                safeUrl = parsed.href;
            }
        } catch {
            // Summary entries and malformed URLs aren't clickable.
        }

        if (safeUrl) {
            const link = document.createElement("a");
            link.href = safeUrl;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = result.url;

            // Keep the URL visible and accessible.
            link.style.color = "inherit";
            link.style.textDecoration = "none";

            url.appendChild(link);

            card.tabIndex = 0;
            card.setAttribute("aria-label", result.title || "Open search result");

            const openResult = (event) => {
                if (event.target.closest("a")) return;
                openExternalUrl(safeUrl);
            };

            card.addEventListener("click", openResult);

            card.addEventListener("keydown", (event) => {
                if (
                    event.target === card &&
                    (event.key === "Enter" || event.key === " ")
                ) {
                    event.preventDefault();
                    openExternalUrl(safeUrl);
                }
            });

            card.style.cursor = "pointer";
        } else {
            url.textContent = result.is_answer ? "AI-generated summary" : "";
            card.style.cursor = "default";
        }

        card.append(title, url, snippet);

        return card;
    }

    function renderResults(data) {
        const area = $("results");
        area.replaceChildren();

        const results = Array.isArray(data.results) ? data.results : [];

        // Accept either backend response format.
        const answerResult = results.find(
            result => result && result.is_answer === true
        );

        const summary =
            data.summary ||
            data.answer ||
            (answerResult ? answerResult.content : "");

        const webResults = results.filter(result => {
            if (!result || result.is_answer === true) return false;

            return Boolean(
                result.url &&
                (result.content || result.snippet || result.title)
            );
        });

        // AI summary
        if (summary) {
            const summaryCard = document.createElement("section");
            summaryCard.className = "ai-summary";
            summaryCard.setAttribute("aria-label", "Search summary");

            const header = document.createElement("div");
            header.className = "summary-header";

            const icon = document.createElement("span");
            icon.className = "summary-icon";
            icon.setAttribute("aria-hidden", "true");
            icon.textContent = "🧙";

            const label = document.createElement("span");
            label.className = "summary-label";
            label.textContent = `About "${data.query || ""}"`;

            const text = document.createElement("p");
            text.className = "summary-text";
            text.textContent = summary;

            header.append(icon, label);
            summaryCard.append(header, text);
            area.appendChild(summaryCard);
        }

        // No usable results
        if (webResults.length === 0) {
            if (!summary) {
                showMessage(
                    "🔍",
                    `No results for "${data.query || ""}"`,
                    "Try another search term or search directly below.",
                    data.query || ""
                );
            } else {
                const note = document.createElement("p");
                note.className = "result-snippet";
                note.textContent =
                    "No individual web links were returned for this query.";

                area.appendChild(note);
            }

            return;
        }

        // Source badge
        const badge = document.createElement("div");
        badge.className = "source-badge";

        const sourceNames = {
            tavily: "Tavily",
            duckduckgo: "DuckDuckGo",
            fallback: "Web Search"
        };

        const source =
            sourceNames[String(data.source || "").toLowerCase()] ||
            data.source ||
            "Web Search";

        badge.textContent = `✦ ${webResults.length} results · ${source}`;
        area.appendChild(badge);

        // Result cards
        const fragment = document.createDocumentFragment();

        for (const result of webResults) {
            fragment.appendChild(createResultCard(result));
        }

        area.appendChild(fragment);
    }

    /* =========================================================
       PERFORM SEARCH
    ========================================================= */

    async function performSearch() {
        const input = $("search-input");
        const button = $("search-btn");
        const query = input.value.trim();

        if (!query) {
            showToast("Enter a search term", "error");
            input.focus();
            return;
        }

        if (query.length > 500) {
            showToast("Search must be 500 characters or fewer", "error");
            return;
        }

        // Abort the previous request when a newer search starts.
        if (activeSearchController) {
            activeSearchController.abort();
        }

        activeSearchController = new AbortController();

        const controller = activeSearchController;
        const requestId = ++searchRequestId;

        // Update the address bar without double-encoding the query.
        const newUrl = new URL(window.location.href);
        newUrl.searchParams.set("q", query);

        window.history.pushState({ query }, "", newUrl);

        showLoading();

        button.disabled = true;
        button.textContent = "Searching…";
        input.setAttribute("aria-busy", "true");

        try {
            const data = await apiRequest("/api/search", {
                method: "POST",
                signal: controller.signal,
                body: JSON.stringify({ query })
            });

            // Ignore stale responses.
            if (requestId !== searchRequestId) return;

            if (data.success !== true) {
                throw new Error(data.error || "Search failed");
            }

            renderResults({
                ...data,
                query: data.query || query
            });

        } catch (error) {
            if (error.name === "AbortError") return;

            if (requestId !== searchRequestId) return;

            if (error.status === 401) {
                showMessage(
                    "🔐",
                    "Sign in required",
                    "Please sign in to use Wizard Search.",
                    query,
                    true
                );

                showToast("Please sign in first", "error");
            } else {
                showMessage(
                    "⚠️",
                    "Search Interrupted",
                    error.message || "Unable to connect to the search server.",
                    query,
                    true
                );
            }

        } finally {
            if (requestId === searchRequestId) {
                activeSearchController = null;

                button.disabled = false;
                button.textContent = "Search";

                input.removeAttribute("aria-busy");
            }
        }
    }

    /* =========================================================
       URL RESTORATION / BROWSER NAVIGATION
    ========================================================= */

    function loadFromURL() {
        // URLSearchParams.get() already decodes the value.
        const query = new URLSearchParams(window.location.search).get("q");

        if (query) {
            $("search-input").value = query;
            performSearch();
        }
    }

    window.addEventListener("popstate", () => {
        const query = new URLSearchParams(window.location.search).get("q") || "";

        $("search-input").value = query;

        if (query.trim()) {
            performSearch();
        } else {
            if (activeSearchController) {
                activeSearchController.abort();
                activeSearchController = null;
            }

            searchRequestId++;
            $("results").replaceChildren();
        }
    });

    /* =========================================================
       EVENT LISTENERS
    ========================================================= */

    $("search-btn").addEventListener("click", performSearch);

    $("search-input").addEventListener("keydown", event => {
        if (event.key === "Enter") {
            event.preventDefault();
            performSearch();
        }
    });

    $("signin-btn").addEventListener("click", openModal);

    $("login-submit").addEventListener("click", handleLogin);

    $("logout-btn").addEventListener("click", handleLogout);

    $("show-signup").addEventListener("click", () => {
        window.location.href = "https://wizardecosystem.dev";
    });

    $("modal-overlay").addEventListener("click", event => {
        if (event.target === $("modal-overlay")) {
            closeModal();
        }
    });

    document.addEventListener("keydown", event => {
        if (
            event.key === "Escape" &&
            $("modal-overlay").classList.contains("show")
        ) {
            closeModal();
        }
    });

    $("login-email").addEventListener("keydown", event => {
        if (event.key === "Enter") handleLogin();
    });

    $("login-password").addEventListener("keydown", event => {
        if (event.key === "Enter") handleLogin();
    });

    setupSearchInput();

    /* =========================================================
       INITIALIZE
    ========================================================= */

    checkAuth();
    loadFromURL();

    console.log("🧙 Wizard Search initialized.");

})();
</script>

</body>
