<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Wizard Nature — Desert survival and wildlife identification app. Cactus tracker, snake ID, sunset forecast, and more.">
    <meta name="author" content="Arnav Gupta">
    <meta name="theme-color" content="#1a2a1a">
    <title>🌵 Wizard Nature — Desert Survival & Wildlife</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        :root {
            --desert:        #1a2a1a;
            --desert-light:  #2a3a2a;
            --sand:          #d4c4a8;
            --sand-light:    #e8dcc8;
            --cactus:        #4a8c5a;
            --cactus-dark:   #2a5a3a;
            --cactus-glow:   rgba(74,140,90,0.2);
            --sunset:        #e8844a;
            --sunset-glow:   rgba(232,132,74,0.3);
            --gold:          #c9a84c;
            --gold-light:    #e8c97a;
            --silver:        #d4d0e8;
            --silver-dim:    rgba(212,208,232,0.55);
            --muted:         rgba(212,208,232,0.32);
            --border:        rgba(201,168,76,0.14);
            --border-strong: rgba(201,168,76,0.4);
            --danger:        #e05555;
            --success:       #4ade80;
            --warning:       #fbbf24;
        }

        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--desert);
            color: var(--sand);
        }

        #starfield { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.3; }
        .amb {
            position: fixed; border-radius: 50%;
            filter: blur(130px); pointer-events: none; z-index: 0;
            opacity: 0.2; animation: drift 25s ease-in-out infinite alternate;
        }
        .amb-1 { width: 600px; height: 600px; top: -200px; left: -200px; background: radial-gradient(circle, #4a8c5a, transparent 70%); }
        .amb-2 { width: 450px; height: 450px; bottom: -100px; right: -100px; background: radial-gradient(circle, #e8844a, transparent 70%); animation-delay: -10s; }
        @keyframes drift { from { transform: translate(0,0); } to { transform: translate(35px,25px); } }

        .app-shell { position: relative; z-index: 10; display: flex; height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: 280px; flex-shrink: 0;
            background: rgba(26,42,26,0.95);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            backdrop-filter: blur(20px);
            overflow-y: auto;
        }

        .sidebar-head { padding: 20px 18px 16px; border-bottom: 1px solid var(--border); }
        .logo {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; margin-bottom: 16px;
        }
        .logo-glyph { font-size: 32px; filter: drop-shadow(0 0 10px rgba(74,140,90,0.4)); animation: lev 5s ease-in-out infinite; }
        @keyframes lev { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .logo-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px; font-weight: 600;
            background: linear-gradient(135deg, var(--cactus), var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .user-card {
            background: rgba(74,140,90,0.1);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 16px;
        }
        .user-email { font-size: 11px; color: var(--silver-dim); word-break: break-all; }

        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
            margin-bottom: 2px;
        }
        .nav-item:hover { background: rgba(255,255,255,0.04); border-color: var(--border); }
        .nav-item.active {
            background: rgba(74,140,90,0.15);
            border-color: var(--cactus);
        }
        .nav-icon { font-size: 18px; width: 28px; }
        .nav-label { font-size: 13px; }

        /* Main */
        .main {
            flex: 1; display: flex; flex-direction: column;
            overflow: hidden; min-width: 0;
        }

        .main-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            background: rgba(26,42,26,0.7);
            backdrop-filter: blur(12px);
        }
        .main-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px; font-weight: 600;
            color: var(--sand);
        }
        .main-header p {
            font-size: 13px; color: var(--muted);
        }

        .content-area {
            flex: 1; overflow-y: auto; padding: 24px;
        }

        /* Feature Cards */
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .feature-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .feature-card:hover {
            transform: translateY(-4px);
            border-color: var(--cactus);
            box-shadow: 0 8px 30px rgba(74,140,90,0.15);
        }
        .feature-icon { font-size: 40px; margin-bottom: 12px; }
        .feature-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .feature-desc { font-size: 13px; color: var(--muted); line-height: 1.5; }

        /* Panels */
        .panel {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .panel-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
        .panel-title em { color: var(--cactus); font-style: italic; }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover { border-color: var(--cactus); background: rgba(74,140,90,0.05); }
        .upload-area input { display: none; }

        .result-box {
            margin-top: 20px;
            padding: 16px;
            background: rgba(74,140,90,0.1);
            border-radius: 12px;
            display: none;
        }
        .result-box.show { display: block; }
        .result-image { max-width: 100%; max-height: 300px; border-radius: 12px; margin-top: 12px; }
        .result-text { font-size: 14px; line-height: 1.6; color: var(--sand-light); }
        .result-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-danger { background: rgba(224,85,85,0.2); color: var(--danger); }
        .badge-success { background: rgba(74,140,90,0.2); color: var(--cactus); }
        .badge-warning { background: rgba(251,191,36,0.2); color: var(--warning); }

        .cactus-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
        }
        .cactus-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .cactus-emoji { font-size: 48px; margin-bottom: 8px; }
        .cactus-name { font-size: 14px; font-weight: 500; }
        .cactus-status {
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px;
        }
        .cactus-status.seen { color: var(--cactus); }

        .sunset-meter {
            width: 100%; height: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 100px;
            overflow: hidden;
            margin-top: 8px;
        }
        .sunset-fill {
            height: 100%;
            border-radius: 100px;
            transition: width 0.5s;
            background: linear-gradient(90deg, #f59e0b, #e8844a, #dc2626);
        }

        .camping-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }
        .camping-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }
        .camping-name { font-size: 15px; font-weight: 600; }
        .camping-location { font-size: 12px; color: var(--muted); margin-top: 4px; }

        .loading-spinner {
            display: inline-block;
            width: 24px; height: 24px;
            border: 2px solid rgba(74,140,90,0.2);
            border-top-color: var(--cactus);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, var(--cactus), var(--cactus-dark));
            color: var(--sand);
            padding: 10px 24px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            z-index: 10000;
            transition: transform 0.3s;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: linear-gradient(135deg, var(--danger), #b44); }

        @media (max-width: 700px) {
            .sidebar { position: absolute; left: 0; top: 0; bottom: 0; z-index: 100; transform: translateX(-100%); transition: transform 0.3s; }
            .sidebar.open { transform: translateX(0); }
            .feature-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <canvas id="starfield" aria-hidden="true"></canvas>
    <div class="amb amb-1" aria-hidden="true"></div>
    <div class="amb amb-2" aria-hidden="true"></div>

    <div class="app-shell">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-head">
                <a class="logo" href="https://wizardecosystem.dev">
                    <span class="logo-glyph">🌵</span>
                    <span class="logo-name">Wizard Nature</span>
                </a>
                <div class="user-card">
                    <div class="user-email" id="user-email">Loading…</div>
                </div>
            </div>

            <nav style="padding: 0 12px;">
                <div class="nav-item active" data-view="home">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-label">Dashboard</span>
                </div>
                <div class="nav-item" data-view="cactus">
                    <span class="nav-icon">🌵</span>
                    <span class="nav-label">Cactus Tracker</span>
                </div>
                <div class="nav-item" data-view="snake">
                    <span class="nav-icon">🐍</span>
                    <span class="nav-label">Snake ID</span>
                </div>
                <div class="nav-item" data-view="sunset">
                    <span class="nav-icon">🌅</span>
                    <span class="nav-label">Sunset Forecast</span>
                </div>
                <div class="nav-item" data-view="critter">
                    <span class="nav-icon">🦎</span>
                    <span class="nav-label">Critter ID</span>
                </div>
                <div class="nav-item" data-view="wildflower">
                    <span class="nav-icon">🌸</span>
                    <span class="nav-label">Wildflower Alert</span>
                </div>
                <div class="nav-item" data-view="camping">
                    <span class="nav-icon">🏕️</span>
                    <span class="nav-label">Camping Guide</span>
                </div>
            </nav>
        </aside>

        <!-- Main -->
        <main class="main">
            <div class="main-header">
                <h1 id="page-title">🌵 Desert Dashboard</h1>
                <p id="page-subtitle">Your Sonoran Desert companion</p>
            </div>

            <div class="content-area" id="content-area">
                <!-- Content rendered by JS -->
            </div>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API = 'https://arnav0928.pythonanywhere.com';
        let currentUser = null;
        let currentView = 'home';

        function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        function toast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${isError ? 'error' : ''}`;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        async function checkAuth() {
            try {
                const res = await fetch(`${API}/api/check-auth`, { credentials: 'include' });
                if (res.ok) {
                    const data = await res.json();
                    if (data.authenticated && data.user) {
                        currentUser = data.user;
                        document.getElementById('user-email').textContent = currentUser.email;
                        return;
                    }
                }
            } catch(e) {}
            window.location.href = 'https://wizardecosystem.dev';
        }

        // Cactus data
        const cactusData = [
            { name: 'Saguaro', emoji: '🌵', status: 'Common', seen: true },
            { name: 'Barrel Cactus', emoji: '🟢', status: 'Common', seen: true },
            { name: 'Prickly Pear', emoji: '🟣', status: 'Common', seen: true },
            { name: 'Cholla', emoji: '🌵', status: 'Common', seen: true },
            { name: 'Organ Pipe', emoji: '🎵', status: 'Rare', seen: false },
            { name: 'Senita', emoji: '🕯️', status: 'Rare', seen: false },
        ];

        // Camping data
        const campingData = [
            { name: 'Sedona', location: 'Coconino National Forest', rating: 5 },
            { name: 'Grand Canyon', location: 'South Rim', rating: 5 },
            { name: 'Mogollon Rim', location: 'Coconino County', rating: 4 },
            { name: 'Lost Dutchman', location: 'Superstition Mountains', rating: 4 },
            { name: 'Lake Powell', location: 'Glen Canyon', rating: 4 },
            { name: 'Organ Pipe Cactus', location: 'Pima County', rating: 3 },
        ];

        // Views
        const views = {
            home: () => `
                <div class="feature-grid">
                    <div class="feature-card" onclick="switchView('cactus')">
                        <div class="feature-icon">🌵</div>
                        <div class="feature-title">Cactus Tracker</div>
                        <div class="feature-desc">Identify saguaro, barrel, prickly pear, and cholla</div>
                    </div>
                    <div class="feature-card" onclick="switchView('snake')">
                        <div class="feature-icon">🐍</div>
                        <div class="feature-title">Snake ID</div>
                        <div class="feature-desc">Upload a photo — AI identifies rattlesnake vs gopher snake</div>
                    </div>
                    <div class="feature-card" onclick="switchView('sunset')">
                        <div class="feature-icon">🌅</div>
                        <div class="feature-title">Sunset Forecast</div>
                        <div class="feature-desc">Predicts how good the sunset will be 🌵</div>
                    </div>
                    <div class="feature-card" onclick="switchView('critter')">
                        <div class="feature-icon">🦎</div>
                        <div class="feature-title">Critter ID</div>
                        <div class="feature-desc">Identify lizards, birds, and desert wildlife</div>
                    </div>
                    <div class="feature-card" onclick="switchView('wildflower')">
                        <div class="feature-icon">🌸</div>
                        <div class="feature-title">Wildflower Alert</div>
                        <div class="feature-desc">Bloom notifications after winter rains</div>
                    </div>
                    <div class="feature-card" onclick="switchView('camping')">
                        <div class="feature-icon">🏕️</div>
                        <div class="feature-title">Camping Guide</div>
                        <div class="feature-desc">Best campsites in Arizona</div>
                    </div>
                </div>
            `,

            cactus: () => `
                <h2 style="font-family:'Cormorant Garamond',serif; font-size:22px; margin-bottom:16px;">🌵 Cactus Tracker</h2>
                <p style="color:var(--muted); margin-bottom:20px;">Track the cacti you've spotted in the Sonoran Desert</p>
                <div class="cactus-grid">
                    ${cactusData.map(c => `
                        <div class="cactus-card">
                            <div class="cactus-emoji">${c.emoji}</div>
                            <div class="cactus-name">${esc(c.name)}</div>
                            <div class="cactus-status ${c.seen ? 'seen' : ''}">${c.seen ? '✅ Spotted!' : '🔍 Not yet'}</div>
                        </div>
                    `).join('')}
                </div>
                <button onclick="toast('🌵 Cactus tracker updated!')" style="margin-top:20px; background:var(--cactus); border:none; border-radius:100px; padding:10px 20px; color:white; cursor:pointer;">Mark All Spotted</button>
            `,

            snake: () => `
                <h2 style="font-family:'Cormorant Garamond',serif; font-size:22px; margin-bottom:16px;">🐍 Snake ID</h2>
                <p style="color:var(--muted); margin-bottom:20px;">Upload a photo and AI will identify if it's a rattlesnake or harmless gopher snake</p>
                <div class="upload-area" id="snake-upload">
                    <div style="font-size:48px; margin-bottom:12px;">📸</div>
                    <div>Tap to upload a snake photo</div>
                    <div style="font-size:12px; color:var(--muted); margin-top:8px;">PNG, JPG, WebP</div>
                    <input type="file" id="snake-file" accept="image/*">
                </div>
                <div class="result-box" id="snake-result">
                    <div class="result-text" id="snake-text">Analyzing...</div>
                    <img class="result-image" id="snake-image" style="display:none;">
                </div>
            `,

            sunset: () => `
                <h2 style="font-family:'Cormorant Garamond',serif; font-size:22px; margin-bottom:16px;">🌅 Sunset Forecast</h2>
                <p style="color:var(--muted); margin-bottom:20px;">Arizona has the best sunsets — here's how good tonight's will be</p>
                <div class="panel">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:18px;">Tonight's Sunset</span>
                        <span style="font-size:24px; font-weight:600; color:var(--sunset);">8.5/10</span>
                    </div>
                    <div class="sunset-meter"><div class="sunset-fill" style="width:85%;"></div></div>
                    <div style="display:flex; justify-content:space-between; margin-top:8px; font-size:12px; color:var(--muted);">
                        <span>Cloud cover: 20%</span>
                        <span>Humidity: 15%</span>
                        <span>Air quality: Good</span>
                    </div>
                    <div style="margin-top:16px; padding:12px; background:rgba(232,132,74,0.1); border-radius:12px; border-left:3px solid var(--sunset);">
                        <strong>✨ Pro tip:</strong> Head to Papago Park or Camelback Mountain for the best view tonight!
                    </div>
                </div>
            `,

            critter: () => `
                <h2 style="font-family:'Cormorant Garamond',serif; font-size:22px; margin-bottom:16px;">🦎 Critter ID</h2>
                <p style="color:var(--muted); margin-bottom:20px;">Identify lizards, birds, and other desert wildlife</p>
                <div class="upload-area" id="critter-upload">
                    <div style="font-size:48px; margin-bottom:12px;">📸</div>
                    <div>Tap to upload a critter photo</div>
                    <input type="file" id="critter-file" accept="image/*">
                </div>
                <div class="result-box" id="critter-result">
                    <div class="result-text" id="critter-text">Analyzing...</div>
                    <img class="result-image" id="critter-image" style="display:none;">
                </div>
            `,

            wildflower: () => `
                <h2 style="font-family:'Cormorant Garamond',serif; font-size:22px; margin-bottom:16px;">🌸 Wildflower Alert</h2>
                <p style="color:var(--muted); margin-bottom:20px;">Bloom notifications after winter rains</p>
                <div class="panel">
                    <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                        <span style="font-size:40px;">🌸</span>
                        <div>
                            <div style="font-weight:600;">Current Status</div>
                            <div style="color:var(--warning);">🌧️ Recent rains — blooms expected in 2-3 weeks!</div>
                        </div>
                    </div>
                    <div style="margin-top:16px; padding:12px; background:rgba(251,191,36,0.1); border-radius:12px;">
                        <strong>🌾 Best spots:</strong> Picacho Peak, Lost Dutchman State Park, Superstition Mountains
                    </div>
                    <button onclick="toast('🔔 You\'ll be notified when wildflowers bloom!')" style="margin-top:12px; background:var(--cactus); border:none; border-radius:100px; padding:8px 16px; color:white; cursor:pointer;">🔔 Set Bloom Alert</button>
                </div>
            `,

            camping: () => `
                <h2 style="font-family:'Cormorant Garamond',serif; font-size:22px; margin-bottom:16px;">🏕️ Camping Guide</h2>
                <p style="color:var(--muted); margin-bottom:20px;">Best campsites in Arizona</p>
                <div class="camping-grid">
                    ${campingData.map(c => `
                        <div class="camping-card">
                            <div class="camping-name">${esc(c.name)}</div>
                            <div class="camping-location">📍 ${esc(c.location)}</div>
                            <div style="color:var(--gold); font-size:12px; margin-top:6px;">${'⭐'.repeat(c.rating)}</div>
                        </div>
                    `).join('')}
                </div>
                <div style="margin-top:16px; padding:12px; background:rgba(74,140,90,0.1); border-radius:12px;">
                    <strong>🔥 Pro tip:</strong> Reserve campsites 4-6 months in advance for Grand Canyon and Sedona!
                </div>
            `
        };

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.toggle('active', el.dataset.view === view);
            });
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('content-area');
            const titles = {
                home: ['🌵 Desert Dashboard', 'Your Sonoran Desert companion'],
                cactus: ['🌵 Cactus Tracker', 'Track the cacti you\'ve spotted'],
                snake: ['🐍 Snake ID', 'Upload a photo for AI identification'],
                sunset: ['🌅 Sunset Forecast', 'Arizona has the best sunsets'],
                critter: ['🦎 Critter ID', 'Identify lizards, birds, and wildlife'],
                wildflower: ['🌸 Wildflower Alert', 'Bloom notifications after winter rains'],
                camping: ['🏕️ Camping Guide', 'Best campsites in Arizona']
            };
            const [title, subtitle] = titles[currentView] || titles.home;
            document.getElementById('page-title').textContent = title;
            document.getElementById('page-subtitle').textContent = subtitle;
            container.innerHTML = views[currentView]();
            setupUploadHandlers();
        }

        function setupUploadHandlers() {
            // Snake upload
            const snakeFile = document.getElementById('snake-file');
            if (snakeFile) {
                snakeFile.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const resultDiv = document.getElementById('snake-result');
                    resultDiv.classList.add('show');
                    document.getElementById('snake-text').innerHTML = '<div class="loading-spinner"></div> Analyzing...';
                    const img = document.getElementById('snake-image');
                    img.style.display = 'block';
                    img.src = URL.createObjectURL(file);
                    try {
                        const formData = new FormData();
                        formData.append('image', file);
                        const res = await fetch(`${API}/api/nature/snake-id`, {
                            method: 'POST',
                            credentials: 'include',
                            body: formData
                        });
                        const data = await res.json();
                        document.getElementById('snake-text').innerHTML = data.result || 'Could not identify. Please try again.';
                    } catch(e) {
                        document.getElementById('snake-text').innerHTML = 'Error analyzing image';
                    }
                };
            }

            // Critter upload
            const critterFile = document.getElementById('critter-file');
            if (critterFile) {
                critterFile.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const resultDiv = document.getElementById('critter-result');
                    resultDiv.classList.add('show');
                    document.getElementById('critter-text').innerHTML = '<div class="loading-spinner"></div> Analyzing...';
                    const img = document.getElementById('critter-image');
                    img.style.display = 'block';
                    img.src = URL.createObjectURL(file);
                    try {
                        const formData = new FormData();
                        formData.append('image', file);
                        const res = await fetch(`${API}/api/nature/critter-id`, {
                            method: 'POST',
                            credentials: 'include',
                            body: formData
                        });
                        const data = await res.json();
                        document.getElementById('critter-text').innerHTML = data.result || 'Could not identify. Try again!';
                    } catch(e) {
                        document.getElementById('critter-text').innerHTML = 'Error analyzing image';
                    }
                };
            }
        }

        // Navigation
        document.querySelectorAll('.nav-item').forEach(el => {
            el.addEventListener('click', () => switchView(el.dataset.view));
        });

        // Mobile hamburger
        const hamburger = document.createElement('button');
        hamburger.innerHTML = '☰';
        hamburger.style.cssText = 'position:fixed; top:15px; left:15px; z-index:1000; background:linear-gradient(135deg,var(--cactus),var(--cactus-dark)); border:none; border-radius:50%; width:40px; height:40px; font-size:20px; color:white; cursor:pointer; display:none;';
        document.body.appendChild(hamburger);
        hamburger.addEventListener('click', () => document.querySelector('.sidebar').classList.toggle('open'));

        if (window.innerWidth <= 700) {
            hamburger.style.display = 'block';
            document.querySelector('.sidebar').classList.add('open');
        }

        checkAuth();
        renderContent();
    </script>
</body>
</html>
