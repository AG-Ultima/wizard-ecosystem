<!DOCTYPE html>
<html lang="en" data-theme="grimoire">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; connect-src https://duckduckgo.com https://ac.duckduckgo.com; frame-src 'none'; object-src 'none'; base-uri 'none'">
<title>Wizard Browser</title>
<style>
:root{
  --bg:#0c0a16; --bg2:#12101f; --panel:#171428; --panel2:#1e1a35; --line:#2b2650; --text:#ece8ff; --muted:#948eb8;
  --gold:#d9b45a; --gold-soft:rgba(217,180,90,.14); --violet:#8b6cf0; --danger:#ef6b7b; --ok:#5fd0a0;
  --ws:#d9b45a;                      /* current workspace colour: tints the window edge and active tab */
  --sans:"Inter","Cantarell","Noto Sans","Ubuntu","Segoe UI",system-ui,sans-serif;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype","DejaVu Serif",Georgia,serif;
  --mono:"JetBrains Mono","Fira Code","Cascadia Code","DejaVu Sans Mono",monospace;
  --r:10px; --bar:46px; --rail:56px; --tabs:248px;
}
[data-theme="amethyst"]{--bg:#140a24;--bg2:#1b0f33;--panel:#221440;--panel2:#2c1a52;--line:#43286f;--text:#f3eaff;--muted:#a994cf;--gold:#e4b95f;--violet:#b07cff}
[data-theme="midnight"]{--bg:#0d0f14;--bg2:#12151c;--panel:#171b24;--panel2:#1e2330;--line:#2a3042;--text:#e7ebf5;--muted:#8a94ad;--gold:#6ea8ff;--gold-soft:rgba(110,168,255,.14);--violet:#7d8cff}
[data-theme="ember"]{--bg:#0c0706;--bg2:#120a08;--panel:#1a0f0c;--panel2:#26150f;--line:#43241a;--text:#ffeee4;--muted:#b08c7c;--gold:#ff8a3d;--gold-soft:rgba(255,138,61,.15);--violet:#ff5d6c}
[data-theme="synthwave"]{--bg:#0d0618;--bg2:#13081f;--panel:#1b0d2e;--panel2:#271342;--line:#4a2478;--text:#ffeafd;--muted:#b390c9;--gold:#ff4fa3;--gold-soft:rgba(255,79,163,.16);--violet:#50dcff}
[data-theme="terminal"]{--bg:#050a07;--bg2:#08110b;--panel:#0b160e;--panel2:#10241a;--line:#17402a;--text:#d6ffe6;--muted:#6fae8a;--gold:#2dff8a;--gold-soft:rgba(45,255,138,.14);--violet:#7dd3fc}
[data-theme="aurora"]{--bg:#07121a;--bg2:#0a1822;--panel:#0f202c;--panel2:#162c3b;--line:#21465a;--text:#e6fbff;--muted:#82aab8;--gold:#2ff5b0;--gold-soft:rgba(47,245,176,.14);--violet:#8b6cf0}
[data-theme="oled"]{--bg:#000;--bg2:#000;--panel:#07071a;--panel2:#0f0f2c;--line:#22245c;--text:#eef2ff;--muted:#8d95cc;--gold:#5aa9ff;--gold-soft:rgba(90,169,255,.16);--violet:#9a6bff;--accent2:#ff9a4d;--danger:#ff5577}
[data-theme="dr460nized"]{--bg:#04050c;--bg2:#070916;--panel:#0b1022;--panel2:#131a38;--line:#1f2b60;--text:#e8f0ff;--muted:#7f90c8;--gold:#2ea0ff;--gold-soft:rgba(46,160,255,.16);--violet:#b13cff;--accent2:#d9b45a;--danger:#ff3d6e}
[data-theme="dr460nized"] #app::before{height:3px;background:linear-gradient(90deg,#00c8ff,#7a5cff,#ff2bd6,#ffcf4d,#00c8ff);background-size:300% 100%;animation:rgb 7s linear infinite;box-shadow:0 0 16px 2px rgba(0,200,255,.5)}
[data-theme="dr460nized"] #app::after{content:"";position:absolute;left:0;top:0;width:150px;height:3px;background:var(--ws);box-shadow:0 0 14px 2px var(--ws);z-index:61;pointer-events:none}
[data-theme="dr460nized"] .tab{border-radius:0;clip-path:polygon(0 100%,9px 0,calc(100% - 9px) 0,100% 100%);padding-left:16px;margin-right:-3px}
[data-theme="dr460nized"] .tab.active{background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:inset 0 2px 0 var(--ws)}
[data-theme="dr460nized"] .wsbtn{border:1px solid var(--ws);box-shadow:0 0 12px -3px var(--ws);border-radius:4px}
[data-theme="dr460nized"] .omni{border-radius:4px;border-color:#24336f}
[data-theme="dr460nized"] .omni:focus-within{box-shadow:0 0 0 1px var(--gold),0 0 18px -2px var(--gold)}
[data-theme="dr460nized"] .btn,[data-theme="dr460nized"] .ib,[data-theme="dr460nized"] .chip,[data-theme="dr460nized"] .pop,[data-theme="dr460nized"] .card,[data-theme="dr460nized"] .tile{border-radius:4px}
[data-theme="dr460nized"] .btn.pri{background:linear-gradient(90deg,#1e8cff,#7a5cff);color:#fff;border-color:transparent}
[data-theme="dr460nized"] .tile:hover{box-shadow:0 0 18px -4px var(--gold)}
[data-theme="dr460nized"] .ntp .clock{font-family:var(--sans);font-weight:800;letter-spacing:2px;text-shadow:0 0 28px rgba(46,160,255,.55)}
[data-theme="dr460nized"] .rail .ib.on::before{background:linear-gradient(#00c8ff,#ff2bd6);box-shadow:0 0 8px #00c8ff}
@keyframes rgb{to{background-position:300% 0}}
[data-theme="light"]{--bg:#e9e6f4;--bg2:#f2f0fa;--panel:#fbfaff;--panel2:#ffffff;--line:#d7d2ea;--text:#1d1a33;--muted:#6a6590;--gold:#946f14;--gold-soft:rgba(148,111,20,.12);--violet:#6a4fd6;--danger:#c93a4c;--ok:#1f9a6a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
[hidden]{display:none!important}
/* Themed scrollbars: the thumb is a slow-moving gradient of the theme's own colours */
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-track:vertical{background:linear-gradient(90deg,transparent 3px,color-mix(in srgb,var(--line) 45%,transparent) 3px,color-mix(in srgb,var(--line) 45%,transparent) 9px,transparent 9px)}
::-webkit-scrollbar-thumb{border:3px solid transparent;border-radius:12px;background-clip:content-box;background-image:linear-gradient(180deg,var(--gold),var(--violet),var(--gold));background-size:100% 300%;animation:sbflow 5s linear infinite;opacity:.8}
::-webkit-scrollbar-thumb:horizontal{background-image:linear-gradient(90deg,var(--gold),var(--violet),var(--gold));background-size:300% 100%;animation-name:sbflowx}
::-webkit-scrollbar-thumb:hover{border-width:2px;animation-duration:1.6s}
::-webkit-scrollbar-thumb:active{border-width:1px}
@keyframes sbflow{to{background-position:0 300%}}@keyframes sbflowx{to{background-position:300% 0}}
[data-theme="dr460nized"] ::-webkit-scrollbar-thumb{background-image:linear-gradient(180deg,#00c8ff,#7a5cff,#ff2bd6,#ffcf4d,#00c8ff)}
[data-theme="dr460nized"] ::-webkit-scrollbar-thumb:horizontal{background-image:linear-gradient(90deg,#00c8ff,#7a5cff,#ff2bd6,#ffcf4d,#00c8ff)}
@media (prefers-reduced-motion:reduce){::-webkit-scrollbar-thumb{animation:none}}

/* ── shell ── */
#app{position:fixed;inset:0;display:grid;grid-template-rows:40px 44px auto 1fr;grid-template-columns:46px auto auto 1fr;grid-template-areas:"strip strip strip strip" "tool tool tool tool" "bookm bookm bookm bookm" "rail vtabs panel page"}
#app::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--ws);box-shadow:0 0 18px 1px var(--ws);z-index:60;pointer-events:none;transition:background .25s,box-shadow .25s}
body.blurred #app::before{opacity:.35}
.strip{grid-area:strip;display:flex;align-items:flex-end;gap:4px;padding:3px 0 0 6px;background:var(--bg2);-webkit-app-region:drag;min-width:0;position:relative}
.strip button,.strip .tab,.strip .ctl{-webkit-app-region:no-drag}
.strip .tabzone{-webkit-app-region:drag}
.strip .drag{flex:0 0 64px;align-self:stretch}
.toolbar{grid-area:tool;display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);position:relative;flex:none}
.ib:hover:not(:disabled){background:var(--panel2);color:var(--text)}
.ib:disabled{opacity:.35;cursor:default}
.ib.on{background:var(--gold-soft);color:var(--gold)}
.ib .dot{position:absolute;top:2px;right:1px;min-width:14px;height:14px;border-radius:8px;background:var(--gold);color:#1a1405;font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.ib.logo{width:34px;height:30px;align-self:center;margin-bottom:3px}.ib.logo img{width:20px;height:20px}
.omni{flex:1;min-width:120px;position:relative;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 6px 0 10px;height:32px;transition:border-color .15s,box-shadow .15s}
.omni:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.omni input{flex:1;background:none;border:0;outline:0;height:100%;min-width:0;user-select:text}
.omni .lock{color:var(--ok)}.omni .lock.bad{color:var(--danger)}.omni .lock.neutral{color:var(--muted)}
.chip{display:flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:6px;font-size:11px;color:var(--muted);background:var(--panel);flex:none}
.chip:hover{color:var(--text);background:var(--panel2)}
.chip b{color:var(--gold);font-weight:600}
.ctl{display:flex;margin-left:auto;align-self:stretch}
.ctl button{width:42px;display:grid;place-items:center;color:var(--muted)}
.ctl button:hover{background:var(--panel2);color:var(--text)}
.ctl button.x:hover{background:var(--danger);color:#fff}
.nofr .ctl{display:none}
.wsbtn{display:flex;align-items:center;gap:7px;height:30px;padding:0 9px 0 8px;border-radius:9px;color:var(--text);font-weight:500;max-width:170px;align-self:center;margin-bottom:3px;background:var(--panel)}
.wsbtn:hover{background:var(--panel2)}
.wsbtn .em{font-size:15px;line-height:1;font-family:"Noto Color Emoji","Twemoji Mozilla","Segoe UI Emoji",sans-serif}
.wsbtn span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsbtn svg{width:12px;height:12px;color:var(--muted)}

/* ── rail (left panel switcher) ── */
.rail{grid-area:rail;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px}
.rail .grow{flex:1}.rail .sep{width:22px;height:1px;background:var(--line);margin:4px 0}
.rail .ib{width:34px;height:34px}
.rail .ib.on::before{content:"";position:absolute;left:-7px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--gold)}
.rail .ib img{width:18px;height:18px;border-radius:4px}

/* ── tabs ── */
.tabzone{display:flex;align-items:flex-end;min-width:0;flex:1;height:100%}
.pinned{display:flex;gap:2px}
.tablist{display:flex;align-items:flex-end;overflow-x:auto;overflow-y:hidden;min-width:0;scrollbar-width:none;flex:0 1 auto}
.tablist::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;height:34px;width:200px;min-width:46px;flex:0 1 200px;padding:0 6px 0 11px;border-radius:10px 10px 0 0;color:var(--muted);position:relative;cursor:default;border:1px solid transparent;border-bottom:0;margin-right:1px}
.tab:hover{background:var(--panel)}
.tab.active{background:var(--panel);color:var(--text);border-color:var(--line);box-shadow:inset 0 2px 0 var(--ws)}
.tab.sleeping .title{opacity:.55;font-style:italic}
.tab.dragover::before{content:"";position:absolute;left:-2px;top:6px;bottom:6px;width:2px;background:var(--gold);border-radius:1px}
.tab .fav{width:16px;height:16px;border-radius:4px;flex:none;display:grid;place-items:center;overflow:hidden}
.tab .fav img{width:16px;height:16px}
.tab .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tab .x{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;opacity:0;color:var(--muted);flex:none}
.tab:hover .x,.tab.active .x{opacity:1}.tab .x:hover{background:var(--line);color:var(--text)}
.tab .x svg{width:12px;height:12px}
.tab .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;flex:none}
.tab .aud{color:var(--gold);flex:none}.tab .aud svg{width:13px;height:13px}
.tab.pin{width:38px;flex:none;justify-content:center;padding:0}
.tab.pin .title,.tab.pin .x{display:none}
.tab.priv .fav{color:var(--violet)}
.tab .gbar{position:absolute;left:8px;right:8px;bottom:0;height:2px;border-radius:2px;background:var(--g)}
.newtab{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none;align-self:center;margin:0 4px 3px}
.newtab:hover{background:var(--panel2);color:var(--text)}
.newtab span{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
/* vertical tabs layout */
.vtabs{grid-area:vtabs;display:none;width:236px;background:var(--bg2);border-right:1px solid var(--line);flex-direction:column;min-height:0}
.vt .vtabs{display:flex}
.vt .vtabs .tabzone{flex-direction:column;align-items:stretch;height:auto;flex:1;padding:6px 8px;overflow:hidden}
.vt .pinned{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px;margin-bottom:4px}
.vt .tablist{flex-direction:column;align-items:stretch;overflow-y:auto;overflow-x:hidden;flex:1}
.vt .tab{width:auto;flex:none;border-radius:9px;margin:0 0 2px;border-bottom:1px solid transparent;height:34px}
.vt .tab.active{box-shadow:inset 3px 0 0 var(--ws)}
.vt .tab.pin{width:auto}
.vt .newtab{width:auto;align-self:stretch;margin:4px 0 0;justify-content:flex-start;gap:8px;padding:0 8px;display:flex;grid:none;height:34px;place-items:unset;align-items:center}
.vt .newtab span{display:inline}

/* ── bookmarks bar ── */
.bookm{grid-area:bookm;display:flex;gap:4px;padding:4px 10px;background:var(--bg2);border-bottom:1px solid var(--line);overflow:hidden;min-height:30px;align-items:center}
.bm{text-decoration:none;display:flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;color:var(--muted);max-width:170px;flex:none}
.bm:hover{background:var(--panel2);color:var(--text)}
.bm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm img{width:14px;height:14px;border-radius:3px}

/* ── page area ── */
.page{grid-area:page;position:relative;background:var(--bg);min-width:0;min-height:0}
.view{position:absolute;inset:0;display:none;border:0;background:#fff}
.view.show{display:flex}
webview.view{flex:1}
.errpage{background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;user-select:text}
.errpage h2{font-family:var(--serif);font-size:30px;font-weight:600}
.errpage p{color:var(--muted);max-width:460px}
.errpage code{font-family:var(--mono);color:var(--gold);font-size:12px}
.sigil-big{width:84px;height:84px;color:var(--gold);opacity:.9}

/* new tab page */
.ntp{background:var(--ntpbg,radial-gradient(1000px 500px at 50% -120px,var(--gold-soft),transparent 70%)) center/cover,var(--bg);overflow:auto;flex-direction:column;align-items:center;padding:7vh 24px 40px}
.ntp .clock{font-family:var(--serif);font-size:clamp(54px,8vw,96px);font-weight:300;letter-spacing:-1px;line-height:1;color:var(--text)}
.ntp .greet{color:var(--muted);margin:6px 0 26px;font-size:14px}
.ntp .search{width:min(640px,100%);position:relative}
.ntp .search input{width:100%;height:50px;border-radius:16px;border:1px solid var(--line);background:var(--panel);padding:0 52px 0 20px;font-size:16px;outline:0;user-select:text}
.ntp .search input:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.ntp .search button{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:10px;background:var(--gold);color:#1a1405;display:grid;place-items:center}
.ntp .search .hint{color:var(--muted);font-size:11.5px;text-align:center;margin-top:8px}
.ntp h3{font-family:var(--serif);font-weight:600;font-size:18px;margin:34px 0 12px;color:var(--text);align-self:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;width:min(760px,100%)}
.tile{text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--text);transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--gold)}
.tile .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--c,var(--panel2));color:#14101f;font-weight:700}
.tile .ico svg{width:20px;height:20px}.tile .ico img{width:22px;height:22px}
/* settings page */
.spage{background:var(--bg);color:var(--text);flex-direction:row;min-height:0;font-size:14px}
.cj-note{padding:8px 14px;color:var(--muted);font-size:12.5px}
.sp-nav{width:260px;flex:none;border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 70%,var(--bg));padding:22px 14px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.sp-brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:24px;font-weight:600;padding:0 8px}.sp-brand svg{width:22px;height:22px;color:var(--gold)}
.sp-search{display:flex;align-items:center;gap:8px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);padding:0 12px;color:var(--muted);transition:border-color .15s,box-shadow .15s}
.sp-search:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}.sp-search svg{width:15px;height:15px;flex:none}
.sp-search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);user-select:text}
#sp-tabs{display:flex;flex-direction:column;gap:2px}
#sp-tabs button{position:relative;display:flex;align-items:center;gap:11px;text-align:left;padding:10px 12px;border-radius:11px;color:var(--muted);transition:background .12s,color .12s}
#sp-tabs button svg{width:17px;height:17px;flex:none}
#sp-tabs button:hover{background:var(--gold-soft);color:var(--text)}
#sp-tabs button.on{background:var(--gold-soft);color:var(--gold);font-weight:500}
#sp-tabs button.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.sp-foot{margin-top:auto;color:var(--muted);font-size:11.5px;padding:0 8px;opacity:.7}
.sp-main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;user-select:text}
.sp-wrap{max-width:780px;margin:0 auto;padding:38px 36px 80px}
.sp-wrap.sp-in{animation:spin .35s cubic-bezier(.2,.7,.2,1)}
@keyframes spin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sp-h{margin-bottom:22px}.sp-h h1{font-family:var(--serif);font-weight:500;font-size:36px;margin:0;letter-spacing:-.3px}.sp-h p{color:var(--muted);margin:6px 0 0}
.sp-wrap h3{font-family:var(--serif);font-size:20px;font-weight:600;margin:28px 0 10px}.sp-wrap h3.sp-grp{font-size:15px;color:var(--gold);font-family:var(--sans);font-weight:600;margin:26px 0 8px}
.spcard{background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:16px;padding:2px 20px;margin-bottom:12px}
.spcard .set{padding:14px 0}.spcard select.field{max-width:none!important;min-width:190px;width:auto}
.sp-wrap .muted{margin:8px 0}
@media (max-width:860px){.spage{flex-direction:column}.sp-nav{width:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px;flex-direction:column;gap:10px;max-height:44%}#sp-tabs{flex-direction:row;overflow-x:auto;padding-bottom:2px}#sp-tabs button{white-space:nowrap}#sp-tabs button.on::before{display:none}.sp-brand,.sp-foot{display:none}.sp-wrap{padding:22px 16px 60px}.sp-h h1{font-size:28px}}
@media (prefers-reduced-motion:reduce){.sp-wrap.sp-in{animation:none}}
[data-theme="dr460nized"] .spcard{border-radius:4px;border-color:#24336f}[data-theme="dr460nized"] .sp-h h1,[data-theme="dr460nized"] .sp-brand,[data-theme="dr460nized"] .sp-wrap h3{font-family:var(--sans);font-weight:700}

/* start page widgets */
.ntp .greet{transition:opacity .26s,transform .26s}
.greet.out{opacity:0;transform:translateY(4px)}
.wgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;width:min(1040px,100%);margin-top:30px;align-items:stretch}

<div id="app">
  <header class="strip" id="strip">
    <button class="ib logo" id="b-logo" title="Wizard Browser menu" aria-label="Menu"><img src="icons/icon-32.png" alt=""></button>
    <button class="wsbtn" id="b-ws" title="Workspaces (Ctrl+Alt+1…9)" aria-haspopup="menu"><span class="em" id="ws-em">✨</span><span class="nm" id="ws-name">Default</span><svg><use href="#i-chev"/></svg></button>

      <div class="tablist" id="tablist" role="tablist"></div>
      <button class="newtab" id="b-newtab" title="New tab (Ctrl+T)" aria-label="New tab"><svg><use href="#i-plus"/></svg><span>New tab</span></button>
    </div>
    <div class="drag"></div>
    <div class="ctl" id="ctl">
      <button id="w-min" aria-label="Minimize"><svg><use href="#i-min"/></svg></button>
      <button id="w-max" aria-label="Maximize"><svg id="w-max-i"><use href="#i-max"/></svg></button>
      <button id="w-close" class="x" aria-label="Close"><svg><use href="#i-x"/></svg></button>
    </div>
  </header>

  <div class="toolbar" id="toolbar">

    <button class="ib" id="b-reload" title="Reload (Ctrl+R)" aria-label="Reload"><svg id="b-reload-i"><use href="#i-reload"/></svg></button>
    <button class="ib" id="b-home" title="Home (Alt+Home)" aria-label="Home"><svg><use href="#i-home"/></svg></button>
    <div class="omni" id="omni">
      <svg class="lock neutral" id="o-lock"><use href="#i-search"/></svg>
      <input id="o-input" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address  ·  Ctrl+L" aria-label="Address bar">
      <button class="chip" id="b-shield" title="Blocked on this page" hidden><svg><use href="#i-shield"/></svg><b id="shield-n">0</b></button>
      <button class="ib" id="b-key" title="Saved logins" hidden><svg><use href="#i-key"/></svg></button>
      <button class="ib" id="b-star" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark"><svg id="b-star-i"><use href="#i-star"/></svg></button>
    </div>
    <button class="ib" id="b-find" title="Find in page (Ctrl+F)" aria-label="Find"><svg><use href="#i-find"/></svg></button>
    <button class="ib" id="b-ext" title="Extensions" aria-label="Extensions"><svg><use href="#i-puzzle"/></svg></button>
    <button class="ib" id="b-dl" title="Downloads (Ctrl+J)" aria-label="Downloads"><svg><use href="#i-download"/></svg><span class="dot" id="dl-dot" hidden></span></button>
    <button class="ib" id="b-acct" title="Wizard account" aria-label="Account"><svg><use href="#i-sigil"/></svg></button>
    <button class="ib" id="b-menu" title="Menu" aria-label="Menu"><svg><use href="#i-dots"/></svg></button>
  </div>

  <div class="bookm" id="bookm"></div>

<script>
'use strict';
/* ═══════════ Wizard Browser UI ═══════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = n => `<svg><use href="#i-${n}"/></svg>`;
const uid = () => Math.random().toString(36).slice(2, 10);
const SITE = 'https://wizardecosystem.dev';
const APPS = [
    { id: 'ai', name: 'AI', url: SITE + '/ai', c: '#d9b45a', i: 'sparkle' }, { id: 'search', name: 'Search', url: SITE + '/search', c: '#8b6cf0', i: 'search' },
    { id: 'mail', name: 'Mail', url: SITE + '/mail', c: '#5fb0e6', i: 'mail' }, { id: 'calendar', name: 'Calendar', url: SITE + '/calendar', c: '#ef8a6b', i: 'cal' },
    { id: 'notes', name: 'Notes', url: SITE + '/notes', c: '#e8c97a', i: 'note' }, { id: 'chat', name: 'Chat', url: SITE + '/chat', c: '#5fd0a0', i: 'chat' },
    { id: 'code', name: 'Code', url: SITE + '/code', c: '#7c9cff', i: 'sigil' }, { id: 'maps', name: 'Maps', url: SITE + '/maps', c: '#6bd0c4', i: 'globe' },
    { id: 'finance', name: 'Finance', url: SITE + '/finance', c: '#9bd96b', i: 'star' }, { id: 'home', name: 'Home', url: SITE, c: '#b79cf0', i: 'home' }
];
const ENGINES = {
    wizard: { name: 'Wizard Search', url: SITE + '/search?q=%s' }, ddg: { name: 'DuckDuckGo', url: 'https://duckduckgo.com/?q=%s' },
    google: { name: 'Google', url: 'https://www.google.com/search?q=%s' }, brave: { name: 'Brave Search', url: 'https://search.brave.com/search?q=%s' },
    startpage: { name: 'Startpage', url: 'https://www.startpage.com/do/search?q=%s' }, bing: { name: 'Bing', url: 'https://www.bing.com/search?q=%s' }
};
const BANGS = { g: 'google', ddg: 'ddg', b: 'brave', sp: 'startpage', bing: 'bing', w: 'https://en.wikipedia.org/w/index.php?search=%s', yt: 'https://www.youtube.com/results?search_query=%s', gh: 'https://github.com/search?q=%s', mdn: 'https://developer.mozilla.org/search?q=%s', aur: 'https://aur.archlinux.org/packages?K=%s' };
const SWATCH = ['#d9b45a', '#f2c94c', '#f59e0b', '#f97316', '#ef8a6b', '#ef4444', '#e11d48', '#e86aa6', '#d946ef', '#a855f7', '#8b6cf0', '#6366f1', '#3b82f6', '#5fb0e6', '#06b6d4', '#14b8a6', '#5fd0a0', '#22c55e', '#9bd96b', '#84cc16', '#2f6bff', '#00c8ff', '#94a3b8', '#f1f5f9'];
const isColor = c => /^#[0-9a-f]{6}$/i.test(c || '');
const isImgIcon = i => /^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(i || '') && i.length < 60000;
const iconHtml = (w, px = 16) => isImgIcon(w.icon) ? `<img src="${w.icon}" width="${px}" height="${px}" style="border-radius:4px;object-fit:cover;display:block" alt="">` : `<span>${esc(w.icon || '✨')}</span>`;
const iconText = w => isImgIcon(w.icon) ? '' : (w.icon || '');

/* ── pure helpers (also unit-tested) ── */
function looksLikeUrl(t) {
    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(t)) return true;
    if (/^(localhost|(\d{1,3}\.){3}\d{1,3})(:\d+)?([/?#].*)?$/i.test(t)) return true;
    if (/\s/.test(t)) return false;
    return /^([a-z0-9-]+\.)+[a-z]{2,}(:\d+)?([/?#].*)?$/i.test(t);
}
function toUrl(input, engineId) {
    let t = String(input || '').trim();
    if (!t) return '';
    if (/^(about|view-source|file):/i.test(t)) return t;
    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(t)) return t;
    const bang = /^!(\w+)\s+(.+)$/.exec(t);
    if (bang && BANGS[bang[1]]) { const b = BANGS[bang[1]]; const tpl = ENGINES[b] ? ENGINES[b].url : b; return tpl.replace('%s', encodeURIComponent(bang[2])); }
    if (looksLikeUrl(t)) return (/^(localhost|(\d{1,3}\.){3}\d{1,3})/i.test(t) ? 'http://' : 'https://') + t;
    return (ENGINES[engineId] || ENGINES.wizard).url.replace('%s', encodeURIComponent(t));
}
function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
function prettyUrl(u) { try { const x = new URL(u); return x.hostname.replace(/^www\./, '') + (x.pathname === '/' ? '' : x.pathname) + x.search; } catch (e) { return u; } }
function faviconFor(u) { const h = hostOf(u); return h ? `https://www.google.com/s2/favicons?domain=${encodeURIComponent(h)}&sz=32` : ''; }
function fuzzy(q, text) {            // returns a score (higher is better) or -1
    q = q.toLowerCase(); text = text.toLowerCase();
    if (!q) return 0;
    const i = text.indexOf(q); if (i >= 0) return 100 - i - (text.length - q.length) * 0.01;
    let qi = 0, score = 0, last = -2;
    for (let k = 0; k < text.length && qi < q.length; k++) if (text[k] === q[qi]) { score += last === k - 1 ? 3 : 1; last = k; qi++; }
    return qi === q.length ? score : -1;
}
function fmtBytes(n) { if (!n) return '0 B'; const u = ['B', 'KB', 'MB', 'GB']; let i = 0; while (n >= 1024 && i < 3) { n /= 1024; i++; } return n.toFixed(n < 10 && i ? 1 : 0) + ' ' + u[i]; }
function luminance(css) { const m = /(\d+)\D+(\d+)\D+(\d+)/.exec(css || ''); if (!m) return 0; return (0.2126 * m[1] + 0.7152 * m[2] + 0.0722 * m[3]) / 255; }
function mergeById(local, remote) { const m = new Map(); for (const x of remote || []) m.set(x.id, x); for (const x of local || []) m.set(x.id, x); return [...m.values()]; }

/* ── state ── */
const S = {
    info: {}, settings: {}, bookmarks: [], history: [], workspaces: [], panels: [], groups: [], sites: {},
    ws: 'default', tabs: [], active: {}, closed: [], panel: null, user: null, syncOk: null, chatUnread: 0,
    downloads: [], blockedTotal: 0, exts: [], clockT: null
};
const wsById = id => S.workspaces.find(w => w.id === id) || S.workspaces[0];
const curWs = () => wsById(S.ws);
const tabById = id => S.tabs.find(t => t.id === id);
const activeTab = () => tabById(S.active[S.ws]);
const wsTabs = (ws = S.ws) => S.tabs.filter(t => t.ws === ws);
// By default every workspace shares one cookie jar (sign in once, signed in everywhere, like Vivaldi).
// "Keep workspaces separate" gives each workspace its own jar instead.
const wsPartition = id => 'persist:ws-' + (S.settings.isolateWorkspaces ? id : 'default');
const partitionFor = (t) => t.priv ? 'private-' + t.privId : wsPartition(t.ws);
const debounces = {};
function debounce(key, fn, ms) { clearTimeout(debounces[key]); debounces[key] = setTimeout(fn, ms); }
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms); }

/* ── persistence ── */
function saveKey(key, val) { return wb.store.set(key, val); }
function saveBookmarks() { saveKey('bookmarks', S.bookmarks); queueSync(); renderBookmarkBar(); updateStar(); }
function saveWorkspaces() { saveKey('workspaces', S.workspaces); queueSync(); }
function savePanels() { saveKey('panels', S.panels); queueSync(); }
function saveGroups() { saveKey('groups', S.groups); queueSync(); }
function saveSettings(patch) { Object.assign(S.settings, patch); saveKey('settings', patch); queueSync(); }
function saveHistory() { debounce('hist', () => saveKey('history', S.history.slice(0, 3000)), 1500); }
function saveSession() {
    debounce('sess', () => {
        const out = { active: {}, tabs: [] };
        for (const t of S.tabs) if (!t.priv) out.tabs.push({ ws: t.ws, url: t.url, title: t.title, pinned: t.pinned, group: t.group || null, favicon: t.favicon || '' });
        for (const w of S.workspaces) { const a = tabById(S.active[w.id]); if (a && !a.priv) out.active[w.id] = S.tabs.filter(t => !t.priv).indexOf(a); }
        out.ws = S.ws;
        saveKey('session', out);
    }, 600);
}

/* ── theme ── */
// Windows: the native caption buttons follow the theme, and Mica/Acrylic lets the desktop show through the tab strip.
function syncWinChrome() {
    if (!S.info || S.info.platform !== 'win32') return;
    const mat = S.settings.winMaterial && S.settings.winMaterial !== 'none';
    document.body.classList.toggle('mat', !!mat);
    if (!S.info.overlay || !wb.win.overlay) return;
    requestAnimationFrame(() => { const st = $('#strip'); if (!st) return; const bg = mat ? '#00000000' : getComputedStyle(st).backgroundColor; wb.win.overlay(bg, getComputedStyle(document.body).color); });
}
function applyTheme() {
    const th = S.settings.theme || 'grimoire';
    document.documentElement.dataset.theme = themeById(th).id;
    const root = document.documentElement.style;
    ['--bg', '--bg2', '--panel', '--panel2', '--line', '--text', '--muted', '--gold', '--gold-soft', '--ntpbg'].forEach(v => root.removeProperty(v));
    const c = S.settings.customTheme;
    if (c && c.colors) {
        const k = c.colors;
        const frame = k.frame || k.toolbar, bar = k.toolbar || k.frame;
        if (frame) root.setProperty('--bg2', frame);
        if (bar) { root.setProperty('--panel', bar); root.setProperty('--panel2', bar); }
        const light = luminance(bar || frame) > 0.55;
        document.documentElement.dataset.theme = light ? 'light' : 'midnight';
        if (frame) root.setProperty('--bg2', frame);
        if (bar) { root.setProperty('--panel', bar); root.setProperty('--panel2', `color-mix(in srgb, ${bar} 88%, ${light ? '#000' : '#fff'})`); root.setProperty('--line', `color-mix(in srgb, ${bar} 80%, ${light ? '#000' : '#fff'})`); }
        const txt = k.tab_text || k.bookmark_text || k.ntp_text; if (txt) root.setProperty('--text', txt);
        const acc = k.button_background || k.ntp_link; if (acc) { root.setProperty('--gold', acc); root.setProperty('--gold-soft', `color-mix(in srgb, ${acc} 16%, transparent)`); }
        if (k.ntp_background) root.setProperty('--bg', k.ntp_background);
    }
    const own = (c && c.images && c.images.theme_ntp_background) || S.wallpaper;
    if (S.settings.wallpaper !== false) {
        if (own) root.setProperty('--ntpbg', `linear-gradient(rgba(8,6,18,.25),rgba(8,6,18,.45)),url("${own}")`);
        else if (!c && WALL[document.documentElement.dataset.theme]) root.setProperty('--ntpbg', `url("${WALL[document.documentElement.dataset.theme]()}")`);
    }
    if (S.settings.accent && /^#[0-9a-f]{6}$/i.test(S.settings.accent)) { root.setProperty('--gold', S.settings.accent); root.setProperty('--gold-soft', `color-mix(in srgb, ${S.settings.accent} 16%, transparent)`); }
    document.body.classList.toggle('vt', S.settings.tabLayout === 'left');
    syncWinChrome();
    if (typeof fxRefresh === 'function') fxRefresh();
    if (typeof applyBmMode === 'function') applyBmMode();
    document.body.classList.toggle('nofr', !!S.settings.nativeFrame);
    placeTabzone();
}
function placeTabzone() {
    const tz = $('#tabzone'), host = S.settings.tabLayout === 'left' ? $('#vtabs') : $('#strip');
    if (tz.parentElement === host) return;

    on('did-navigate', e => { onNavigated(t, e.url, true); });

function topSites(n = 8) {
    const m = {};
    for (const h of S.history) { const k = hostOf(h.url); if (!k) continue; const e = m[k] || (m[k] = { host: k, url: h.url, score: 0, title: h.title }); e.score += (h.visits || 1) * Math.exp(-(Date.now() - h.last) / (14 * 864e5)); if (h.url.length < e.url.length) e.url = h.url; }
    const skip = new Set(APPS.map(a => hostOf(a.url)));

/* ═══════════ Start page greeting: rotates through lines, or Wizard AI writes one from your day ═══════════ */
const GREET = { i: Math.floor(Math.random() * 100), t: null };
const GREET_MODES = [['cycle', 'Rotate through greetings'], ['ai', 'Wizard AI writes one from my day'], ['workspace', 'Show my workspace name']];
function greetPool() {
    const d = new Date(), hr = d.getHours(), name = S.user ? String(S.user.username || S.user.name || '').split(' ')[0] : '', nm = name ? ', ' + name : '';
    const base = hr < 5 ? 'Still up' : hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening', day = d.toLocaleDateString(undefined, { weekday: 'long' }), wk = d.getDay() === 0 || d.getDay() === 6;
    const p = [base + nm + '.', 'Happy ' + day + nm + '.', 'Welcome back' + nm + '.', 'Back in your ' + curWs().name + ' workspace.'];
    if (hr >= 22 || hr < 5) p.push('Late night. Do not forget to sleep.'); else if (wk) p.push('Enjoy the weekend.'); else if (hr < 10) p.push('Fresh start. Make it a good one.'); else p.push('Nice to see you.');
    const ml = WC.mail && WC.mail.v, ev = WC.cal && WC.cal.v;
    if (ml) { const un = ml.filter(x => !x.is_read).length; if (un) p.push(un + ' unread email' + (un === 1 ? '' : 's') + ' waiting.'); }
    if (ev) { const nx = ev.filter(e => e.e2 >= d).sort((a, b) => a.s - b.s)[0]; if (nx) p.push('Next up: ' + nx.title + (nx.all_day ? ', all day.' : ' at ' + wTime(nx.s) + '.')); }
    if (S.blockedTotal) p.push(S.blockedTotal.toLocaleString() + ' trackers blocked so far.');
    const open = S.tabs.filter(t => !t.priv).length; if (open > 3) p.push(open + ' tabs open. Ambitious.');
    return p;
}
const greetStore = { get() { try { return JSON.parse(localStorage.getItem('wb_greet') || 'null'); } catch (e) { return null; } }, set(v) { try { localStorage.setItem('wb_greet', JSON.stringify(v)); } catch (e) { /* ignore */ } } };
function greetSet(el, text) { if (!el || el.textContent === text) return; el.classList.add('out'); setTimeout(() => { el.textContent = text; el.classList.remove('out'); }, 260); }
function greetStart(n) {
    clearInterval(GREET.t); const el = $('.greet', n); if (!el || S.settings.ntpGreet === false) return;
    const mode = S.settings.greetMode || 'cycle';
    if (mode === 'workspace') { el.textContent = greetPool()[0].replace(/\.$/, '') + '. ' + iconText(curWs()) + ' ' + curWs().name + ' workspace'; return; }
    if (mode === 'ai') { const c = greetStore.get(); el.textContent = c && c.text && Date.now() - c.t < 6 * 3600e3 ? c.text : greetPool()[0]; greetAi(); return; }
    GREET.i++; const first = greetPool(); el.textContent = first[GREET.i % first.length];
    GREET.t = setInterval(() => { if (document.hidden || !n.classList.contains('show')) return; const p = greetPool(); GREET.i++; greetSet(el, p[GREET.i % p.length]); }, 8000);
}
let greetBusy = false;
async function greetAi(force) {
    if (!S.user || greetBusy || (S.settings.greetMode || 'cycle') !== 'ai' || S.settings.ntpGreet === false) return;
    const [m, c, n, w] = await Promise.allSettled([wMail(), wCal(), wNotes(), wWx()]); const now = new Date();
    const facts = [`Now: ${now.toLocaleString([], { weekday: 'long', hour: 'numeric', minute: '2-digit' })}`, `Name: ${S.user.username || S.user.name || ''}`];
    if (m.status === 'fulfilled') { const un = m.value.filter(x => !x.is_read).slice(0, 4); facts.push(`Unread emails: ${m.value.filter(x => !x.is_read).length}` + un.map(x => `\n- ${wName(x.from)}: ${String(x.subject || '').slice(0, 80)}`).join('')); }
    if (c.status === 'fulfilled') { const up = c.value.filter(e => e.e2 >= now).sort((a, b) => a.s - b.s).slice(0, 4); facts.push('Upcoming events:' + (up.length ? up.map(e => `\n- ${e.title} (${wDay(e.s)} ${e.all_day ? 'all day' : wTime(e.s)})`).join('') : ' none')); }
    if (n.status === 'fulfilled' && n.value.length) facts.push('Latest note: ' + String(n.value[0].title || '').slice(0, 60));
    if (w.status === 'fulfilled' && w.value.current) facts.push(`Weather: ${Math.round(w.value.current.temp)} degrees, ${w.value.current.condition}`);
    const text = facts.join('\n'), hash = String(text.split('').reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) | 0, 7)), c0 = greetStore.get();
    if (!force && c0 && c0.h === hash && Date.now() - c0.t < 30 * 60000) return;
    if (!force && c0 && Date.now() - c0.t < 10 * 60000) return;           // never more than one AI call every 10 minutes
    greetBusy = true;
    try {
        const r = await api('POST', '/api/notes/ai', { action: 'custom', instruction: 'Write ONE friendly greeting line (at most 130 characters) for a browser start page, using the facts in the text. If something is urgent or soon, such as a meeting or an important email, mention the single most time-sensitive thing. Otherwise be warm and brief. Plain text only: no emoji, no quotes, no markdown.', text });
        let out = r.ok && r.data && r.data.result ? String(r.data.result).split('\n')[0].replace(/^["“'\s]+|["”'\s]+$/g, '').slice(0, 160) : '';
        if (out.length > 3) { greetStore.set({ h: hash, t: Date.now(), text: out }); const nt = $('#ntp'); if (nt && nt.classList.contains('show')) greetSet($('.greet', nt), out); }
    } catch (e) { /* keep the current line */ } finally { greetBusy = false; }
}

function openPalette() {
    const all = commandList();
    const sc = document.createElement('div'); sc.className = 'scrim'; sc.style.alignItems = 'start';
    sc.innerHTML = `<div class="modal palette" role="dialog" aria-label="Command palette"><input id="pl-q" placeholder="Type a command, tab, bookmark or workspace…" autocomplete="off" spellcheck="false"><div class="res" id="pl-r"></div></div>`;
    $('#layer').appendChild(sc);
    const inp = $('#pl-q', sc), res = $('#pl-r', sc); let sel = 0, cur = [];
    const close = () => sc.remove();
    const draw = () => {
        const q = inp.value.trim();
        cur = all.map(c => ({ c, s: fuzzy(q, c.label + ' ' + (c.sub || '')) })).filter(o => o.s >= 0).sort((a, b) => b.s - a.s).slice(0, 30).map(o => o.c);
        if (q && !cur.length) cur = [{ label: 'Search the web for “' + q + '”', run: () => navigate(q, activeTab()), kind: 'Web' }];
        cur = withConjure(cur, q);
        sel = Math.min(sel, cur.length - 1);
        res.innerHTML = cur.map((c, i) => `<div class="row${i === sel ? ' sel' : ''}" data-i="${i}"><span>${esc(c.label)}${c.sub ? ` <span class="muted">· ${esc(c.sub)}</span>` : ''}</span><small>${esc(c.kind || '')}</small></div>`).join('');
        const s = $('.sel', res); if (s) s.scrollIntoView({ block: 'nearest' });

    inp.onkeydown = e => { if (e.key === 'Escape') close(); else if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, cur.length - 1); draw(); } else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); draw(); } else if (e.key === 'Enter' && cur[sel]) { const c = cur[sel]; close(); c.run(); } };
    res.onclick = e => { const r = e.target.closest('.row'); if (r) { const c = cur[Number(r.dataset.i)]; close(); c.run(); } };
    sc.onmousedown = e => { if (e.target === sc) close(); };
    draw(); inp.focus();
}

        draw(c, w, h, t, dt, st) { for (const s of st.stars) { c.fillStyle = `rgba(190,215,255,${(.25 + .5 * Math.abs(Math.sin(t * s.sp + s.ph))).toFixed(2)})`; c.fillRect(s.x, s.y, s.r, s.r); } if (!st.shoot && t > st.next) { st.shoot = { x: rnd(w * .2, w * .9), y: rnd(0, h * .25), t: 0 }; st.next = t + rnd(5, 11); } if (st.shoot) { const s = st.shoot; s.t += dt; const x = s.x - s.t * 520, y = s.y + s.t * 220; const g = c.createLinearGradient(x, y, x + 90, y - 38); g.addColorStop(0, 'rgba(200,225,255,.9)'); g.addColorStop(1, 'rgba(200,225,255,0)'); c.strokeStyle = g; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x, y); c.lineTo(x + 90, y - 38); c.stroke(); if (s.t > 1) st.shoot = null; } }
    },
    amethyst: {
        init(w, h, lvl) { return { gl: Array.from({ length: [10, 18, 30][lvl - 1] }, () => ({ x: rnd(0, w), y: rnd(0, h), ph: rnd(0, 6), sp: rnd(.4, 1.2), s: rnd(3, 8) })) }; },
        draw(c, w, h, t, dt, st) { c.save(); c.globalCompositeOperation = 'lighter'; for (const g of st.gl) { const a = Math.max(0, Math.sin(t * g.sp + g.ph)) ** 3; if (a < .02) continue; c.fillStyle = `rgba(214,170,255,${(a * .7).toFixed(2)})`; c.beginPath(); c.moveTo(g.x, g.y - g.s * 2); c.lineTo(g.x + g.s * .5, g.y); c.lineTo(g.x, g.y + g.s * 2); c.lineTo(g.x - g.s * .5, g.y); c.closePath(); c.fill(); c.beginPath(); c.moveTo(g.x - g.s * 2, g.y); c.lineTo(g.x, g.y + g.s * .5); c.lineTo(g.x + g.s * 2, g.y); c.lineTo(g.x, g.y - g.s * .5); c.closePath(); c.fill(); } c.restore(); }
    }
};

/* ═══════════ Quality-of-life commands ═══════════ */
const TRACKING = /^(utm_[a-z_]+|fbclid|gclid|dclid|msclkid|mc_eid|mc_cid|igshid|ref_src|_hsenc|_hsmi|yclid|spm)$/i;
function cleanUrl(u) { try { const x = new URL(u); for (const k of [...x.searchParams.keys()]) if (TRACKING.test(k)) x.searchParams.delete(k); return x.toString(); } catch (e) { return u; } }
async function copyText(s, msg) { try { await navigator.clipboard.writeText(s); toast(msg || 'Copied'); } catch (e) { toast('Could not copy'); } }
const realUrl = t => t && /^https?:/i.test(t.url || '') ? (S.settings.cleanCopy === false ? t.url : cleanUrl(t.url)) : '';
function otherTabs(t, side) { const mine = wsTabs().filter(x => !x.pinned); const i = mine.indexOf(t); return mine.filter((x, k) => x !== t && (side === 'right' ? k > i : true)); }
function toggleFocus() { document.body.classList.toggle('focus'); toast(document.body.classList.contains('focus') ? 'Focus mode on. Run it again to leave.' : 'Focus mode off'); }
function qolCommands() {
    const t = activeTab(), has = t && t.url;
    return [
        ['Duplicate tab', () => t && has && newTab(t.url, { after: t, priv: t.priv })],
        ['Copy page address', () => realUrl(t) ? copyText(realUrl(t), 'Address copied' + (realUrl(t) !== t.url ? ' (tracking removed)' : '')) : toast('Open a web page first')],
        ['Copy as Markdown link', () => realUrl(t) ? copyText('[' + (t.title || prettyUrl(t.url)).replace(/[\[\]]/g, '') + '](' + realUrl(t) + ')', 'Markdown link copied') : toast('Open a web page first')],
        ['Copy all tab addresses in this workspace', () => { const l = wsTabs().filter(x => !x.priv && /^https?:/i.test(x.url || '')).map(x => realUrl(x)); l.length ? copyText(l.join('\n'), l.length + ' addresses copied') : toast('No tabs to copy'); }],
        ['Close other tabs', () => { if (!t) return; const l = otherTabs(t); l.forEach(x => closeTab(x.id)); toast('Closed ' + l.length + ' tab' + (l.length === 1 ? '' : 's')); }],
        ['Close tabs to the right', () => { if (!t) return; const l = otherTabs(t, 'right'); l.forEach(x => closeTab(x.id)); toast('Closed ' + l.length + ' tab' + (l.length === 1 ? '' : 's')); }],
        ['Put other tabs to sleep', () => { if (!t) return; const l = wsTabs().filter(x => x !== t && x.view); l.forEach(sleepTab); toast('Sleeping ' + l.length + ' tab' + (l.length === 1 ? '' : 's')); }],
        ['Mute or unmute tab', () => toggleMute(t)],
        ['Pin or unpin tab', () => { if (t) { t.pinned = !t.pinned; renderTabs(); saveSession(); } }],
        ['Focus mode (hide side bars)', toggleFocus],
        ['Open all bookmarks in a new group', () => { if (!S.bookmarks.length) return toast('No bookmarks yet'); const g = { id: uid(), name: 'Bookmarks', color: SWATCH[S.groups.length % SWATCH.length] }; S.groups.push(g); saveGroups(); S.bookmarks.slice(0, 20).forEach(b => { const n = newTab(b.url, { background: true }); n.group = g.id; }); renderTabs(); saveSession(); }],
        ['Toggle animated start page', () => { saveSettings({ startAnim: fxLevel() ? 'off' : 'on' }); fxRefresh(); toast('Start page animation ' + (fxLevel() ? 'on' : 'off')); }]
    ].map(([label, run]) => ({ label, run, kind: 'Command' }));
}

/* ═══════════ Point-and-click quality of life (no shortcuts needed) ═══════════ */
const on_ = k => S.settings[k] !== false;

/* 1. Hover card on tabs: title, address, state and the AI summary of sleeping tabs */
let cardT = 0, cardEl = null;
function hideCard() { clearTimeout(cardT); if (cardEl) { cardEl.remove(); cardEl = null; } }
function showCard(tabEl_) {
    const t = tabById(tabEl_.dataset.id); if (!t || $('.pop') || $('.scrim')) return; hideCard();
    const st = [t.sleeping ? 'Sleeping' : '', t.audible ? (t.muted ? 'Muted' : 'Playing audio') : '', t.loading ? 'Loading' : '', t.priv ? 'Private' : '', t.pinned ? 'Pinned' : ''].filter(Boolean).join(' · ');
    const c = document.createElement('div'); c.className = 'tabcard'; c.setAttribute('role', 'tooltip');
    c.innerHTML = `<b>${esc(t.title || 'New tab')}</b><span class="u">${esc(t.url ? prettyUrl(t.url) : 'New tab page')}</span>${st ? `<span class="s">${esc(st)}</span>` : ''}${t.digest ? `<p>${esc(t.digest)}</p>` : ''}`;
    document.body.appendChild(c); const r = tabEl_.getBoundingClientRect(), w = c.offsetWidth, vt = document.body.classList.contains('vt');
    c.style.left = Math.max(8, Math.min(innerWidth - w - 8, vt ? r.right + 8 : r.left)) + 'px'; c.style.top = (vt ? r.top : r.bottom + 6) + 'px'; cardEl = c;
}
$('#tabzone').addEventListener('mouseover', e => { const el = e.target.closest('.tab'); if (!el || e.target.closest('[data-act]')) return hideCard(); if (!on_('tabPreview')) return; clearTimeout(cardT); cardT = setTimeout(() => showCard(el), cardEl ? 60 : 450); });
$('#tabzone').addEventListener('mouseleave', hideCard); ['mousedown', 'dragstart', 'contextmenu', 'wheel'].forEach(ev => $('#tabzone').addEventListener(ev, hideCard, true));

/* 2. Undo after closing tabs */
let undoN = 0, undoT = 0;
const _closeTab = closeTab;
closeTab = function (id, o) { const t = tabById(id), real = !!(t && !t.priv && t.url); _closeTab(id, o); if (real && on_('undoClose')) { undoN++; clearTimeout(undoT); undoT = setTimeout(showUndo, 350); } };
function showUndo() {
    let u = $('#undo'); if (!u) { u = document.createElement('div'); u.id = 'undo'; u.setAttribute('role', 'status'); document.body.appendChild(u); }
    const n = undoN; undoN = 0; u.innerHTML = `<span>Closed ${n} tab${n === 1 ? '' : 's'}</span><button class="btn pri" id="undo-b">Undo</button>`; u.classList.add('show');
    $('#undo-b', u).onclick = () => { for (let i = 0; i < n; i++) reopenClosed(); u.classList.remove('show'); }; clearTimeout(showUndo.t); showUndo.t = setTimeout(() => u.classList.remove('show'), 6000);
}

/* 3. Address bar: copy button + right-click menu */
(function () {
    const b = document.createElement('button'); b.className = 'ib'; b.id = 'b-copy'; b.title = 'Copy address'; b.setAttribute('aria-label', 'Copy address'); b.innerHTML = '<svg><use href="#i-copy"/></svg>'; b.hidden = true; $('#b-star').before(b);
    b.onclick = () => { const t = activeTab(); realUrl(t) ? copyText(realUrl(t), 'Address copied' + (realUrl(t) !== t.url ? ' (tracking removed)' : '')) : 0; };
    const sync = () => { const t = activeTab(); b.hidden = !(t && /^https?:/i.test(t.url || '')); }; setInterval(sync, 400);
    $('#o-input').addEventListener('contextmenu', e => {
        e.preventDefault(); const t = activeTab(), inp = e.currentTarget;
        showMenu(e.clientX, e.clientY, [
            { label: 'Paste and go', run: async () => { try { const s = (await navigator.clipboard.readText()).trim(); if (s) { inp.value = s; navigate(s, activeTab()); } } catch (x) { toast('Could not read the clipboard'); } } },
            { label: 'Paste', run: async () => { try { inp.focus(); const s = await navigator.clipboard.readText(); inp.setRangeText(s, inp.selectionStart, inp.selectionEnd, 'end'); inp.dispatchEvent(new Event('input')); } catch (x) { toast('Could not read the clipboard'); } } },
            '-', { label: 'Copy', disabled: inp.selectionStart === inp.selectionEnd, run: () => copyText(inp.value.slice(inp.selectionStart, inp.selectionEnd)) },
            { label: 'Copy address', disabled: !realUrl(t), run: () => copyText(realUrl(t), 'Address copied') }, { label: 'Select all', run: () => { inp.focus(); inp.select(); } }
        ]);
    });
})();

/* 4. Tabs ease in when opened */
const _newTab = newTab;
newTab = function () { const t = _newTab.apply(this, arguments); if (t) requestAnimationFrame(() => { const el = $(`.tab[data-id="${t.id}"]`); if (el) { el.classList.add('enter'); setTimeout(() => el.classList.remove('enter'), 260); } }); return t; };

/* 5. Progress line under the toolbar: loading shimmer, otherwise how far you have scrolled */
(function () {
    const p = document.createElement('div'); p.id = 'prog'; $('#toolbar').appendChild(p);
    setInterval(() => { const t = activeTab(); const ld = !!(t && t.loading); p.classList.toggle('loading', ld); p.style.opacity = ld || (on_('scrollBar') && t && t.scroll > 0.01) ? 1 : 0; p.style.setProperty('--sp', ld ? '100%' : ((t && t.scroll || 0) * 100).toFixed(1) + '%'); }, 150);
})();
function onPageScroll(t, v) { t.scroll = Math.max(0, Math.min(1, Number(v) || 0)); }

/* 6. Bookmarks bar only on the start page (optional) */
function applyBmMode() { document.body.classList.toggle('bm-ntp', S.settings.bmMode === 'ntp'); }

/* 7. Tab tools in the main menu and tab menu */
function tabTools(t) {
    return [
        { label: 'Duplicate tab', disabled: !t || !t.url, run: () => qolCommands().find(c => c.label === 'Duplicate tab').run() },
        { label: 'Copy address', disabled: !realUrl(t), run: () => copyText(realUrl(t), 'Address copied') },
        { label: 'Copy as Markdown link', disabled: !realUrl(t), run: () => qolCommands().find(c => c.label === 'Copy as Markdown link').run() },
        { label: 'Close other tabs', run: () => qolCommands().find(c => c.label === 'Close other tabs').run() },
        { label: 'Put other tabs to sleep', run: () => qolCommands().find(c => c.label === 'Put other tabs to sleep').run() },
        { label: 'Focus mode', run: toggleFocus }, { label: 'Rewind this workspace…', run: openRewind }
    ];
}

/* ═══════════ Start-up ═══════════ */
const DEFAULT_WS = [{ id: 'default', name: 'Default', icon: '✨', color: '#d9b45a' }, { id: 'work', name: 'Work', icon: '💼', color: '#5fb0e6' }, { id: 'school', name: 'School', icon: '📚', color: '#8b6cf0' }, { id: 'media', name: 'Media', icon: '🎬', color: '#ef8a6b' }];
const DEFAULT_PANELS = [{ id: 'chat', name: 'Chat', url: SITE + '/chat' }, { id: 'mail', name: 'Mail', url: SITE + '/mail' }, { id: 'calendar', name: 'Calendar', url: SITE + '/calendar' }];

async function migrateLegacy() {
    // Older versions kept passwords in plain text in localStorage. Move them into the encrypted vault and delete the plain copy.
    try {
        const pw = JSON.parse(localStorage.getItem('wizard_passwords') || '[]');
        if (Array.isArray(pw) && pw.length) { let ok = true; for (const p of pw) { const r = await wb.vault.save({ host: p.url, username: p.username, password: p.password }); if (r === 'invalid') ok = ok && true; } if (ok) { localStorage.removeItem('wizard_passwords'); toast('Your saved passwords were moved into encrypted storage', 5000); } }
        const bm = JSON.parse(localStorage.getItem('wizard_bookmarks') || '[]');
        if (Array.isArray(bm) && bm.length) { const have = new Set(S.bookmarks.map(b => b.url)); for (const b of bm) if (b && /^https?:/i.test(b.url || '') && !have.has(b.url)) S.bookmarks.push({ id: uid(), url: b.url, title: b.title || prettyUrl(b.url), folder: '', added: Date.now() }); saveKey('bookmarks', S.bookmarks); localStorage.removeItem('wizard_bookmarks'); }
        ['wizard_settings', 'wizard_workspaces'].forEach(k => localStorage.removeItem(k));
    } catch (e) { /* nothing to migrate */ }
}

async function init() {
    S.info = await wb.info();
    document.body.classList.add('plat-' + S.info.platform); if (S.info.overlay) document.body.classList.add('ovl');
    S.settings = await wb.store.get('settings');
    S.bookmarks = await wb.store.get('bookmarks', []); S.history = await wb.store.get('history', []);
    S.workspaces = await wb.store.get('workspaces', null);
    if (!Array.isArray(S.workspaces) || !S.workspaces.length || !S.workspaces.every(w => w && w.id && w.icon && isColor(w.color))) { S.workspaces = DEFAULT_WS.map(w => ({ ...w })); saveKey('workspaces', S.workspaces); }
    S.panels = await wb.store.get('panels', null); if (!Array.isArray(S.panels)) { S.panels = DEFAULT_PANELS.map(p => ({ ...p })); saveKey('panels', S.panels); }
    S.groups = await wb.store.get('groups', []); S.sites = await wb.store.get('sitesettings', {});
    try { S.wallpaper = await wb.wallpaper.get(); } catch (e) { S.wallpaper = null; }
    await migrateLegacy();
    applyTheme(); renderBookmarkBar(); renderRail(); wSchedule();
    // restore tabs
    const sess = S.settings.restoreSession !== false ? await wb.store.get('session', null) : null;
    S.ws = sess && S.workspaces.some(w => w.id === sess.ws) ? sess.ws : S.workspaces[0].id;
    if (sess && Array.isArray(sess.tabs)) {
        const real = [];
        for (const x of sess.tabs) if (S.workspaces.some(w => w.id === x.ws)) { const t = newTab(x.url || '', { ws: x.ws, title: x.title, favicon: x.favicon, pinned: x.pinned, group: x.group, background: true }); t.sleeping = !!t.url && !isInternal(t); real.push(t); }
        for (const w of S.workspaces) { const i = sess.active && sess.active[w.id]; const t = i != null && real[i] && real[i].ws === w.id ? real[i] : real.find(r => r.ws === w.id); if (t) S.active[w.id] = t.id; }
    }
    setWsColor();
    const urls = await wb.ready();
    if (urls.length) { urls.forEach((u, i) => newTab(u, { background: false })); }
    else if (wsTabs().length) activate((tabById(S.active[S.ws]) || wsTabs()[0]).id);
    else newTab(S.settings.homepage || '');
    renderTabs();
    const st = await wb.win.state(); document.body.classList.toggle('blurred', !st.focused);
    refreshExts(); bootAuth();
    document.addEventListener('visibilitychange', () => { if (!document.hidden && S.user) pollChat(); });
    window.__wbReady = true;
}
init().catch(e => { console.error(e); document.body.insertAdjacentHTML('beforeend', `<pre style="position:fixed;inset:20px;color:#f88;background:#000;padding:16px;z-index:999">Wizard Browser failed to start:\n${esc(e && e.stack || e)}</pre>`); });

</script>
