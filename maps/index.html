<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>🗺️ Wizard Maps</title>
<meta name="theme-color" content="#0a0814">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wizard Maps">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0814'/><text y='.9em' font-size='80' x='10'>🗺️</text></svg>">

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* [unchanged styles from previous version — paste them all back in] */
:root {
    --bg-primary: #0a0a14;
    --bg-card: rgba(18,18,35,0.96);
    --bg-glass: rgba(18,18,35,0.85);
    --text-primary: #ffffff;
    --text-secondary: #e0e0ff;
    --text-muted: #a0a0c0;
    --border: rgba(139,92,246,0.3);
    --primary: #a855f7;
    --primary-dark: #7c3aed;
    --primary-light: #c084fc;
    --primary-glow: rgba(168,85,247,0.4);
    --danger: #ef4444;
    --success: #10b981;
    --warning: #f59e0b;
    --nav-accent: #00aaff;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    position: fixed;
    width: 100%;
}

#map { position: absolute; inset: 0; width: 100%; height: 100%; background: var(--bg-primary); }

/* HEADER */
.maps-header {
    position: absolute;
    top: calc(12px + var(--safe-top));
    left: 12px; right: 12px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: none;
}
.maps-header > * { pointer-events: auto; }
.header-logo {
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 40px;
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: transform 0.15s;
    flex-shrink: 0;
}
.header-logo:active { transform: scale(0.96); }
.header-logo .logo-icon { font-size: 20px; }
.header-logo .logo-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 600;
    background: linear-gradient(135deg, var(--primary-light), var(--primary));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    white-space: nowrap;
}
.search-wrapper { flex: 1; position: relative; min-width: 0; }
.maps-search {
    width: 100%;
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 40px;
    padding: 12px 44px;
    color: var(--text-primary);
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.maps-search:focus { border-color: var(--primary); box-shadow: 0 0 25px var(--primary-glow); }
.search-icon {
    position: absolute;
    left: 16px; top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: var(--text-muted);
    pointer-events: none;
}
.search-clear {
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.1);
    border: none;
    border-radius: 50%;
    width: 32px; height: 32px;
    color: var(--text-muted);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 14px;
}
.search-clear.show { display: flex; }
.search-clear:active { background: rgba(239,68,68,0.3); color: var(--danger); }

.search-results {
    position: absolute;
    top: calc(100% + 8px);
    left: 0; right: 0;
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-height: 60vh;
    overflow-y: auto;
    display: none;
    box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    z-index: 200;
    -webkit-overflow-scrolling: touch;
}
.search-results.show { display: block; }
.search-result-item {
    padding: 14px 18px;
    cursor: pointer;
    border-bottom: 1px solid rgba(139,92,246,0.1);
    display: flex;
    gap: 12px;
    align-items: flex-start;
}
.search-result-item:last-child { border-bottom: none; }
.search-result-item:active { background: rgba(139,92,246,0.25); }
.search-result-icon { font-size: 20px; line-height: 1.4; flex-shrink: 0; }
.search-result-text { flex: 1; min-width: 0; }
.search-result-title { font-size: 15px; font-weight: 500; margin-bottom: 3px; }
.search-result-subtitle { font-size: 13px; color: var(--text-muted); line-height: 1.35; }
.search-loading, .search-empty { padding: 24px; text-align: center; color: var(--text-muted); font-size: 14px; }

/* saved place chip in search dropdown */
.search-result-item.is-saved .search-result-icon { color: var(--primary-light); }
.search-result-tag {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    background: rgba(139,92,246,0.2);
    color: var(--primary-light);
    border-radius: 20px;
    margin-left: 6px;
    vertical-align: middle;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.header-actions { display: flex; gap: 8px; flex-shrink: 0; }
.icon-btn {
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 44px; height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    color: var(--text-primary);
    transition: transform 0.15s, background 0.2s;
    flex-shrink: 0;
}
.icon-btn:active { background: rgba(139,92,246,0.3); transform: scale(0.94); }
.icon-btn.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border-color: transparent;
    box-shadow: 0 0 20px var(--primary-glow);
}

/* QUICK CHIPS */
.quick-places {
    position: absolute;
    top: calc(70px + var(--safe-top));
    left: 0; right: 0;
    z-index: 99;
    display: flex;
    gap: 8px;
    padding: 0 12px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    pointer-events: none;
}
.quick-places::-webkit-scrollbar { display: none; }
.quick-chip {
    pointer-events: auto;
    flex-shrink: 0;
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 40px;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    white-space: nowrap;
    transition: transform 0.15s, background 0.2s, border-color 0.2s;
}
.quick-chip:active { background: rgba(139,92,246,0.25); transform: scale(0.95); }
.quick-chip .chip-emoji { font-size: 16px; }
.quick-chip.add-new { border-style: dashed; color: var(--primary-light); }
.quick-chip.add-new:active { background: rgba(139,92,246,0.3); }
body.navigating .quick-places { display: none; }

/* LOCATION BANNER */
.locate-banner {
    position: fixed;
    bottom: calc(20px + var(--safe-bottom));
    left: 16px; right: 16px;
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 150;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    animation: slideUp 0.4s ease;
    max-width: 480px;
    margin: 0 auto;
}
.locate-banner.hidden { display: none; }
@keyframes slideUp {
    from { transform: translateY(120%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}
.locate-icon { font-size: 32px; flex-shrink: 0; }
.locate-text { flex: 1; font-size: 14px; line-height: 1.4; }
.locate-text strong { display: block; font-size: 15px; margin-bottom: 2px; }
.locate-text small { color: var(--text-muted); font-size: 12px; }
.locate-btn {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border: none;
    border-radius: 50px;
    padding: 12px 22px;
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
}
.locate-btn:active { transform: scale(0.96); }

/* BOTTOM SHEET */
.sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 150;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
}
.sheet-backdrop.show { opacity: 1; pointer-events: auto; }
.bottom-sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--bg-card);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid var(--border);
    border-radius: 24px 24px 0 0;
    z-index: 200;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    padding-bottom: var(--safe-bottom);
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
}
.bottom-sheet.show { transform: translateY(0); }
.sheet-handle {
    width: 44px; height: 5px;
    background: rgba(255,255,255,0.25);
    border-radius: 3px;
    margin: 10px auto 4px;
    flex-shrink: 0;
}
.sheet-header {
    padding: 8px 20px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}
.sheet-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--primary-light);
}
.sheet-close {
    background: rgba(255,255,255,0.08);
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 20px;
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
.sheet-close:active { background: rgba(239,68,68,0.2); color: var(--danger); }
.sheet-body {
    padding: 20px;
    overflow-y: auto;
    flex: 1;
    -webkit-overflow-scrolling: touch;
}

/* ROUTE INPUTS */
.route-input-group { margin-bottom: 12px; position: relative; }
.route-input-wrapper { position: relative; display: flex; align-items: center; gap: 10px; }
.route-input-icon {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 15px;
    font-weight: bold;
    color: white;
}
.route-input-icon.start { background: linear-gradient(135deg, #10b981, #059669); }
.route-input-icon.end { background: linear-gradient(135deg, #ef4444, #b91c1c); }
.route-input-wrapper input {
    flex: 1;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    color: var(--text-primary);
    font-size: 16px;
    font-family: inherit;
    outline: none;
    min-width: 0;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.route-input-wrapper input:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
.route-input-wrapper input::placeholder { color: var(--text-muted); }
.route-suggestions {
    position: absolute;
    top: calc(100% + 6px);
    left: 44px; right: 0;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    max-height: 200px;
    overflow-y: auto;
    display: none;
    z-index: 10;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    -webkit-overflow-scrolling: touch;
}
.route-suggestions.show { display: block; }
.route-suggestion-item {
    padding: 12px 16px;
    cursor: pointer;
    font-size: 14px;
    border-bottom: 1px solid rgba(139,92,246,0.1);
    line-height: 1.4;
}
.route-suggestion-item:active { background: rgba(139,92,246,0.25); }
.route-suggestion-item:last-child { border-bottom: none; }
.route-suggestion-item strong { display: block; }
.route-suggestion-item small { color: var(--text-muted); }

/* TRAVEL MODES */
.travel-modes { display: flex; gap: 8px; margin-top: 18px; margin-bottom: 18px; }
.travel-mode {
    flex: 1;
    padding: 14px 8px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    text-align: center;
    transition: transform 0.15s, background 0.2s;
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
}
.travel-mode:active { transform: scale(0.96); }
.travel-mode.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border-color: transparent;
    color: white;
    box-shadow: 0 0 20px var(--primary-glow);
}
.travel-mode-icon { font-size: 22px; display: block; margin-bottom: 4px; }

/* ROUTE SUMMARY */
.route-summary { margin-top: 20px; }
.route-summary-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding: 16px;
    background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(0,0,0,0.2));
    border-radius: 16px;
    border-left: 4px solid var(--primary);
}
.route-summary-time {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 600;
    color: var(--primary-light);
    line-height: 1;
}
.route-summary-distance { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
.steps-list { display: flex; flex-direction: column; gap: 6px; }
.step-item {
    display: flex;
    gap: 14px;
    padding: 12px 14px;
    border-radius: 14px;
    cursor: pointer;
    align-items: flex-start;
    border-left: 3px solid transparent;
    transition: background 0.15s, border-color 0.15s;
}
.step-item:active { background: rgba(139,92,246,0.15); }
.step-item.active { background: rgba(139,92,246,0.2); border-left-color: var(--primary); }
.step-icon {
    width: 38px; height: 38px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(139,92,246,0.15);
    border-radius: 50%;
    font-size: 18px;
}
.step-content { flex: 1; min-width: 0; }
.step-instruction { font-size: 14px; color: var(--text-secondary); line-height: 1.4; }
.step-distance { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

/* SAVED PLACES LIST */
.saved-places-list { display: flex; flex-direction: column; gap: 8px; }
.saved-place-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    border-radius: 16px;
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
}
.saved-place-item:active { background: rgba(139,92,246,0.2); transform: scale(0.98); }
.saved-place-emoji {
    font-size: 26px;
    width: 44px; height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(139,92,246,0.15);
    border-radius: 12px;
    flex-shrink: 0;
}
.saved-place-info { flex: 1; min-width: 0; }
.saved-place-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
.saved-place-address { font-size: 12px; color: var(--text-muted); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.saved-place-delete {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    padding: 8px;
    cursor: pointer;
    flex-shrink: 0;
    border-radius: 8px;
}
.saved-place-delete:active { background: rgba(239,68,68,0.2); color: var(--danger); }

.no-saved-places { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; }
.no-saved-places .big-emoji { font-size: 48px; display: block; margin-bottom: 12px; opacity: 0.6; }

.add-place-form {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    display: none;
}
.add-place-form.show { display: block; }
.add-place-form label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-weight: 500;
}
.add-place-form input,
.add-place-form select {
    width: 100%;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text-primary);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    margin-bottom: 12px;
    appearance: none;
    -webkit-appearance: none;
}
.add-place-form input:focus,
.add-place-form select:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

/* Save-as dropdown — the fix */
.save-as-select {
    width: 100%;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 40px 12px 14px;
    color: var(--text-primary);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%23a0a0c0' d='M6 8L0 0h12z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    margin-bottom: 12px;
}
.save-as-select:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
.save-as-select option { background: #0f0f1c; color: white; }

.emoji-picker { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.emoji-option {
    width: 40px; height: 40px;
    background: rgba(0,0,0,0.3);
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, border-color 0.2s;
}
.emoji-option:active { transform: scale(0.9); }
.emoji-option.selected { border-color: var(--primary); background: rgba(139,92,246,0.2); box-shadow: 0 0 12px var(--primary-glow); }

.form-buttons { display: flex; gap: 10px; margin-top: 8px; }
.form-btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
}
.form-btn.primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
.form-btn.ghost { background: rgba(255,255,255,0.06); color: var(--text-secondary); border: 1px solid var(--border); }

.add-place-btn {
    width: 100%;
    padding: 14px;
    background: rgba(139,92,246,0.15);
    border: 1px dashed var(--primary);
    border-radius: 16px;
    color: var(--primary-light);
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
}
.add-place-btn:active { background: rgba(139,92,246,0.3); }

/* NAVIGATION */
body.navigating .maps-header,
body.navigating .bottom-bar,
body.navigating .map-controls,
body.navigating .locate-banner,
body.navigating .directions-sheet,
body.navigating .layers-sheet,
body.navigating .saved-sheet,
body.navigating .sheet-backdrop { display: none !important; }

.nav-top {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: linear-gradient(180deg, rgba(10,8,20,0.98), rgba(10,8,20,0.85) 70%, transparent);
    padding: calc(16px + var(--safe-top)) 20px 24px;
    z-index: 200;
    display: none;
    align-items: flex-start;
    gap: 18px;
}
body.navigating .nav-top { display: flex; }
.nav-arrow {
    font-size: 56px;

.nav-instruction { flex: 1; min-width: 0; }

.nav-bottom {

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    display: none;
    gap: 16px;
    align-items: center;
}
body.navigating .nav-bottom { display: flex; }
.nav-eta-block { flex: 1; }
.nav-eta {

.nav-end-btn {

.recenter-btn {

.recenter-btn:active { background: rgba(139,92,246,0.3); }

.user-marker { filter: drop-shadow(0 0 10px rgba(0,170,255,0.8)); }
.user-marker-arrow { transform-origin: center; transition: transform 0.15s linear; }

/* STYLE GRID */
.style-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.style-option {

    flex-direction: column;
    align-items: center;

    gap: 6px;
    font-size: 11px;

    padding: 8px;
    text-align: center;
}
.style-option:active { transform: scale(0.96); }
.style-option.active { border-color: var(--primary); background: rgba(139,92,246,0.2); box-shadow: 0 0 15px var(--primary-glow); }
.style-swatch { width: 26px; height: 26px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); }

.toggle-row {

    justify-content: space-between;
    align-items: center;

.toggle-switch {

.toggle-switch::after {
    content: '';

    width: 22px; height: 22px;
    background: white;
    border-radius: 50%;
    top: 3px; left: 3px;
    transition: left 0.2s;
}
.toggle-switch.active::after { left: 23px; }

/* segmented units control */
.units-segmented {

    gap: 3px;
}
.units-seg {

    text-align: center;
    font-size: 13px;
    font-weight: 600;

/* MAP CONTROLS */
.map-controls {
    position: absolute;

    z-index: 90;
    display: flex;
    flex-direction: column;

}
.map-control-btn {

}
.map-control-btn:active { background: rgba(139,92,246,0.3); transform: scale(0.94); }

.bottom-bar {

/* MapLibre overrides */

<script>
// ══════════════════════════════════════
// CONFIG
// ══════════════════════════════════════
const CONFIG = {
    STYLES: {
        liberty:  'https://tiles.openfreemap.org/styles/liberty',
        bright:   'https://tiles.openfreemap.org/styles/bright',
        positron: 'https://tiles.openfreemap.org/styles/positron',
        dark:     'https://tiles.openfreemap.org/styles/dark',
        fiord:    'https://tiles.openfreemap.org/styles/fiord',
        liberty3d:'https://tiles.openfreemap.org/styles/liberty'
    },
    GEOCODE_URL: 'https://photon.komoot.io/api/',
    REVERSE_URL: 'https://photon.komoot.io/reverse',
    ROUTE_SERVERS: {
        driving: 'https://routing.openstreetmap.de/routed-car/route/v1/driving/',
        cycling: 'https://routing.openstreetmap.de/routed-bike/route/v1/driving/',
        walking: 'https://routing.openstreetmap.de/routed-foot/route/v1/driving/'
    },
    FALLBACK_SPEEDS: { walking: 1.4, cycling: 4.2 },
    DEFAULT_CENTER: [0, 20],
    DEFAULT_ZOOM: 2
};

const STORAGE_KEY = 'wizard_maps_saved_places_v1';
const SETTINGS_KEY = 'wizard_maps_settings_v1';

// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
const state = {
    style: 'liberty',
    routeProfile: 'driving',
    routeData: null,
    startPoint: null,
    endPoint: null,
    navigationActive: false,
    buildings3D: false,
    terrain: false,
    userMarker: null,
    userHeading: 0,
    routeStartMarker: null,
    routeEndMarker: null,
    savedPlaces: [],
    editingPlaceId: null,
    pendingPlaceCenter: null,
    units: 'metric' // 'metric' or 'imperial'
};

const nav = {
    watchId: null,
    wakeLock: null,
    lastPosition: null,
    currentStepIndex: 0,
    offRouteCount: 0,
    voiceEnabled: true,
    lastSpokenStepIndex: -1,
    lastSpokenDistance: -1,
    followUser: true,
    updateInterval: null,
    lastAnnouncedAt: -1
};

// ══════════════════════════════════════
// SETTINGS PERSISTENCE
// ══════════════════════════════════════
function loadSettings() {
    try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        if (raw) {
            const s = JSON.parse(raw);
            if (s.units) state.units = s.units;
            if (s.voiceEnabled != null) nav.voiceEnabled = s.voiceEnabled;
            if (s.style) state.style = s.style;
        } else {
            // Auto-detect: US uses imperial
            const lang = (navigator.language || 'en').toLowerCase();
            state.units = lang.startsWith('en-us') ? 'imperial' : 'metric';
        }
    } catch {}
}

function saveSettings() {
    try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify({
            units: state.units,
            voiceEnabled: nav.voiceEnabled,
            style: state.style
        }));
    } catch {}
}

// ══════════════════════════════════════
// UNITS
// ══════════════════════════════════════
function formatDistance(meters) {
    if (state.units === 'imperial') {
        const feet = meters * 3.28084;
        const miles = meters / 1609.344;
        if (feet < 500) return `${Math.round(feet / 10) * 10} ft`;
        if (miles < 0.1) return `${Math.round(feet / 10) * 10} ft`;
        return miles < 10 ? `${miles.toFixed(1)} mi` : `${Math.round(miles)} mi`;
    } else {
        if (meters < 10) return `${Math.round(meters)} m`;
        if (meters < 1000) return `${Math.round(meters / 10) * 10} m`;
        const km = meters / 1000;
        return km < 10 ? `${km.toFixed(1)} km` : `${Math.round(km)} km`;
    }
}

function formatDuration(seconds) {
    const mins = Math.round(seconds / 60);
    if (mins < 1) return '< 1 min';
    if (mins < 60) return `${mins} min`;
    const hours = Math.floor(mins / 60);
    const rem = mins % 60;
    return rem === 0 ? `${hours} hr` : `${hours} hr ${rem} min`;
}

function formatClock(date) {
    return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function loadSavedPlaces() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
            state.savedPlaces = [
                { id: 'home',   name: 'Home',   emoji: '🏠', address: '', center: null, slot: 'home',   createdAt: Date.now() },
                { id: 'work',   name: 'Work',   emoji: '💼', address: '', center: null, slot: 'work',   createdAt: Date.now() },
                { id: 'school', name: 'School', emoji: '📚', address: '', center: null, slot: 'school', createdAt: Date.now() }
            ];
            saveSavedPlaces();
            return;
        }
        state.savedPlaces = JSON.parse(raw) || [];
    } catch {
        state.savedPlaces = [];
    }
}

function saveSavedPlaces() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.savedPlaces));
    } catch {
        showToast('⚠️ Could not save');
    }
}

function getPlace(id) {
    return state.savedPlaces.find(p => p.id === id);
}

function findPlaceByNameOrSlot(name) {
    if (!name) return null;
    const q = name.trim().toLowerCase();
    // exact slot match
    const bySlot = state.savedPlaces.find(p => p.slot === q);
    if (bySlot) return bySlot;
    // exact name match
    const byName = state.savedPlaces.find(p => p.name.toLowerCase() === q);
    if (byName) return byName;
    // starts-with
    const byPrefix = state.savedPlaces.find(p => p.name.toLowerCase().startsWith(q) && q.length >= 3);
    return byPrefix || null;
}

function upsertPlace(place) {
    const idx = state.savedPlaces.findIndex(p => p.id === place.id);
    if (idx >= 0) state.savedPlaces[idx] = place;
    else state.savedPlaces.push(place);
    saveSavedPlaces();
    renderQuickPlaces();
    renderSavedPlacesList();
}

function deletePlace(id) {
    state.savedPlaces = state.savedPlaces.filter(p => p.id !== id);
    saveSavedPlaces();
    renderQuickPlaces();
    renderSavedPlacesList();
}

addPlaceSave.addEventListener('click', async () => {
    const slot = addPlaceSlot.value;
    let name = addPlaceNameInput.value.trim();
    let emoji = selectedEmoji;

    if (slot === 'home') { name = 'Home'; emoji = '🏠'; }
    else if (slot === 'work') { name = 'Work'; emoji = '💼'; }
    else if (slot === 'school') { name = 'School'; emoji = '📚'; }

    if (!name) {
        showToast('⚠️ Give this place a name');
        addPlaceNameInput.focus();
        return;
    }

    // Need a center. Prefer pendingPlaceCenter, else try to geocode the typed address.
    let center = state.pendingPlaceCenter;
    let address = addPlaceAddressInput.value.trim();

    if (!center) {
        if (!address) {
            showToast('⚠️ Pick an address or drop a pin on the map');
            addPlaceAddressInput.focus();
            return;
        }
        // Geocode the raw address
        const features = await photonSearch(address, 1);
        if (!features.length) {
            showToast('⚠️ Couldn\'t find that address');
            return;
        }
        const r = photonFeatureToResult(features[0]);
        center = r.center;
        address = [r.line1, r.line2].filter(Boolean).join(', ');
    } else if (!address) {
        // Reverse geocode for display
        const r = await reverseGeocode(center[0], center[1]);
        if (r) address = [r.line1, r.line2].filter(Boolean).join(', ');
    }

    const placeId = state.editingPlaceId || (slot === 'home' || slot === 'work' || slot === 'school' ? slot : ('place_' + Date.now()));
    const existing = getPlace(placeId);

    const place = {
        id: placeId,
        name: name,
        emoji: emoji,
        address: address,
        center: center,
        slot: (slot === 'home' || slot === 'work' || slot === 'school') ? slot : (existing?.slot || null),
        createdAt: existing?.createdAt || Date.now()
    };

    upsertPlace(place);
    showToast(`✅ Saved "${name}"`);
    addPlaceForm.classList.remove('show');
    resetAddPlaceForm();
});

// ══════════════════════════════════════
// UTILITIES
// ══════════════════════════════════════
function debounce(fn, delay) {
    let timer;
    return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
    };
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
}

function distanceMeters(lon1, lat1, lon2, lat2) {
    const R = 6371000;
    const φ1 = lat1 * Math.PI / 180;
    const φ2 = lat2 * Math.PI / 180;
    const Δφ = (lat2 - lat1) * Math.PI / 180;
    const Δλ = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(Δφ/2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) ** 2;
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx*dx + dy*dy;
    let t = len2 === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    return distanceMeters(px, py, x1 + t * dx, y1 + t * dy);
}

function distanceToRoute(lon, lat) {
    if (!state.routeData) return 0;
    const coords = state.routeData.geometry.coordinates;
    let min = Infinity;
    for (let i = 0; i < coords.length - 1; i++) {
        const d = pointToSegmentDistance(lon, lat, coords[i][0], coords[i][1], coords[i+1][0], coords[i+1][1]);
        if (d < min) min = d;
    }
    return min;
}

let toastEl = null, toastTimer = null;
function showToast(message) {
    if (!toastEl) {
        toastEl = document.createElement('div');
        toastEl.style.cssText = `position: fixed; bottom: calc(100px + var(--safe-bottom)); left: 50%; transform: translateX(-50%) translateY(20px); background: linear-gradient(135deg, #a855f7, #7c3aed); color: white; padding: 12px 24px; border-radius: 50px; font-size: 14px; font-weight: 500; z-index: 10000; opacity: 0; transition: all 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.5); pointer-events: none; max-width: 90vw; text-align: center;`;
        document.body.appendChild(toastEl);
    }
    toastEl.textContent = message;
    requestAnimationFrame(() => {
        toastEl.style.opacity = '1';
        toastEl.style.transform = 'translateX(-50%) translateY(0)';
    });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toastEl.style.opacity = '0';
        toastEl.style.transform = 'translateX(-50%) translateY(20px)';
    }, 3000);
}

// ══════════════════════════════════════
// GEOCODING
// ══════════════════════════════════════
async function photonSearch(query, limit = 8) {
    try {
        const url = `${CONFIG.GEOCODE_URL}?q=${encodeURIComponent(query)}&limit=${limit}&lang=en`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Search failed');
        const data = await res.json();
        return data.features || [];
    } catch { return []; }
}

async function reverseGeocode(lon, lat) {
    try {
        const url = `${CONFIG.REVERSE_URL}?lon=${lon}&lat=${lat}&lang=en`;
        const res = await fetch(url);
        if (!res.ok) return null;
        const data = await res.json();
        if (!data.features?.length) return null;
        return photonFeatureToResult(data.features[0]);
    } catch { return null; }
}

function photonFeatureToResult(feature) {
    const p = feature.properties || {};
    const coords = feature.geometry.coordinates;
    const street = p.street || p.name || '';
    const number = p.housenumber || '';
    const city = p.city || p.town || p.village || p.district || '';
    const stateName = p.state || '';
    const country = p.country || '';
    const postcode = p.postcode || '';
    const line1 = [number, street].filter(Boolean).join(' ').trim();
    const line2Parts = [city, stateName, postcode, country].filter(Boolean);
    const line2 = [...new Set(line2Parts)].join(', ');
    const isPOI = p.osm_value && !['house', 'residential', 'yes'].includes(p.osm_value);
    const title = isPOI && p.name ? p.name : (line1 || p.name || 'Unknown place');
    const subtitle = isPOI ? [line1, line2].filter(Boolean).join(', ') : line2;
    return { name: title, subtitle, line1, line2, center: coords, bbox: feature.bbox || null, properties: p };
}

// ══════════════════════════════════════
// ROUTING
// ══════════════════════════════════════
async function fetchRoute(start, end, profile = 'driving') {
    const coords = `${start.lngLat[0]},${start.lngLat[1]};${end.lngLat[0]},${end.lngLat[1]}`;
    try {
        const baseUrl = CONFIG.ROUTE_SERVERS[profile] || CONFIG.ROUTE_SERVERS.driving;
        const url = `${baseUrl}${coords}?overview=full&geometries=geojson&steps=true`;
        const res = await fetch(url);
        if (res.ok) {
            const data = await res.json();
            if (data.code === 'Ok' && data.routes?.length) return data.routes[0];
        }
    } catch {}
    const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=true`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Routing failed');
    const data = await res.json();
    if (data.code !== 'Ok' || !data.routes?.length) throw new Error('No route');
    return adjustDuration(data.routes[0], profile);
}

function adjustDuration(route, profile) {
    const speed = CONFIG.FALLBACK_SPEEDS[profile];
    if (!speed) return route;
    const adjusted = route.distance / speed;
    const factor = adjusted / route.duration;
    route.duration = adjusted;
    route.legs.forEach(leg => {
        leg.duration *= factor;
        leg.steps.forEach(step => { step.duration *= factor; });
    });
    return route;
}

// SEARCH UI — the header bar is now "Where to?"
// ══════════════════════════════════════
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
const searchClear = document.getElementById('search-clear');

const handleSearch = debounce(async (query) => {
    if (!query || query.length < 2) {
        searchResults.classList.remove('show');
        return;
    }

    // 1. Match saved places first
    const q = query.trim().toLowerCase();
    const savedMatches = state.savedPlaces.filter(p =>
        p.center && (p.name.toLowerCase().includes(q) || (p.slot && p.slot.includes(q)))
    );

    // 2. Then external search
    searchResults.innerHTML = '<div class="search-loading">🔍 Searching…</div>';
    searchResults.classList.add('show');

    const features = await photonSearch(query);

    const savedHtml = savedMatches.map((p, i) => `
        <div class="search-result-item is-saved" data-saved-id="${p.id}">
            <span class="search-result-icon">${p.emoji}</span>
            <div class="search-result-text">
                <div class="search-result-title">${escapeHtml(p.name)}<span class="search-result-tag">Saved</span></div>
                <div class="search-result-subtitle">${escapeHtml(p.address || '')}</div>
            </div>
        </div>
    `).join('');

    const photonHtml = features.map((f, i) => {
        const r = photonFeatureToResult(f);
        return `
            <div class="search-result-item" data-index="${i}">
                <span class="search-result-icon">📍</span>
                <div class="search-result-text">
                    <div class="search-result-title">${escapeHtml(r.name)}</div>
                    <div class="search-result-subtitle">${escapeHtml(r.subtitle)}</div>
                </div>
            </div>
        `;
    }).join('');

    if (!savedMatches.length && !features.length) {
        searchResults.innerHTML = '<div class="search-empty">No results found</div>';
        return;
    }

    searchResults.innerHTML = savedHtml + photonHtml;

    // Saved place clicks
    searchResults.querySelectorAll('.search-result-item.is-saved').forEach(item => {
        item.addEventListener('click', () => {
            const place = getPlace(item.dataset.savedId);
            if (!place || !place.center) return;
            searchResults.classList.remove('show');
            searchInput.value = place.name;
            searchInput.blur();
            state.endPoint = { lngLat: place.center, name: place.name };
            new maplibregl.Marker({ color: '#a855f7' }).setLngLat(place.center).addTo(map);
            map.flyTo({ center: place.center, zoom: 15, duration: 800 });
            startAutoRoute();
        });
    });

    // Photon clicks
    searchResults.querySelectorAll('.search-result-item:not(.is-saved)').forEach(item => {
        item.addEventListener('click', () => {
            const feature = features[parseInt(item.dataset.index)];
            const r = photonFeatureToResult(feature);
            searchResults.classList.remove('show');
            searchInput.value = r.name;
            searchInput.blur();
            window.__lastSearchCenter = r.center;
            new maplibregl.Marker({ color: '#a855f7' })
                .setLngLat(r.center)
                .setPopup(new maplibregl.Popup({ offset: 25 }).setHTML(buildSearchPopupHtml(r)))
                .addTo(map)
                .togglePopup();
            if (r.bbox) map.fitBounds([[r.bbox[0], r.bbox[1]], [r.bbox[2], r.bbox[3]]], { padding: 80, duration: 800 });
            else map.flyTo({ center: r.center, zoom: 15, duration: 800 });
            state.endPoint = { lngLat: r.center, name: r.name, address: r.subtitle };
            startAutoRoute();
        });
    });
}, 350);

function buildSearchPopupHtml(r) {
    return `
        <strong>${escapeHtml(r.name)}</strong><br>
        <small style="color:var(--text-muted)">${escapeHtml(r.subtitle)}</small>
        <div class="popup-actions">
            <button class="popup-btn" id="popup-save-btn">💾 Save</button>
        </div>
    `;
}

// ══════════════════════════════════════
// AUTO-ROUTE
// ══════════════════════════════════════
async function startAutoRoute() {
    if (!state.startPoint) {
        const ok = await tryAcquireLocation();
        if (!ok) {
            showToast('📍 Tap Allow to enable location');
            openDirectionsSheet();
            document.getElementById('route-start').focus();
            return;
        }
    }
    if (!state.startPoint || !state.endPoint) return;
    showToast('🧭 Starting navigation…');
    await calculateAndNavigate();
}

async function tryAcquireLocation() {
    if (!navigator.geolocation) return false;
    return new Promise(resolve => {
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                state.startPoint = { lngLat: [pos.coords.longitude, pos.coords.latitude], name: 'Your location' };
                resolve(true);
            },
            () => resolve(false),
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
        );
    });
}

async function calculateAndNavigate() {
    try {
        const route = await fetchRoute(state.startPoint, state.endPoint, state.routeProfile);
        state.routeData = route;
        drawRoute(route);
        renderRouteSummary(route);
        await beginNavigation();
    } catch (err) {
        console.error(err);
        showToast('❌ Could not calculate route');
    }
}

// ══════════════════════════════════════
// ROUTE DRAWING
// ══════════════════════════════════════
function clearRouteLayers() {
    if (map.getLayer('route-line-outline')) map.removeLayer('route-line-outline');
    if (map.getLayer('route-line')) map.removeLayer('route-line');
    if (map.getSource('route')) map.removeSource('route');
}

function drawRoute(route) {
    clearRouteLayers();
    map.addSource('route', { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: route.geometry } });
    map.addLayer({
        id: 'route-line-outline', type: 'line', source: 'route',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#0a0a14', 'line-width': 12, 'line-opacity': 0.7 }
    });
    map.addLayer({
        id: 'route-line', type: 'line', source: 'route',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#a855f7', 'line-width': 6 }
    });
    if (state.routeStartMarker) state.routeStartMarker.remove();
    if (state.routeEndMarker) state.routeEndMarker.remove();
    const coords = route.geometry.coordinates;
    state.routeStartMarker = new maplibregl.Marker({ color: '#10b981' }).setLngLat(coords[0]).addTo(map);
    state.routeEndMarker = new maplibregl.Marker({ color: '#ef4444' }).setLngLat(coords[coords.length - 1]).addTo(map);
    const bounds = coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
    map.fitBounds(bounds, { padding: { top: 120, bottom: 120, left: 40, right: 40 } });
}

function renderRouteSummary(route) {
    document.getElementById('route-time').textContent = formatDuration(route.duration);
    document.getElementById('route-distance').textContent = formatDistance(route.distance);
    const steps = route.legs[0].steps || [];
    const stepsList = document.getElementById('steps-list');
    stepsList.innerHTML = steps.map((step, i) => `
        <div class="step-item" data-step="${i}">
            <div class="step-icon">${stepIcon(step.maneuver.type)}</div>
            <div class="step-content">
                <div class="step-instruction">${escapeHtml(step.maneuver.instruction || step.name || 'Continue')}</div>
                <div class="step-distance">${formatDistance(step.distance)}</div>
            </div>
        </div>
    `).join('');
    stepsList.querySelectorAll('.step-item').forEach(item => {
        item.addEventListener('click', () => {
            const idx = parseInt(item.dataset.step);
            map.flyTo({ center: steps[idx].maneuver.location, zoom: 17, duration: 800 });
        });
    });
    document.getElementById('route-summary').style.display = 'block';
}

function stepIcon(type) {
    const icons = {
        'turn': '↪️', 'new name': '➡️', 'depart': '🚦', 'arrive': '🏁',
        'merge': '🔀', 'on ramp': '↗️', 'off ramp': '↘️', 'fork': '🍴',
        'end of road': '⚠️', 'continue': '⬆️', 'roundabout': '🔄',
        'rotary': '🔄', 'roundabout turn': '🔄', 'notification': '🔔'
    };
    return icons[type] || '➡️';
}

// ══════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════
async function beginNavigation() {
    if (!state.routeData) return;
    state.navigationActive = true;
    nav.currentStepIndex = 0;
    nav.offRouteCount = 0;
    nav.lastSpokenStepIndex = -1;
    nav.lastSpokenDistance = -1;
    nav.followUser = true;

    document.body.classList.add('navigating');

    await requestWakeLock();
    await requestCompassPermission();
    startCompass();

    updateNavUI();

    if (nav.watchId == null) {
        nav.watchId = navigator.geolocation.watchPosition(
            onPositionUpdate,
            (err) => console.error('GPS error:', err),
            { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
        );
    }

    // Live-updating distance ticker (fixes frozen "290 m to next turn")
    if (nav.updateInterval) clearInterval(nav.updateInterval);
    nav.updateInterval = setInterval(updateLiveDistance, 1500);

    if ('vibrate' in navigator) navigator.vibrate([30, 30, 30]);
}

function stopNavigation() {
    state.navigationActive = false;
    document.body.classList.remove('navigating');

    if (nav.watchId != null) {
        navigator.geolocation.clearWatch(nav.watchId);
        nav.watchId = null;
    }
    if (nav.updateInterval) {
        clearInterval(nav.updateInterval);
        nav.updateInterval = null;
    }
    releaseWakeLock();
    if (window.speechSynthesis) speechSynthesis.cancel();
    clearRouteLayers();
    if (state.routeStartMarker) { state.routeStartMarker.remove(); state.routeStartMarker = null; }
    if (state.routeEndMarker) { state.routeEndMarker.remove(); state.routeEndMarker = null; }
    state.routeData = null;
    state.endPoint = null;
    document.getElementById('route-summary').style.display = 'none';
    document.getElementById('route-end').value = '';
}

// Recompute distance to next maneuver every 1.5s
function updateLiveDistance() {
    if (!state.navigationActive || !state.routeData || !nav.lastPosition) return;
    const steps = state.routeData.legs[0].steps;
    if (nav.currentStepIndex >= steps.length) return;
    const target = steps[nav.currentStepIndex].maneuver.location;
    const dist = distanceMeters(nav.lastPosition.lon, nav.lastPosition.lat, target[0], target[1]);
    document.getElementById('nav-sub').textContent = `${formatDistance(dist)} to next turn`;
}

function updateNavUI() {
    if (!state.routeData) return;
    const steps = state.routeData.legs[0].steps;

    if (nav.currentStepIndex >= steps.length) {
        document.getElementById('nav-arrow').textContent = '🏁';
        document.getElementById('nav-main').textContent = 'You have arrived';
        document.getElementById('nav-sub').textContent = 'Destination reached';
        return;
    }

    const step = steps[nav.currentStepIndex];
    document.getElementById('nav-arrow').textContent = stepIcon(step.maneuver.type);
    document.getElementById('nav-main').textContent = step.maneuver.instruction || step.name || 'Continue';
    document.querySelectorAll('.step-item').forEach((el, i) => {
        el.classList.toggle('active', i === nav.currentStepIndex);
    });

    let remainingTime = 0, remainingDist = 0;
    for (let i = nav.currentStepIndex; i < steps.length; i++) {
        remainingTime += steps[i].duration;
        remainingDist += steps[i].distance;
    }
    if (nav.lastPosition) {
        const target = steps[nav.currentStepIndex].maneuver.location;
        const distToNext = distanceMeters(nav.lastPosition.lon, nav.lastPosition.lat, target[0], target[1]);
        document.getElementById('nav-sub').textContent = `${formatDistance(distToNext)} to next turn`;
    } else {
        document.getElementById('nav-sub').textContent = `${formatDistance(remainingDist)} remaining`;
    }
    const etaDate = new Date(Date.now() + remainingTime * 1000);
    document.getElementById('nav-eta').textContent = formatClock(etaDate);
}

function onPositionUpdate(pos) {
    const { longitude: lon, latitude: lat, heading } = pos.coords;
    nav.lastPosition = { lon, lat, heading };

    if (!state.userMarker) {
        const el = document.createElement('div');
        el.className = 'user-marker';
        el.innerHTML = `
            <div class="user-marker-arrow">
                <svg width="40" height="40" viewBox="0 0 40 40">
                    <circle cx="20" cy="20" r="14" fill="rgba(0,170,255,0.15)"/>
                    <circle cx="20" cy="20" r="9" fill="#00aaff" stroke="#fff" stroke-width="2"/>
                    <polygon points="20,3 26,16 20,13 14,16" fill="#00aaff" stroke="#fff" stroke-width="1.5"/>
                </svg>
            </div>`;
        state.userMarker = new maplibregl.Marker({ element: el }).setLngLat([lon, lat]).addTo(map);
    } else {
        state.userMarker.setLngLat([lon, lat]);
    }

    if (nav.followUser) map.easeTo({ center: [lon, lat], duration: 500 });

    if (state.navigationActive && state.routeData) {
        const steps = state.routeData.legs[0].steps;
        if (nav.currentStepIndex < steps.length) {
            const step = steps[nav.currentStepIndex];
            const target = step.maneuver.location;
            const dist = distanceMeters(lon, lat, target[0], target[1]);

            // Voice: announce at 500m, 200m, 50m for each step
            const buckets = [500, 200, 50];
            for (const b of buckets) {
                // Use ft thresholds in imperial mode
                const threshold = state.units === 'imperial' ? Math.round(b * 3.28) : b;
                const realThreshold = state.units === 'imperial' ? b * 0.3048 * 3.28 : b;
                // simpler: just use meters
                const m = b;
                if (nav.lastAnnouncedAt < m && dist <= m && dist > m * 0.6) {
                    nav.lastAnnouncedAt = m;
                    const instruction = step.maneuver.instruction || step.name || 'continue';
                    speak(`In ${formatDistance(m)}, ${instruction}`);
                    break;
                }
            }

            if (dist < 25) {
                nav.currentStepIndex++;
                nav.lastSpokenStepIndex = -1;
                nav.lastAnnouncedAt = -1;
                if ('vibrate' in navigator) navigator.vibrate(30);
                updateNavUI();
            }
        } else {
            if (nav.lastSpokenStepIndex !== steps.length) {
                speak('You have arrived at your destination.');
                nav.lastSpokenStepIndex = steps.length;
                updateNavUI();
                if ('vibrate' in navigator) navigator.vibrate([100, 50, 100, 50, 100]);
            }
        }

        const offRoute = distanceToRoute(lon, lat);
        if (offRoute > 50) {
            nav.offRouteCount++;
            if (nav.offRouteCount >= 3) {
                nav.offRouteCount = 0;
                showToast('🔄 Rerouting…');
                speak('Rerouting');
                rerouteFrom(lon, lat);
            }
        } else {
            nav.offRouteCount = 0;
        }
    }
}

async function rerouteFrom(lon, lat) {
    if (!state.endPoint) return;
    try {
        const route = await fetchRoute({ lngLat: [lon, lat] }, state.endPoint, state.routeProfile);
        state.routeData = route;
        drawRoute(route);
        renderRouteSummary(route);
        nav.currentStepIndex = 0;
        nav.lastSpokenStepIndex = -1;
        nav.lastAnnouncedAt = -1;
        updateNavUI();
    } catch {}
}

// ══════════════════════════════════════
// WAKE LOCK / VOICE / COMPASS
// ══════════════════════════════════════
async function requestWakeLock() {
    try {
        if ('wakeLock' in navigator) nav.wakeLock = await navigator.wakeLock.request('screen');
    } catch {}
}

function releaseWakeLock() {
    if (nav.wakeLock) { nav.wakeLock.release(); nav.wakeLock = null; }
}

function speak(text) {
    if (!nav.voiceEnabled || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.0;
    u.pitch = 1.0;
    u.volume = 1.0;
    speechSynthesis.speak(u);
}

async function requestCompassPermission() {
    if (typeof DeviceOrientationEvent === 'undefined') return false;
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
            const perm = await DeviceOrientationEvent.requestPermission();
            return perm === 'granted';
        } catch { return false; }
    }
    return true;
}

function startCompass() {
    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    window.addEventListener('deviceorientation', handleOrientation, true);
}

function handleOrientation(e) {
    let heading = null;
    if (e.webkitCompassHeading != null) heading = e.webkitCompassHeading;
    else if (e.alpha != null) heading = 360 - e.alpha;
    if (heading != null) {
        state.userHeading = heading;
        if (nav.followUser && state.navigationActive) {
            map.easeTo({ bearing: heading, duration: 200 });
        }
    }
}

// Route autocomplete — recognizes "Home", "Work", etc.
function setupRouteAutocomplete(inputId, suggestionsId, key) {
    const input = document.getElementById(inputId);
    const suggestions = document.getElementById(suggestionsId);

    const handler = debounce(async (query) => {
        if (!query || query.length < 2) {
            suggestions.classList.remove('show');
            return;
        }

        const q = query.trim().toLowerCase();
        const savedMatches = state.savedPlaces.filter(p =>
            p.center && (p.name.toLowerCase().includes(q) || (p.slot && p.slot.includes(q)))
        );

        const features = await photonSearch(query, 5);

        const savedHtml = savedMatches.map(p => `
            <div class="route-suggestion-item" data-saved-id="${p.id}">
                <strong>${p.emoji} ${escapeHtml(p.name)}</strong>
                <small>${escapeHtml(p.address || '')}</small>
            </div>
        `).join('');

        const photonHtml = features.map((f, i) => {
            const r = photonFeatureToResult(f);
            return `<div class="route-suggestion-item" data-index="${i}">
                <strong>${escapeHtml(r.name)}</strong>
                <small>${escapeHtml(r.subtitle)}</small>
            </div>`;
        }).join('');

        if (!savedMatches.length && !features.length) {
            suggestions.classList.remove('show');
            return;
        }

        suggestions.innerHTML = savedHtml + photonHtml;
        suggestions.classList.add('show');

        suggestions.querySelectorAll('.route-suggestion-item[data-saved-id]').forEach(item => {
            item.addEventListener('click', () => {
                const place = getPlace(item.dataset.savedId);
                if (!place || !place.center) return;
                input.value = place.name;
                state[key] = { lngLat: place.center, name: place.name };
                suggestions.classList.remove('show');
                input.blur();
                if (state.startPoint && state.endPoint) calculateAndNavigate();
                else if (key === 'endPoint') startAutoRoute();
            });
        });

        suggestions.querySelectorAll('.route-suggestion-item[data-index]').forEach(item => {
            item.addEventListener('click', () => {
                const f = features[parseInt(item.dataset.index)];
                const r = photonFeatureToResult(f);
                input.value = r.name;
                state[key] = { lngLat: r.center, name: r.name };
                suggestions.classList.remove('show');
                input.blur();
                if (state.startPoint && state.endPoint) calculateAndNavigate();
                else if (key === 'endPoint') startAutoRoute();
            });
        });
    }, 250);

    input.addEventListener('input', (e) => handler(e.target.value));
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') suggestions.classList.remove('show');
        if (e.key === 'Enter') {
            e.preventDefault();
            const first = suggestions.querySelector('.route-suggestion-item');
            if (first) first.click();
        }
    });

    document.addEventListener('click', (e) => {
        if (!e.target.closest(`#${inputId}`) && !e.target.closest(`#${suggestionsId}`)) {
            suggestions.classList.remove('show');
        }
    });
}

// IMPORTANT: iOS requires at least one user gesture to enable speechSynthesis.
// Any tap anywhere on the page calls a silent speak() to unlock it.
document.addEventListener('touchstart', function unlockSpeech() {
    if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance('');
        u.volume = 0;
        speechSynthesis.speak(u);
    }
    document.removeEventListener('touchstart', unlockSpeech);
}, { once: true });

// ══════════════════════════════════════
// MAP READY
// ══════════════════════════════════════
map.on('load', () => {
    console.log('🗺️ Wizard Maps ready');
    loadSettings();
    loadSavedPlaces();
    renderQuickPlaces();
    syncUnitsButtons();
    voiceToggle.classList.toggle('active', nav.voiceEnabled);
    document.getElementById('nav-voice-btn').classList.toggle('muted', !nav.voiceEnabled);
    document.getElementById('nav-voice-btn').textContent = nav.voiceEnabled ? '🔊' : '🔇';

    // Apply saved style
    if (state.style !== 'liberty') {
        styleGrid.querySelectorAll('.style-option').forEach(o => {
            o.classList.toggle('active', o.dataset.style === state.style);
        });
        map.setStyle(CONFIG.STYLES[state.style]);
    }

    // Warm-up location if already granted
    if (navigator.permissions) {
        navigator.permissions.query({ name: 'geolocation' }).then(r => {
            if (r.state === 'granted') {
                tryAcquireLocation().then(ok => {
                    if (ok) {
                        locateBanner.classList.add('hidden');
                        map.flyTo({ center: state.startPoint.lngLat, zoom: 13, duration: 1200 });
                    }
                });
            }
        });
    }
});

map.on('error', (e) => console.warn('Map error:', e.error));
map.on('click', (e) => { window.__lastSearchCenter = [e.lngLat.lng, e.lngLat.lat]; });
</script>
</body>
</html>
