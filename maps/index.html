<style>
/* ═══════════════ Wizard Maps v2 — design system ═══════════════
   One stylesheet, three form factors:
   • phone   — bottom sheets, thumb-reach controls
   • laptop  — left rail (search + card + nav), map fills the rest
   • car     — same as laptop but everything scaled up (html.car / settings)
   Everything is sized in rem, so --scale does the whole job. */
:root {
  --scale: 1;
  --st: env(safe-area-inset-top, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
  --display: 'Cormorant Garamond', Georgia, serif;
  --ui: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
  --rail: 27rem;
  /* dark (default) */
  --bg: #080612; --bg2: #0f0c20; --bg3: #181435; --bg4: #221c47;
  --fg: #ece9fa; --fg-dim: rgba(226,222,245,.64); --fg-faint: rgba(226,222,245,.38);
  --accent: #c9a84c; --accent-hi: #e8c97a; --on-accent: #080612;
  --accent-soft: rgba(201,168,76,.16); --violet: #7c5cbf; --violet-soft: rgba(124,92,191,.26);
  --border: rgba(201,168,76,.2); --border-strong: rgba(201,168,76,.5);
  --glass: rgba(15,12,32,.93); --scrim: rgba(4,3,10,.62);
  --danger: #ef6a62; --ok: #4fcf7f; --warn: #f0a34a;
  --shadow: 0 .6rem 1.8rem rgba(0,0,0,.5);
  color-scheme: dark;
}
html[data-theme="light"] {
  --bg: #f7f5ef; --bg2: #ffffff; --bg3: #efebf7; --bg4: #e3ddf0;
  --fg: #1b1630; --fg-dim: rgba(27,22,48,.68); --fg-faint: rgba(27,22,48,.42);
  --accent: #8d6a14; --accent-hi: #6f5110; --on-accent: #fff;
  --accent-soft: rgba(141,106,20,.13); --violet: #6a49b0; --violet-soft: rgba(106,73,176,.16);
  --border: rgba(60,44,110,.16); --border-strong: rgba(110,80,20,.5);
  --glass: rgba(255,255,255,.94); --scrim: rgba(20,14,40,.4);
  --danger: #c93a32; --ok: #1f9d55; --warn: #b8690f;
  --shadow: 0 .6rem 1.8rem rgba(40,30,80,.22);
  color-scheme: light;
}
html { font-size: calc(16px * var(--scale)); }
html.car { --scale: 1.3; }
html.large { --scale: 1.15; }
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; overflow: hidden; overscroll-behavior: none; position: fixed; }
body { font-family: var(--ui); background: var(--bg); color: var(--fg); font-size: 1rem; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; touch-action: manipulation; }
svg { display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: .125rem solid var(--accent-hi); outline-offset: .125rem; }
a { color: var(--accent-hi); }
#map { position: fixed; inset: 0; background: var(--bg); }
.maplibregl-ctrl-attrib { font-size: .6875rem !important; }
.ico { width: 1.375rem; height: 1.375rem; flex-shrink: 0; display: inline-grid; place-items: center; }
.ico svg { width: 100%; height: 100%; }

/* ───────── search ───────── */
.top { position: fixed; z-index: 100; top: calc(.75rem + var(--st)); left: calc(.75rem + var(--sl)); right: calc(.75rem + var(--sr)); max-width: 30rem; }
.search-bar { display: flex; align-items: center; height: 3.5rem; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--border); border-radius: 1.75rem; box-shadow: var(--shadow); transition: border-color .2s, box-shadow .2s; }
.search-bar:focus-within { border-color: var(--border-strong); box-shadow: var(--shadow), 0 0 0 .25rem var(--accent-soft); }
.search-mark { width: 3.25rem; height: 3.5rem; display: grid; place-items: center; color: var(--accent); flex-shrink: 0; }
.search-mark .ico { width: 1.25rem; height: 1.25rem; }
.search-bar input { flex: 1; min-width: 0; height: 100%; background: none; border: none; outline: none; font-size: 1rem; }
.search-bar input::placeholder { color: var(--fg-faint); }
.bar-btn { width: 2.75rem; height: 2.75rem; margin-right: .25rem; border-radius: 50%; display: grid; place-items: center; color: var(--fg-dim); flex-shrink: 0; }
.bar-btn:hover { background: var(--violet-soft); color: var(--accent-hi); }
.bar-btn:active { background: var(--violet-soft); }
.bar-sep { width: 1px; height: 1.5rem; background: var(--border); margin-right: .125rem; flex-shrink: 0; }
.kbd { font-size: .6875rem; border: 1px solid var(--border); border-radius: .375rem; padding: .0625rem .375rem; color: var(--fg-faint); margin-right: .5rem; display: none; }
@media (hover:hover) and (pointer:fine) { .kbd { display: block; } .search-bar input:focus ~ .kbd, .search-bar input:not(:placeholder-shown) ~ .kbd { display: none; } }

.ac-box { position: absolute; top: calc(100% + .5rem); left: 0; right: 0; background: var(--bg2); border: 1px solid var(--border-strong); border-radius: 1.125rem; max-height: 52dvh; overflow-y: auto; display: none; box-shadow: var(--shadow); z-index: 60; -webkit-overflow-scrolling: touch; }
.ac-box.show { display: block; }
.ac-item { display: flex; gap: .75rem; align-items: center; padding: .625rem 1rem; cursor: pointer; border-bottom: 1px solid var(--border); min-height: 3.5rem; }
.ac-item:last-child { border-bottom: none; }
.ac-item:hover, .ac-item.sel { background: var(--violet-soft); }
.ac-icon { width: 2.125rem; height: 2.125rem; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; background: var(--bg3); border: 1px solid var(--border); color: var(--accent); font-size: 1rem; }
.ac-icon .ico { width: 1rem; height: 1rem; }
.ac-text { min-width: 0; flex: 1; }
.ac-title { font-size: .9375rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ac-sub { font-size: .8125rem; color: var(--fg-dim); margin-top: .0625rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ac-tag { font-size: .6875rem; color: var(--accent); border: 1px solid var(--border-strong); border-radius: 1rem; padding: .0625rem .5rem; margin-left: .5rem; font-weight: 600; }
.ac-note { padding: 1.25rem 1rem; text-align: center; color: var(--fg-dim); font-size: .875rem; }

/* ───────── chips ───────── */
.chips { position: fixed; z-index: 90; top: calc(4.75rem + var(--st)); left: 0; right: 0; display: flex; gap: .5rem; padding: 0 calc(.75rem + var(--sr)) 0 calc(.75rem + var(--sl)); overflow-x: auto; scrollbar-width: none; pointer-events: none;
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 2rem), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 2rem), transparent); }
.chips::-webkit-scrollbar { display: none; }
.chip { pointer-events: auto; flex-shrink: 0; height: 2.5rem; padding: 0 1rem; display: flex; align-items: center; gap: .5rem; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--border); border-radius: 1.25rem; font-size: .875rem; font-weight: 500; white-space: nowrap; box-shadow: 0 .25rem .75rem rgba(0,0,0,.18); }
.chip:hover { border-color: var(--border-strong); }
.chip:active { background: var(--violet-soft); }
.chip.ghost { color: var(--accent-hi); border-style: dashed; border-color: var(--border-strong); }
.chip.on { border-color: var(--accent); color: var(--accent-hi); background: var(--accent-soft); }

/* ───────── map buttons ───────── */
.fabs { position: fixed; z-index: 80; right: calc(.75rem + var(--sr)); bottom: calc(var(--card-h, 0px) + var(--sb) + 1.5rem); display: flex; flex-direction: column; gap: .625rem; transition: bottom .25s var(--ease); }
.fab { width: 3.125rem; height: 3.125rem; display: grid; place-items: center; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--border); border-radius: 50%; color: var(--accent-hi); box-shadow: var(--shadow); }
.fab:hover { border-color: var(--border-strong); }
.fab:active { background: var(--violet-soft); }
.fab.on { border-color: var(--accent); background: var(--accent-soft); }
.fab.attn { border-color: var(--border-strong); animation: attn 2.4s ease-in-out infinite; }
@keyframes attn { 0%,100% { box-shadow: var(--shadow), 0 0 0 0 var(--accent-soft); } 50% { box-shadow: var(--shadow), 0 0 0 .625rem transparent; } }
.fab.desk { display: none; }
#compass-rose { width: 1.75rem; height: 1.75rem; transition: transform .1s linear; }

/* ───────── place card ───────── */
.card { position: fixed; z-index: 120; left: calc(.625rem + var(--sl)); right: calc(.625rem + var(--sr)); bottom: calc(.625rem + var(--sb)); background: var(--glass); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid var(--border-strong); border-radius: 1.625rem; box-shadow: var(--shadow); padding: .25rem 1.125rem 1.125rem; max-height: 80dvh; display: none; flex-direction: column; }
.card.show { display: flex; animation: rise .28s var(--ease); }
@keyframes rise { from { transform: translateY(1.5rem); opacity: 0; } to { transform: none; opacity: 1; } }
.grip { width: 2.5rem; height: .25rem; border-radius: .125rem; background: var(--border-strong); margin: .5rem auto .625rem; flex-shrink: 0; cursor: pointer; padding: .5rem 0; background-clip: content-box; box-sizing: content-box; height: .25rem; }
.card-head { display: flex; gap: .75rem; align-items: flex-start; }
.card-head > div:first-child { flex: 1; min-width: 0; }
.card-title { font-family: var(--display); font-size: 1.75rem; font-weight: 700; color: var(--accent-hi); line-height: 1.1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card-sub { font-size: .8125rem; color: var(--fg-dim); margin-top: .25rem; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card-extra { font-size: .8125rem; color: var(--accent-hi); margin-top: .25rem; display: flex; gap: .625rem; flex-wrap: wrap; }
.x-btn { width: 2.5rem; height: 2.5rem; flex-shrink: 0; display: grid; place-items: center; background: var(--bg3); border: 1px solid var(--border); border-radius: 50%; color: var(--fg-dim); }
.x-btn:hover { color: var(--accent-hi); border-color: var(--border-strong); }
.x-btn:active { background: var(--violet-soft); }
.x-btn .ico { width: 1.125rem; height: 1.125rem; }
.card.min .from-row, .card.min #stops-row, .card.min #stop-add-row, .card.min #add-stop-btn, .card.min .modes, .card.min .steps, .card.min .alts { display: none !important; }

.from-row { position: relative; margin-top: .875rem; }
.from-field { display: flex; align-items: center; gap: .625rem; background: var(--bg); border: 1px solid var(--border); border-radius: .875rem; padding: 0 .875rem; height: 2.875rem; }
.from-field:focus-within { border-color: var(--border-strong); }
.from-dot { width: .625rem; height: .625rem; border-radius: 50%; border: .125rem solid var(--accent); flex-shrink: 0; }
.from-dot.v { border-color: var(--violet); }
.from-field input { flex: 1; min-width: 0; background: none; border: none; outline: none; font-size: .9375rem; }
.from-field input::placeholder { color: var(--fg-dim); }
.from-row .ac-box { top: auto; bottom: calc(100% + .375rem); max-height: 38dvh; }
.stop-item { display: flex; align-items: center; gap: .375rem; background: var(--bg); border: 1px solid var(--border); border-radius: .875rem; padding: 0 .5rem 0 .875rem; height: 2.75rem; margin-top: .5rem; }
.stop-item .stop-name { flex: 1; min-width: 0; font-size: .875rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stop-btn { width: 2.125rem; height: 2.125rem; color: var(--fg-dim); border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
.stop-btn:hover { color: var(--accent-hi); }
.stop-btn:active { background: var(--violet-soft); }
.stop-btn[disabled] { opacity: .3; pointer-events: none; }
.add-btn { width: 100%; height: 2.75rem; border: 1px dashed var(--border-strong); border-radius: .875rem; color: var(--accent-hi); font-size: .875rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: .5rem; margin-top: .5rem; }
.add-btn:hover { background: var(--accent-soft); }
.add-btn .ico { width: 1.125rem; height: 1.125rem; }

.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin-top: .75rem; }
.mode { display: flex; flex-direction: column; align-items: center; gap: .25rem; padding: .625rem .25rem; background: var(--bg); border: 1px solid var(--border); border-radius: .875rem; color: var(--fg-dim); font-size: .8125rem; font-weight: 500; }
.mode:hover { border-color: var(--border-strong); }
.mode .t { font-size: .8125rem; color: var(--fg); font-weight: 600; min-height: 1.0625rem; }
.mode.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-hi); }
.mode.active .t { color: var(--accent-hi); }

.summary { display: flex; align-items: baseline; flex-wrap: wrap; gap: .25rem .75rem; margin-top: 1rem; min-height: 2.5rem; }
.summary-time { font-family: var(--display); font-size: 2.375rem; font-weight: 700; color: var(--accent-hi); line-height: 1; }
.summary-meta { font-size: .875rem; color: var(--fg-dim); }
.summary-msg { font-size: .875rem; color: var(--fg-dim); line-height: 1.4; align-self: center; }
.summary-msg.err { color: var(--danger); }
.summary-row { flex-basis: 100%; font-size: .8125rem; color: var(--fg-dim); display: flex; gap: .625rem; flex-wrap: wrap; align-items: center; }
.summary-row b { font-weight: 700; }
.tag-engine { font-size: .6875rem; border: 1px solid var(--border-strong); color: var(--accent-hi); border-radius: 1rem; padding: .0625rem .5rem; font-weight: 600; }
#summary-share-btn { width: 2.125rem; height: 2.125rem; border-radius: 50%; border: 1px solid var(--border); background: var(--bg3); color: var(--fg-dim); display: grid; place-items: center; margin-left: auto; flex-shrink: 0; align-self: center; }
#summary-share-btn:hover { color: var(--accent-hi); }
.alts { display: flex; gap: .5rem; margin-top: .75rem; overflow-x: auto; scrollbar-width: none; padding-bottom: .125rem; }
.alt { flex-shrink: 0; border: 1px solid var(--border); background: var(--bg); border-radius: .875rem; padding: .5rem .75rem; text-align: left; font-size: .8125rem; line-height: 1.25; }
.alt b { display: block; font-size: .9375rem; }
.alt span { color: var(--fg-dim); display: block; max-width: 9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alt.on { border-color: var(--accent); background: var(--accent-soft); }
.alt.on b { color: var(--accent-hi); }

.actions { display: flex; gap: .625rem; margin-top: .875rem; }
.btn { height: 3.25rem; padding: 0 1.25rem; border-radius: 1.625rem; border: 1px solid var(--border-strong); background: var(--bg3); font-size: .9375rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: .5rem; }
.btn:hover { background: var(--bg4); }
.btn:active { transform: scale(.97); }
.btn .ico { width: 1.125rem; height: 1.125rem; }
.btn.primary { flex: 1; background: linear-gradient(135deg, var(--accent-hi), var(--accent)); color: var(--on-accent); border-color: transparent; font-weight: 700; font-size: 1.0625rem; }
html[data-theme="light"] .btn.primary { background: linear-gradient(135deg, #a67c1c, #7d5a0e); }
.btn.primary:disabled { opacity: .4; pointer-events: none; }
.btn.icon-only { width: 3.25rem; padding: 0; flex-shrink: 0; }
.btn.on { border-color: var(--accent); color: var(--accent-hi); background: var(--accent-soft); }
.btn.danger { color: var(--danger); border-color: var(--danger); }

.steps { margin-top: .75rem; overflow-y: auto; max-height: 0; opacity: 0; transition: max-height .3s ease, opacity .2s; }
.steps.open { max-height: 22dvh; opacity: 1; }
.step { display: flex; gap: .75rem; align-items: center; padding: .625rem .25rem; border-top: 1px solid var(--border); cursor: pointer; }
.step:hover { background: var(--violet-soft); }
.step-ico { width: 2.125rem; height: 2.125rem; flex-shrink: 0; border-radius: 50%; background: var(--bg3); border: 1px solid var(--border); color: var(--accent-hi); display: grid; place-items: center; padding: .375rem; }
.step-ico svg { width: 100%; height: 100%; }
.step-t { font-size: .875rem; line-height: 1.35; }
.step-d { font-size: .75rem; color: var(--fg-dim); margin-top: .125rem; }

/* ───────── sheets ───────── */
.backdrop { position: fixed; inset: 0; background: var(--scrim); z-index: 180; opacity: 0; pointer-events: none; transition: opacity .25s; }
.backdrop.show { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 200; background: var(--bg2); border-top: 1px solid var(--border-strong); border-radius: 1.75rem 1.75rem 0 0; max-height: 90dvh; display: flex; flex-direction: column; transform: translateY(105%); transition: transform .32s var(--ease); box-shadow: 0 -.75rem 2.5rem rgba(0,0,0,.5); padding-bottom: var(--sb); visibility: hidden; }
.sheet.show { transform: none; visibility: visible; }
.sheet .grip { margin-top: .625rem; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; padding: .375rem 1.25rem .875rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sheet-title { font-family: var(--display); font-size: 1.75rem; font-weight: 700; color: var(--accent-hi); }
.sheet-body { padding: 1.125rem 1.25rem 1.5rem; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.label { display: block; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-dim); font-weight: 600; margin: 1.5rem 0 .5rem; }
.label:first-child { margin-top: 0; }
.group { background: var(--bg); border: 1px solid var(--border); border-radius: 1rem; padding: 0 1rem; }
.seg { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: .875rem; padding: .1875rem; gap: .1875rem; }
.seg button { flex: 1; height: 2.5rem; border-radius: .6875rem; font-size: .875rem; font-weight: 500; color: var(--fg-dim); }
.seg button.active { background: var(--accent-soft); color: var(--accent-hi); font-weight: 600; box-shadow: inset 0 0 0 1px var(--border-strong); }
.styles { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.25rem, 1fr)); gap: .625rem; }
.style-opt { text-align: center; font-size: .75rem; color: var(--fg-dim); border: 1px solid var(--border); border-radius: .875rem; padding: .5rem .375rem; background: var(--bg); cursor: pointer; }
.style-opt .swatch { height: 2.75rem; border-radius: .5rem; margin-bottom: .375rem; border: 1px solid var(--border); }
.style-opt.active { border-color: var(--accent); color: var(--accent-hi); background: var(--accent-soft); font-weight: 600; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 3.25rem; padding: .375rem 0; border-bottom: 1px solid var(--border); font-size: .9375rem; }
.toggle-row:last-child { border-bottom: none; }
.toggle-row small { display: block; font-size: .75rem; color: var(--fg-dim); margin-top: .125rem; line-height: 1.3; }
.toggle { width: 3.125rem; height: 1.875rem; border-radius: 1rem; background: var(--bg4); border: 1px solid var(--border); position: relative; flex-shrink: 0; transition: background .2s, border-color .2s; }

<div id="map" aria-label="Map"></div>

async function cloudApi(path, { method = 'GET', json, ms = 12000 } = {}) {

}

// work out what changed locally since the last successful sync (edits, deletions, new trips)
function collectChanges(first) {
  const out = { places: [], routes: [], trips: [] }, K = cloud.meta.known, marks = [], now = Date.now();
  const scan = (kind, arr, skip) => {
    const ids = new Set();
    arr.forEach(it => {
      if (!it || !it.id || (skip && skip(it))) return;
      ids.add(it.id); const h = hashOf(it);
      if (K[kind][it.id] !== h) { it.updatedAt = now; out[kind].push(it); marks.push([kind, it.id, h]); }
    });
    Object.keys(K[kind]).forEach(id => { if (!ids.has(id)) { out[kind].push({ id, deleted: true, updatedAt: now }); marks.push([kind, id, null]); } });
  };
  scan('places', state.savedPlaces, p => !p.center && !K.places[p.id]);   // empty Home/Work/School placeholders stay local
  scan('routes', state.savedRoutes);
  scan('trips', state.trips);
  let prefs = null; const ph = stable(prefsData());
  if (!first && ph !== cloud.meta.prefsHash) { cloud.meta.prefsAt = now; prefs = { updatedAt: now, data: prefsData() }; }
  return { out, marks, prefs, ph };
}

function applyPulled(res) {
  const K = cloud.meta.known; let pc = false, rc = false, tc = false;
  const PLACEHOLDER = { home: ['Home', '🏠'], work: ['Work', '💼'], school: ['School', '📚'] };
  (res.places || []).forEach(p => {
    const i = state.savedPlaces.findIndex(x => x.id === p.id), cur = state.savedPlaces[i];
    if (cur && (cur.updatedAt || 0) >= p.updatedAt) return;
    if (p.deleted) {
      if (cur) { if (PLACEHOLDER[cur.slot]) state.savedPlaces[i] = { id: cur.id, name: PLACEHOLDER[cur.slot][0], emoji: PLACEHOLDER[cur.slot][1], address: '', center: null, slot: cur.slot, createdAt: cur.createdAt || Date.now() }; else state.savedPlaces.splice(i, 1); pc = true; }

    if (!it.via) delete it.via;
    if (i >= 0) state.savedPlaces[i] = it; else state.savedPlaces.push(it);
    K.places[p.id] = hashOf(it); pc = true;
  });
  (res.routes || []).forEach(p => {
    const i = state.savedRoutes.findIndex(x => x.id === p.id), cur = state.savedRoutes[i];
    if (cur && (cur.updatedAt || 0) >= p.updatedAt) return;
    if (p.deleted) { if (cur) { state.savedRoutes.splice(i, 1); rc = true; } delete K.routes[p.id]; return; }
    const it = Object.assign({}, p); delete it.deleted;
    if (i >= 0) state.savedRoutes[i] = it; else state.savedRoutes.push(it);
    K.routes[p.id] = hashOf(it); rc = true;
  });
  (res.trips || []).forEach(p => {
    const i = state.trips.findIndex(x => x.id === p.id), cur = state.trips[i];
    if (cur && (cur.updatedAt || 0) >= p.updatedAt) return;
    if (p.deleted) { if (cur) { state.trips.splice(i, 1); tc = true; } delete K.trips[p.id]; return; }
    const it = Object.assign({}, p); delete it.deleted;
    if (i >= 0) state.trips[i] = it; else state.trips.push(it);
    K.trips[p.id] = hashOf(it); tc = true;

  if (rc) store.set(ROUTES_LS, JSON.stringify(state.savedRoutes));
  if (tc) store.set(TRIPS_LS, JSON.stringify(state.trips.slice(0, 300)));

    } finally { cloud.applying = false; }
    cloud.meta.prefsAt = pr.updatedAt; cloud.meta.prefsHash = stable(prefsData());

}

async function cloudSync(reason) {
  if (!cloud.authed || cloud.meta.paused) return;
  if (cloud.busy) { cloud.again = true; return; }
  cloud.busy = true; cloud.again = false; clearTimeout(cloud.timer);
  const first = cloud.meta.since === 0 && !cloud.meta.prefsHash;        // brand-new device: look at the cloud's settings before pushing ours
  if (reason !== 'quiet') setCloudStatus('syncing');
  try {
    const { out, marks, prefs, ph } = collectChanges(first);
    store.set(LS.saved, JSON.stringify(state.savedPlaces)); store.set(ROUTES_LS, JSON.stringify(state.savedRoutes)); store.set(TRIPS_LS, JSON.stringify(state.trips.slice(0, 300)));
    const body = { since: cloud.meta.since }; ['places', 'routes', 'trips'].forEach(k => { if (out[k].length) body[k] = out[k]; }); if (prefs) body.prefs = prefs;
    const r = await cloudApi('/api/maps/sync', { method: 'POST', json: body, ms: 20000 });
    if (r.status === 401) { cloud.authed = false; cloud.user = null; setCloudStatus('signedout'); return; }
    if (!r.ok || !r.data || !r.data.success) throw new Error('sync ' + r.status);
    marks.forEach(([kind, id, h]) => { if (h === null) delete cloud.meta.known[kind][id]; else cloud.meta.known[kind][id] = h; });
    if (prefs) cloud.meta.prefsHash = ph;
    applyPulled(r.data);
    cloud.meta.since = r.data.serverTime || Date.now(); saveCloudMeta();
    cloud.last = Date.now(); cloud.retry = 0;
    if (first && !r.data.prefs) { cloud.meta.prefsHash = ''; cloud.meta.since = cloud.meta.since || 1; cloud.again = true; }   // cloud had no settings: push ours next round
    setCloudStatus('ok');
  } catch (e) {
    cloud.retry = Math.min(cloud.retry + 1, 5); setCloudStatus('offline');
    clearTimeout(cloud.timer); cloud.timer = setTimeout(() => cloudSync('retry'), Math.min(300000, 15000 * 2 ** cloud.retry));
  } finally {
    cloud.busy = false;
    if (cloud.again && cloud.authed) { cloud.again = false; setTimeout(() => cloudSync('quiet'), 300); }
  }
}

// trip recording (hooks called from the navigation engine)
const trip = { cur: null };
function navHookStart() {
  const r = state.routeData, here = state.userLoc ? findPlaceNear([state.userLoc.lon, state.userLoc.lat], 120) : null;
  trip.cur = { id: newId(), startedAt: Date.now(), distM: 0, maxSpeed: 0, last: null, from: here ? here.name : (state.startPoint && state.startPoint.name) || 'Current location', to: (state.endPoint && state.endPoint.name) || '', engine: r && r._engine === 'TomTom' ? 'tomtom' : 'osm', profile: state.routeProfile };
  share.lastSent = 0;
}
function navHookTick(lon, lat, speed, now, route) {
  const c = trip.cur;
  if (c) { if (c.last) { const d = distanceMeters(c.last[0], c.last[1], lon, lat); if (d > 2 && d < 500) c.distM += d; } c.last = [lon, lat]; if (speed != null && speed > c.maxSpeed && speed < 120) c.maxSpeed = speed; }
  shareTick(route, lon, lat, speed, now);
}
function navHookStop(arrived) {
  const c = trip.cur; trip.cur = null;
  if (share.active) { if (arrived) { shareSend({ arrived: true }); share.active = false; share.token = null; syncSharePill(); } else stopShare(true); }
  if (!c || S.tripLog === false) return;
  const dur = Math.round((Date.now() - c.startedAt) / 1000);
  if (dur < 60 || c.distM < 200) return;                                     // ignore aborted starts
  state.trips.unshift({ id: c.id, startedAt: c.startedAt, durationS: dur, distanceM: Math.round(c.distM), from: c.from, to: c.to, engine: c.engine, profile: c.profile, maxSpeed: Math.round(c.maxSpeed * 10) / 10, updatedAt: Date.now() });
  saveTrips(); renderRoutesTrips();
}

// ───────── live ETA share ─────────
const share = { active: false, token: null, url: '', lastSent: 0, busy: false };
function syncSharePill() { const p = $('share-pill'); if (p) p.hidden = !share.active; document.body.classList.toggle('sharing', share.active); }
async function startShare() {
  if (!cloud.authed) { return false; }
  const route = state.routeData, dest = state.endPoint; if (!route || !dest) { showToast('Pick a destination first'); return true; }
  const remain = state.navigationActive && nav.last ? remainingTime(route, nav.idx, nav.along) : route.duration;
  const body = { destName: dest.name || 'my destination', destCenter: dest.lngLat, etaMs: Date.now() + remain * 1000 };
  if (state.userLoc) body.center = [state.userLoc.lon, state.userLoc.lat];
  const r = await cloudApi('/api/maps/share', { method: 'POST', json: body }).catch(() => null);
  if (!r || !r.ok || !r.data || !r.data.token) { showToast(r && r.status === 429 ? 'Too many share links. Try again later.' : 'Could not start sharing'); return true; }
  share.active = true; share.token = r.data.token; share.lastSent = Date.now();
  share.url = new URL('track.html', location.href).href.split('#')[0] + '#' + r.data.token;
  syncSharePill();
  const text = `Follow my trip to ${body.destName} live:`;
  if (navigator.share) { try { await navigator.share({ title: 'Follow my trip', text, url: share.url }); } catch { } }
  else { try { await navigator.clipboard.writeText(`${text} ${share.url}`); showToast('Live link copied'); } catch { showToast(share.url); } }
  return true;
}
async function shareSend(extra) {
  if (!share.active || !share.token || share.busy) return;
  share.busy = true; share.lastSent = Date.now();
  try { const r = await cloudApi('/api/maps/share/' + share.token, { method: 'PUT', json: extra, ms: 8000 }); if (r.status === 410 || r.status === 404) { share.active = false; share.token = null; syncSharePill(); } } catch { } finally { share.busy = false; }
}
function shareTick(route, lon, lat, speed, now) {
  if (!share.active || now - share.lastSent < 12000) return;
  const rem = Math.max(0, route._len - nav.along);
  shareSend({ center: [lon, lat], speed: speed || 0, heading: nav.last && nav.last.heading != null && !isNaN(nav.last.heading) ? nav.last.heading : undefined, remainingM: Math.round(rem), etaMs: now + remainingTime(route, nav.idx, nav.along) * 1000, arrived: nav.arrived || undefined });
}
async function stopShare(tell) {
  const tok = share.token; share.active = false; share.token = null; syncSharePill();
  if (tok) { try { await cloudApi('/api/maps/share/' + tok, { method: 'DELETE', ms: 6000 }); } catch { } if (tell) showToast('Stopped sharing'); }
  if ($('settings-sheet').classList.contains('show')) renderSettings();
}

// fly-over of the chosen route
let fly = null;
function stopFly(fit) {
  if (!fly) return; cancelAnimationFrame(fly.raf); const tmp = fly.tmp3d; fly = null; $('card-fly').classList.remove('on');
  if (tmp && !S.buildings3D) disable3DBuildings();
  if (fit && state.routeData) fitRoute(state.routeData);
}
$('card-fly').addEventListener('click', () => {
  if (fly) { stopFly(true); return; }
  const r = state.routeData; if (!r) return;
  const c = r.geometry.coordinates, cum = r._cum, D = cum[cum.length - 1];
  const dur = Math.min(45000, Math.max(9000, D / 1000 * 2500)), t0 = performance.now();
  fly = { raf: 0, b: null, tmp3d: !map.getLayer('3d-buildings') }; $('card-fly').classList.add('on');
  if (fly.tmp3d) enable3DBuildings();
  const frame = now => {
    if (!fly) return;
    const p = Math.min(1, (now - t0) / dur), d = p * D, i = Math.min(idxAt(cum, d), c.length - 2);
    const a = c[i], b = c[i + 1], f = Math.max(0, Math.min(1, (d - cum[i]) / (cum[i + 1] - cum[i] || 1)));
    const lon = a[0] + (b[0] - a[0]) * f, lat = a[1] + (b[1] - a[1]) * f, la = c[Math.min(idxAt(cum, d + 150), c.length - 1)];
    const brg = bearing(lat, lon, la[1], la[0]);
    fly.b = fly.b == null ? brg : fly.b + (((brg - fly.b + 540) % 360) - 180) * 0.08;
    map.jumpTo({ center: [lon, lat], bearing: fly.b, pitch: 66, zoom: 16.6 });
    if (p < 1) fly.raf = requestAnimationFrame(frame); else stopFly(true);
  };
  map.stop(); fly.raf = requestAnimationFrame(frame);
});
map.on('dragstart', () => stopFly(false));

function ensureMeasureLayers() {

  map.addLayer({ id: 'measure-line', type: 'line', source: 'measure', filter: ['==', ['geometry-type'], 'LineString'], layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#e8c97a', 'line-width': 3, 'line-dasharray': [1.5, 1.2] } });

  if (measurePts.length > 1) feats.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: measurePts } });

}

    case 'voice': syncVoiceButton(); if (!val && HAS_TTS) try { speechSynthesis.cancel(); } catch { } break;
    case 'voiceRate': speak('In a quarter mile, turn right.'); break;
    case 'lanes': if (state.navigationActive) { nav.rendered = -1; updateNavUI(); } break;
    case 'speedLimit': if (!val) $('speed-limit').classList.remove('show'); break;
    case 'keepAwake': if (state.navigationActive) val ? requestWakeLock() : releaseWakeLock(); break;
  }
}
$('settings-body').addEventListener('click', async e => {
  const t = e.target;
  const sg = t.closest('[data-seg] button');
  if (sg) { const key = sg.parentElement.dataset.seg, raw = sg.dataset.v; applySetting(key, raw === 'true' ? true : raw === 'false' ? false : key === 'voiceRate' ? Number(raw) : raw); renderSettings(); return; }
  const tg = t.closest('[data-tog]'); if (tg) { applySetting(tg.dataset.tog, !S[tg.dataset.tog]); renderSettings(); return; }
  const sp = t.closest('[data-special]');
  if (sp && sp.dataset.special === 'safariTab') { safariTabMode = !safariTabMode; store.set(LS.safari, safariTabMode ? '1' : '0'); showToast(safariTabMode ? 'On. Remove and re-add the Home Screen icon to apply.' : 'Off. Remove and re-add the Home Screen icon to apply.'); setTimeout(() => location.reload(), 1400); return; }
  const st = t.closest('[data-style]');
  if (st) { const k = st.dataset.style; if (k === S.style) return; S.style = k; saveS(); styleFell = false; applyTheme(); map.setStyle(CONFIG.STYLES[k]); renderSettings(); return; }
  if (t.closest('#voice-test')) { speak('In a quarter mile, turn right onto Main Street.'); return; }
  if (t.closest('#tt-save')) { store.set(LS.key, $('tt-key').value.trim()); location.reload(); return; }
  if (t.closest('#install-app-btn')) {
    if (deferredInstall) { deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; }
    else if (IS_IOS) showToast('On iPhone: tap Share, then Add to Home Screen'); else showToast('Use your browser menu → Install app');
  }
});
$('settings-body').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-tog],[data-special],[data-style]')) { e.preventDefault(); e.target.click(); } });
$('settings-body').addEventListener('change', e => { if (e.target.id === 'voice-pick') { store.set(LS.voice, e.target.value); pickVoice(); speak('In a quarter mile, turn right.'); } });

// ───────── keyboard (laptop) ─────────
document.addEventListener('keydown', e => {
  const typing = e.target.matches && e.target.matches('input, textarea, select');
  if (e.key === 'Escape') {
    $('search-results').classList.remove('show'); document.querySelectorAll('.ac-box.show').forEach(b => b.classList.remove('show'));
    if (backdrop.classList.contains('show')) closeSheets(); else if (measuring) measureOff(); else if (fly) stopFly(true);
    else if (!state.navigationActive && card.classList.contains('show') && !typing) closeCard();
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); searchInput.focus(); }
  else if (e.key === 'l') $('locate-btn').click();
  else if (e.key === 'n') $('compass-btn').click();
  else if (e.key === 'm' && state.navigationActive) $('nav-voice-btn').click();
  else if (e.key === 'Enter' && !state.navigationActive && card.classList.contains('show') && !$('card-start').disabled && !backdrop.classList.contains('show')) $('card-start').click();
});

// ───────── iOS install nudge ─────────
document.body.classList.toggle('standalone', IS_STANDALONE);
if (IS_IOS && /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent) && !IS_STANDALONE && store.get(LS.install) !== '1') {
  const b = document.createElement('div'); b.id = 'ios-install-banner';
  b.innerHTML = '<span>Install <b>Wizard Maps</b>: tap <b>Share</b>, then <b>Add to Home Screen</b>.</span><button aria-label="Dismiss" data-icon="close"></button>';
  document.body.appendChild(b); hydrateIcons(b); requestAnimationFrame(() => b.classList.add('show'));
  b.querySelector('button').addEventListener('click', () => { b.classList.remove('show'); store.set(LS.install, '1'); });
}

// ───────── init ─────────
syncVoiceButton(); renderChips(); renderSettings(); applyTheme(); applyScale();
map.on('load', () => {
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'geolocation' }).then(r => { if (r.state === 'granted') { state.centerOnFix = true; tryAcquireLocation(); } }).catch(() => { });
  }
});

</script>
</body>
