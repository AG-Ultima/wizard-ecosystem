<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizard Ecosystem Launcher</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #030614 0%, #0a0f1a 100%);
            height: 100vh;
            overflow: hidden;
        }
        
        /* Custom Title Bar */
        .title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(10, 15, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(139, 92, 246, 0.3);
            -webkit-app-region: drag;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10000;
        }
        
        .title-bar-drag {
            -webkit-app-region: drag;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .nav-buttons {
            -webkit-app-region: no-drag;
            display: flex;
            gap: 8px;
            margin-left: 16px;
        }
        
        .nav-btn {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 8px;
            padding: 6px 12px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            -webkit-app-region: no-drag;
        }
        
        .nav-btn:hover {
            background: rgba(139, 92, 246, 0.4);
            transform: translateY(-1px);
        }
        
        .back-btn {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            border-color: transparent;
        }
        
        .title-icon {
            font-size: 20px;
        }
        
        .title-text {
            font-size: 14px;
            font-weight: 500;
            color: #c4b5fd;
        }
        
        .window-controls {
            -webkit-app-region: no-drag;
            display: flex;
            gap: 8px;
        }
        
        .window-control {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .window-control:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .window-control.close:hover {
            background: #ef4444;
        }
        
        /* Webview Container */
        .webview-container {
            position: fixed;
            top: 49px;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        webview {
            width: 100%;
            height: 100%;
        }
        
        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 49px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #030614;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s;
        }
        
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(139, 92, 246, 0.2);
            border-top-color: #8b5cf6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 20px;
            color: #9ca3af;
            font-size: 14px;
        }
        
        /* Quick Access Buttons */
        .quick-apps {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 10001;
        }
        
        .quick-app-btn {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            border: none;
            border-radius: 50px;
            padding: 10px 20px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .quick-app-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }
        
        /* Notification */
        .notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, #1a1035, #0d0a1f);
            border: 1px solid #8b5cf6;
            border-radius: 50px;
            padding: 10px 24px;
            color: white;
            z-index: 10002;
            transition: transform 0.3s;
        }
        
        .notification.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <!-- Custom Title Bar -->
    <div class="title-bar">
        <div class="title-bar-drag">
            <span class="title-icon">🧙</span>
            <div class="nav-buttons">
                <button class="nav-btn back-btn" id="back-to-hub-btn">🏠 Back to Hub</button>
                <button class="nav-btn" id="reload-btn">↻ Reload</button>
            </div>
            <span class="title-text">Wizard Ecosystem</span>
        </div>
        <div class="window-controls">
            <div class="window-control minimize" id="win-minimize">─</div>
            <div class="window-control maximize" id="win-maximize">□</div>
            <div class="window-control close" id="win-close">✕</div>
        </div>
    </div>
    
    <!-- Webview Container -->
    <div class="webview-container">
        <webview id="main-webview" src="https://www.wizardecosystem.dpdns.org" allowpopups="true"></webview>
    </div>
    
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div style="text-align: center;">
            <div class="spinner"></div>
            <div class="loading-text">🧙 Summoning the Wizard...</div>
        </div>
    </div>
    
    <!-- Quick Access Buttons -->
    <div class="quick-apps">
        <button class="quick-app-btn" data-app="ai" data-url="https://wizardai.dpdns.org">
            🧠 AI
        </button>
        <button class="quick-app-btn" data-app="search" data-url="https://wizardecosystem.dpdns.org/search">
            🔍 Search
        </button>
        <button class="quick-app-btn" data-app="mail" data-url="https://wizardecosystem.dpdns.org/mail">
            📧 Mail
        </button>
        <button class="quick-app-btn" data-app="calendar" data-url="https://wizardecosystem.dpdns.org/calendar">
            📅 Calendar
        </button>
        <button class="quick-app-btn" data-app="chat" data-url="https://wizardecosystem.dpdns.org/chat">
            💬 Chat
        </button>
    </div>
    
    <div id="notification" class="notification"></div>
    
    <script>
        const webview = document.getElementById('main-webview');
        const loadingOverlay = document.getElementById('loading-overlay');
        const notification = document.getElementById('notification');
        
        function showNotification(msg, isError = false) {
            notification.textContent = msg;
            notification.style.borderColor = isError ? '#ef4444' : '#8b5cf6';
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), 3000);
        }
        
        // Navigation functions
        function goBackToHub() {
            webview.loadURL('https://www.wizardecosystem.dpdns.org');
            showNotification('🏠 Returning to Hub...');
        }
        
        function reloadWebview() {
            webview.reload();
            showNotification('↻ Reloading...');
        }
        
        // Handle webview loading
        webview.addEventListener('did-start-loading', () => {
            loadingOverlay.classList.remove('hidden');
        });
        
        webview.addEventListener('did-stop-loading', () => {
            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
            }, 500);
        });
        
        webview.addEventListener('did-finish-load', () => {
            loadingOverlay.classList.add('hidden');
            showNotification('✨ Wizard Ecosystem loaded!');
        });
        
        // Handle new window requests (open in separate window)
        webview.addEventListener('new-window', (e) => {
            e.preventDefault();
            const url = e.url;
            
            // Determine which app to open
            if (url.includes('wizardai.dpdns.org')) {
                window.electronAPI.openApp('ai', 'Wizard AI', url);
            } else if (url.includes('/search')) {
                window.electronAPI.openApp('search', 'Wizard Search', url);
            } else if (url.includes('/mail')) {
                window.electronAPI.openApp('mail', 'Wizard Mail', url);
            } else if (url.includes('/calendar')) {
                window.electronAPI.openApp('calendar', 'Wizard Calendar', url);
            } else if (url.includes('/chat')) {
                window.electronAPI.openApp('chat', 'Wizard Chat', url);
            } else {
                window.electronAPI.openApp('external', 'Wizard', url);
            }
        });
        
        // Quick app buttons
        document.querySelectorAll('.quick-app-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const appId = btn.dataset.app;
                const url = btn.dataset.url;
                const titles = {
                    ai: 'Wizard AI',
                    search: 'Wizard Search',
                    mail: 'Wizard Mail',
                    calendar: 'Wizard Calendar',
                    chat: 'Wizard Chat'
                };
                window.electronAPI.openApp(appId, titles[appId], url);
                showNotification(`🚀 Opening ${titles[appId]}...`);
            });
        });
        
        // Navigation buttons
        document.getElementById('back-to-hub-btn').addEventListener('click', goBackToHub);
        document.getElementById('reload-btn').addEventListener('click', reloadWebview);
        
        // Window controls
        document.getElementById('win-minimize').addEventListener('click', () => {
            window.electronAPI.minimizeWindow();
        });
        
        document.getElementById('win-maximize').addEventListener('click', () => {
            window.electronAPI.maximizeWindow();
        });
        
        document.getElementById('win-close').addEventListener('click', () => {
            window.electronAPI.closeWindow();
        });
        
        // Listen for events from main process
        window.electronAPI.onShowAbout(() => {
            showNotification('🧙 Wizard Ecosystem v1.0 - Built by Arnav Gupta');
        });
        
        window.electronAPI.onOpenSettings(() => {
            showNotification('⚙️ Settings panel coming soon!');
        });
        
        window.electronAPI.onCheckUpdates(() => {
            showNotification('✅ You are running the latest version!');
        });
        
        window.electronAPI.onShowShortcuts(() => {
            showNotification('⌘/Ctrl + 1-5: Open apps | ⌘/Ctrl + H: Back to Hub | ⌘/Ctrl + R: Reload');
        });
        
        // Focus main window when clicking on title bar
        document.querySelector('.title-bar-drag').addEventListener('click', () => {
            window.electronAPI.focusMain();
        });
        
        console.log('🧙 Wizard Ecosystem Launcher ready!');
    </script>
</body>
</html>
